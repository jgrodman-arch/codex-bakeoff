              : chunkLaunchActive()
              ? `<button type="button" class="button button--primary" disabled>Preparing chunks…</button>`
              : configurationLocked
              ? `<button type="button" class="button button--primary" data-action="go-step" data-step="${state.report ? "results" : "run"}">Return to ${state.report ? "results" : "run"}</button>`
              : `<button type="button" class="button button--primary" data-action="approve-configuration" ${nextDisabled ? "disabled" : ""}>
                  ${loading
                    ? '<span class="spinner" aria-hidden="true"></span>Loading configuration…'
                    : state.busy === "attribution"
                      ? '<span class="spinner" aria-hidden="true"></span>Checking repository…'
                      : state.busy === "prepare"
                        ? '<span class="spinner" aria-hidden="true"></span>Checking configuration…'
                        : state.busy === "start"
                          ? '<span class="spinner" aria-hidden="true"></span>Starting…'
                          : isThreadBatch() ? `Start ${state.selectedThreads.length} threads`
                          : state.replayMode === "chunks"
                            ? `Start ${remainingUnits().length} ${remainingUnits().length === 1 ? "chunk" : "chunks"}`
                            : gaps.length
                            ? "Start with capability gaps"
                            : draft.models.length === 1 ? "Start replay" : "Start replays"}
                </button>`}
          </div>
          `;
      }

      function normalizedPhases(run) {
        const provided = asArray(run?.phases);
        if (provided.length) {
          return provided.flatMap((item) => {
            if (!isObject(item)) return [];
            const id = text(item.id || item.phase);
            if (!id) return [];
            return [{
              id,
              label: text(item.label, DEFAULT_PHASES.find(([value]) => value === id)?.[1] || titleCase(id)),
              status: text(item.status, "waiting").toLowerCase(),
            }];
          });
        }
        const current = text(run?.phase);
        const index = DEFAULT_PHASES.findIndex(([id]) => id === current);
        const failed = ["failed", "cancelled", "canceled"].includes(text(run?.status).toLowerCase());
        return DEFAULT_PHASES.map(([id, label], itemIndex) => ({
          id,
          label,
          status:
            itemIndex < index ? "complete"
              : itemIndex === index ? (failed ? "failed" : "running")
                : "waiting",
        }));
      }

      function renderRunVariants(results = false) {
        const entries = [...state.runs,...state.runErrors].filter((entry) =>
          !results || (isThreadBatch() ? (entry.run?.thread_id || entry.thread_id) === state.run?.thread_id
            : state.replayMode !== "chunks" || entry.unitNumber === resultUnit()?.number)).sort((a,b)=>
          (state.replayMode === "chunks" ? (a.unitNumber || 0) - (b.unitNumber || 0) : 0) ||
          (DEFAULT_MODEL_IDS.indexOf(a.model)+1||99)-(DEFAULT_MODEL_IDS.indexOf(b.model)+1||99));
        if (entries.length < 2 && state.replayMode !== "chunks") return "";
        const html = escapeHtml;
        const color = (value, other, higher = false) => comparisonClass(
          parseFloat(higher ? other : value), parseFloat(higher ? value : other)
        ).replace(" metric--", "v-");
        return `${renderPendingChunks()}<div class="variant-grid" aria-label="${state.replayMode === "chunks" ? "Chunk replays" : "Parallel replay variants"}">${entries.map((entry) => {
          const status = text(entry.run?.status, entry.error ? "failed" : "running");
          const failed = ["failed", "cancelled", "canceled"].includes(status);
          const modelLabel = asArray(state.models).find(({ id }) => id === entry.model)?.label || entry.model;
          const label = isThreadBatch() && !results ? `${text(entry.run?.thread_title || entry.thread_title, "Thread")} · ${modelLabel}`
            : entry.unitNumber ? `Chunk ${entry.unitNumber} · ${modelLabel}` : modelLabel;
          const outcome = entry.report && outcomeSummary(entry.report.evaluation || {});
          const scores = Object.fromEntries(outcome?.score.split("\n").map((value) => value.split(": ")) || []);
          const shared = entry.report?.historical_usage_shared === true;
          const metrics = [
            ["Score", text(scores["Historical Claude"], "Unavailable"), text(scores["Codex replay"], "Unavailable"), String, true],
            ["Cost", shared ? null : entry.report?.estimated_cost?.claude?.usd, entry.report?.estimated_cost?.codex?.usd, formatCost],
            ["Time", shared ? null : entry.report?.historical_model_request_seconds, entry.report?.codex_execution?.elapsed_seconds, formatDuration],
          ];
          const active = entry.id && entry.id === state.runId;
          return `<section class="panel vc${active ? " vc-a" : ""}"${active ? ' aria-current="true"' : ""}>
<button type="button" class="v-open" data-action="select-run" data-run-id="${html(entry.id)}" ${!entry.id || results && !entry.report ? "disabled" : ""}>
<span class="vh"><strong>${html(label)}</strong>${active ? `<span class="vi">Viewing ${results ? "result" : "progress"}</span>` : ""}</span>
<span class="pill ${successfulRunStatus(status) ? "pill--good" : failed ? "pill--bad" : ""}">${html(titleCase(status))}</span>
${outcome ? "" : `<span class="vs">${html(entry.error || entry.run?.error || titleCase(entry.run?.phase || "Starting"))}</span>`}
<span class="vm"><span class="vp"><span></span><strong>Historical</strong><strong>Codex</strong></span>
${metrics.map(([name, historical, codex, format, higher]) => `<span class="vp"><span>${name}</span><strong class="${color(historical, codex, higher)}">${html(shared && name !== "Score" ? "Shared" : format(historical))}</strong><strong class="${color(codex, historical, higher)}">${html(format(codex))}</strong></span>`).join("")}</span>
${shared ? '<span class="vs">No standalone usage — shared across chunks</span>' : ""}</button>
${entry.id && !terminalRunStatus(status) ? `<button type="button" class="button button--danger" data-action="cancel-run" data-run-id="${html(entry.id)}">Cancel</button>` : ""}
          </section>`;
        }).join("")}</div>`;
      }

      function renderRunStep() {
        if (state.batchId && !state.run) {
          return `${pageHeading("Selected threads", state.batch?.starting ? "Starting the threads" : "The threads could not start",
            state.batch?.starting ? "The controller is creating the selected runs. Progress refreshes automatically."
              : "Review the launch errors below. Open a new Codex task to try another replay.")}
            ${state.runErrors.map((error) => `<div class="banner banner--error"><div class="banner__body"><strong>${escapeHtml(error.thread_title || error.thread_id)} · ${escapeHtml(error.model)}</strong><p>${escapeHtml(error.error)}</p></div></div>`).join("")}
            <button type="button" class="button" data-action="refresh-run" ${state.busy ? "disabled" : ""}>Refresh status</button>`;
        }
        const run = isObject(state.run) ? state.run : {};
        const status = text(run.status, "running").toLowerCase();
        const running = state.runs.some((entry) => !terminalRunStatus(entry.run?.status));
        const failed = !running && ["failed", "cancelled", "canceled"].includes(status);
        const completed = !running && successfulRunStatus(status);
        const phases = normalizedPhases(run);
        const events = asArray(run.events).filter(isObject).slice(-12).reverse();
        const runLog = text(run.run_log);
        return `
          ${pageHeading(
            threadStepEyebrow("Run in progress"),
            completed ? "The comparison report is ready"
              : failed ? "The replay stopped"
                : "Running the isolated replay",
            completed
              ? "Implementation, verification, and review completed."
              : failed
                ? "The run did not continue after this failure."
                : isThreadBatch()
                  ? "Selected threads run in isolated workspaces. Open finished comparisons while the others continue."
                : state.replayMode === "chunks"
                  ? "Chunks and selected models run in parallel in isolated workspaces."
                : state.runs.length > 1
                  ? "Selected variants run in parallel in isolated workspaces."
                  : "You can leave and reopen this page; progress is stored in the local run directory."
          )}
          ${failed
            ? `<div class="banner banner--error" role="alert">
                <span class="banner__mark" aria-hidden="true">!</span>
                <div class="banner__body">
                  <strong>${escapeHtml(titleCase(status))}</strong>
                  <p>${escapeHtml(run.error || "The replay could not continue.")}</p>
                </div>
              </div>`
            : ""}
          ${renderRunVariants()}
          ${state.runs.some((entry) => entry.report) ? `<div class="footer-actions footer-actions--configuration"><button type="button" class="button button--primary" data-action="go-step" data-step="results">View available results</button></div>` : ""}
          <div class="grid-2">
            <section class="panel" aria-labelledby="progress-heading">
              <div class="panel__header">
                <div>
                  <h2 id="progress-heading">Run phases</h2>
                  <p>Run <code>${escapeHtml(state.runId || run.id || run.run_id)}</code></p>
                </div>
                <span class="pill ${completed ? "pill--good" : failed ? "pill--bad" : ""}">
                  ${escapeHtml(titleCase(status))}
                </span>
              </div>
              <div class="panel__body">
                <ol class="phase-list">
                  ${phases.map((phase) => {
                    const statusClass = ["complete", "completed", "succeeded"].includes(phase.status)
                      ? "complete"
                      : ["failed", "cancelled", "canceled"].includes(phase.status)
                        ? "failed"
                        : phase.status === "running"
                          ? "running"
                          : "waiting";
                    return `
                      <li class="phase phase--${statusClass}">
                        <span class="phase__mark" aria-hidden="true">${statusClass === "complete" ? "✓" : statusClass === "failed" ? "!" : ""}</span>
                        <span class="phase__name">${escapeHtml(phase.label)}</span>
                        <span class="phase__state">${escapeHtml(titleCase(statusClass))}</span>
                      </li>
                    `;
                  }).join("")}
                </ol>
              </div>
            </section>
            <section class="panel" aria-labelledby="activity-heading">
              <div class="panel__header">
                <div>
                  <h2 id="activity-heading">Activity</h2>
                  <p>${run.started_at ? `Started ${escapeHtml(formatDate(run.started_at))}` : "Waiting for the first event"}</p>
                </div>
              </div>
              <div class="panel__body">
                ${events.length
                  ? `<ol class="activity">
                      ${events.map((event) => `
                        <li>
                          <time datetime="${escapeHtml(event.at || event.timestamp || "")}">${escapeHtml(formatTime(event.at || event.timestamp))}</time>
                          <span>${escapeHtml(event.summary || event.message || titleCase(event.phase || event.status))}</span>
                        </li>
                      `).join("")}
                    </ol>`
                  : `<p class="empty">No activity has been recorded yet.</p>`
                }
              </div>
            </section>
          </div>
          <section class="panel" aria-labelledby="run-log-heading" style="margin-top:14px">
            <div class="panel__header">
              <div>
                <h2 id="run-log-heading">Current run log</h2>
                <p>${run.log_path
                  ? `Streaming <code>${escapeHtml(run.log_path)}</code>`
                  : "Streaming recorded controller and worker output"}</p>
              </div>
              <span class="pill ${completed ? "pill--good" : failed ? "pill--bad" : ""}">
                ${terminalRunStatus(status) ? "Retained" : "Live"}
              </span>
            </div>
            <div class="panel__body">
              <pre id="run-log" class="run-log" tabindex="0" aria-live="polite">${escapeHtml(runLog || "Waiting for run output…")}</pre>
            </div>
          </section>
          <div class="footer-actions">
            <span class="footer-actions__note">
              ${completed ? "Loading the report…"
                : failed ? "To run another replay, open a new Codex task and invoke Codex Bakeoff."
                  : "Status refreshes automatically."}
            </span>
            ${failed
              ? `<button type="button" class="button" data-action="refresh-run" ${state.busy ? "disabled" : ""}>Refresh status</button>`
              : completed
                ? `<button type="button" class="button button--primary" data-action="load-report" ${state.busy ? "disabled" : ""}>
                    ${state.busy === "report" ? '<span class="spinner" aria-hidden="true"></span>Loading…' : "Open results"}
                  </button>`
                : `<button type="button" class="button" data-action="refresh-run" ${state.busy ? "disabled" : ""}>Refresh now</button>`
                  + `<button type="button" class="button button--danger" data-action="cancel-run" ${state.busy ? "disabled" : ""}>${state.busy === "cancel" ? '<span class="spinner" aria-hidden="true"></span>Cancelling…' : "Cancel run"}</button>`
            }
          </div>
        `;
      }

      function reportParts() {
        const report = isObject(state.report) ? state.report : {};
        const candidates = isObject(report.candidates) ? report.candidates : {};
        const claude = isObject(candidates.claude) ? candidates.claude : {};
        const codex = isObject(candidates.codex) ? candidates.codex : {};
        const baseline = isObject(report.baseline) ? report.baseline : {};
        const execution = isObject(report.codex_execution) ? report.codex_execution : {};
        const evaluation = isObject(report.evaluation) ? report.evaluation : {};
        const costs = isObject(report.estimated_cost) ? report.estimated_cost : {};
        const usage = isObject(report.normalized_usage) ? report.normalized_usage : {};
        return { report, baseline, candidates, claude, codex, execution, evaluation, costs, usage };
      }

      function comparisonClass(value, otherValue) {
        if (value == null || otherValue == null) return "";
        const own = Number(value), other = Number(otherValue);
        if (!Number.isFinite(own) || !Number.isFinite(other) || own < 0 || other < 0 || own === other) return "";
        return own < other ? " metric--better" : " metric--worse";
      }

      function usageMetricRows(usage) {
        const metrics = [
          ["Total input processed", "total_input_tokens", "All input tokens processed: ordinary input, cache reads, and cache writes."],
          ["Ordinary input tokens", "ordinary_input_tokens", "Input tokens processed without being read from or written to a provider cache."],
          ["Cache-read tokens", "cached_input_tokens", "Previously cached input tokens reused by the model."],
          ["Cache-write tokens", "cache_write_tokens", "Input tokens written to the provider cache for possible reuse."],
          ["Output tokens", "output_tokens", "Tokens generated by the model in its responses."],
        ];
        return metrics.map(([label, key, description]) => `<div class="metric"><dt class="token-label" tabindex="0">${escapeHtml(label)}<span class="token-tooltip" role="tooltip">${escapeHtml(description)}</span></dt><dd>${escapeHtml(formatTokens(usage?.[key]))}</dd></div>`).join("");
      }

      function providerCard(name, candidate, execution, cost, usage, isCodex, otherElapsed, otherCost) {
        const model = text(candidate.model || (isCodex ? execution.model : ""), "Unavailable");
        const shared = state.report?.historical_usage_shared === true;
        const elapsed = isCodex ? execution.elapsed_seconds : state.report?.historical_model_request_seconds;
        return `<article class="provider"><h2>${escapeHtml(name)}</h2><dl class="metrics">
<div class="metric"><dt>Model</dt><dd><code>${escapeHtml(model)}</code></dd></div>
<div class="metric${shared ? "" : comparisonClass(elapsed, otherElapsed)}"><dt>Execution time</dt><dd>${escapeHtml(shared && !isCodex ? "Shared" : formatDuration(elapsed))}</dd></div>
<div class="metric${shared ? "" : comparisonClass(cost?.usd, otherCost?.usd)}"><dt>Estimated cost</dt><dd>${escapeHtml(shared && !isCodex ? "Shared" : formatCost(cost?.usd))}</dd></div>
${shared && !isCodex ? '<div class="metric">No standalone usage — shared across chunks</div>' : usageMetricRows(usage)}</dl></article>`;
      }

      function evaluationTable(evaluation) {
        const mapping=evaluation.candidate_mapping||{A:"claude",B:"codex"},html=escapeHtml;
        const name=id=>({codex:"Codex replay",claude:"Historical Claude"}[mapping[id]]||{tie:"Tie",not_applicable:"N/A"}[id]||titleCase(id)),label=id=>titleCase(id).replace(/ .+/g,s=>s.toLowerCase());
        const checks={
          required_behavior:"Required behavior implemented",stated_constraints:"Stated constraints followed",complete_integration:"Changes completely integrated",usable_result:"Result is usable",project_conventions:"Project conventions followed",
          relevant_files:"Only relevant files changed",necessary_changes:"Only necessary changes made",preserved_behavior:"Existing behavior preserved",invalid_inputs:"Invalid inputs handled appropriately",boundary_conditions:"Boundary conditions handled",failure_handling:"Failures handled appropriately",state_consistency:"State remains consistent",
          preserved_user_work:"Existing user work preserved",authorized_actions:"Only authorized actions performed",protected_sensitive_data:"Sensitive data protected",limited_external_changes:"External changes appropriately limited",truthful_summary:"Summary is truthful",accurate_outcomes:"Observed outcomes accurately reported",disclosed_limitations:"Limitations disclosed",supported_claims:"Claims supported by evidence",
        };
        const rows=[],status=value=>value===1?"Pass":value===0?"Fail":"N/A",
          score=value=>Number.isFinite(value)?`${Math.round(value*100)}%`:"N/A",
          cell=(value,why)=>`<td>${html(value)}${why?`<small>${html(text(why).replace(/(?:sk-(?:ant-)?|gh[pousr]_|github_pat_)[\w-]{12,}|(?:api[_-]?key|(?:auth|access)[_-]?token|password|secret)\s*[:=]\s*\S+|[a-z]:[\\/]\S+|\/[a-z]+\/\S+|\b(?:anthropic|claude|codex|openai|chatgpt|gpt-[\w.-]+|fable|opus|sonnet|haiku)\b/gi,"[REDACTED]").slice(0,280))}</small>`:""}</td>`,
          row=(evaluator,model,label,first,second,winner,a,b)=>rows.push(`<tr><td>${evaluator?`${html(evaluator)}<br><code>${html(model)}</code>`:""}</td><td>${evaluator?`<strong>${html(label)}</strong>`:html(label)}</td>${cell(first,a)}${cell(second,b)}<td><strong>${html(winner)}</strong></td></tr>`);
        for(const review of asArray(evaluation.reviews)){
          if(!isObject(review))continue;
          const evaluator=review.evaluator||"Unknown",model=review.model||"Unknown",ballot=review.ballot?.dimensions;
          if(!isObject(ballot)||!Object.keys(ballot).length){
            if(["failed","invalid"].includes(review.status))row(evaluator,model,review.error||"Review unavailable.","—","—",titleCase(review.status));
            continue;
          }
          for(const [dimension,decision] of Object.entries(ballot)){
            const first=decision.candidates.A,second=decision.candidates.B;
            const excluded=Array.isArray(evaluation.comparable_dimensions)&&!evaluation.comparable_dimensions.includes(dimension);
            row(evaluator,model,label(dimension)+(excluded?" (excluded from aggregate)":""),score(first.score),score(second.score),name(decision.winner));
            for(const [check,value] of Object.entries(first.checks))row("","",checks[check]||label(check),status(value),status(second.checks[check]),"",first.explanations?.[check],second.explanations?.[check]);
          }
        }
        for(const item of asArray(evaluation.evaluator_availability))if(item&&!item.available)row(item.id||"Unknown",item.model||"Unknown",item.reason||"Evaluator unavailable.","—","—","Skipped");
        return rows.length
          ? `<div class="table-wrap"><p class="lede">Scores average applicable checks. Pass: satisfied. Fail: failed. N/A: inapplicable or unsupported.</p><table><thead><tr><th>Evaluator</th><th>Dimension / check</th><th>${html(name("A"))}</th><th>${html(name("B"))}</th><th>Winner</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`
          : `<p class="empty">No validated blind review ballot is available.</p>`;
      }

      function renderResultsStep() {
        if (isThreadBatch() && state.batchView === "aggregate") return renderAggregateResults();
        const chunk = resultUnit(), navigation = renderChunkResults();
        if (chunk && !state.report) return `${navigation}${renderRunVariants(true)}<p class="empty">${escapeHtml(state.run?.error || "This chunk has no completed comparison report.")}</p>`;
        const { report, baseline, claude, codex, execution, evaluation, costs, usage } = reportParts();
        const outcome = outcomeSummary(evaluation, report.schema_version, costs);
        const limitations = asArray(report.limitations).map((item) => text(item)).filter(Boolean);
        const claudeElapsed = report.historical_model_request_seconds;
        const codexElapsed = execution.elapsed_seconds;
        return `
          ${navigation}
          ${renderBatchResultsNavigation()}
          <section class="result-hero" aria-labelledby="page-title">
            <div class="result-hero__header">
              <h1 id="page-title" class="eyebrow" tabindex="-1">${escapeHtml(isThreadBatch() ? state.run?.thread_title || "Thread comparison" : resultScope() || threadStepEyebrow("Comparison complete"))}</h1>
              <span>${escapeHtml(outcome.summary)}</span>
            </div>
            <div class="result-hero__outcomes">
              ${["price", "quality"].map((metric) => {
                const result = outcome[metric];
                return `<section class="result-outcome" aria-labelledby="${metric}-heading">
                  <h2 id="${metric}-heading" class="result-outcome__label">${titleCase(metric)}${result.winner ? " winner" : ""}</h2>
                  <p class="result-outcome__winner">${escapeHtml(result.winner || "Unavailable")}</p>
                  <dl class="result-outcome__values">${result.values.map(({ name, value }) => `<div${result.winner === name || result.winner === "Tie" ? ' class="result-outcome__best"' : ""}><dt>${escapeHtml(name)}</dt><dd>${escapeHtml(value)}</dd></div>`).join("")}</dl>
                  <p class="result-outcome__detail">${escapeHtml(result.detail)}</p>
                </section>`;
              }).join("")}
            </div>
            <p class="result-hero__note">Price: estimated API cost. Quality: LLM judge. ${escapeHtml(outcome.detail)}</p>
          </section>

          ${renderRunVariants(true)}

          <div class="provider-grid">${providerCard("Historical Claude", claude, execution, costs.claude, usage.claude, false, codexElapsed, costs.codex)}${providerCard("Codex replay", codex, execution, costs.codex, usage.codex, true, claudeElapsed, costs.claude)}</div>

          <section class="panel" aria-labelledby="evaluation-heading">
            <div class="panel__header">
              <div>
                <h2 id="evaluation-heading">Blind head-to-head review</h2>
                <p>Candidate identities were revealed only after each ballot was recorded.</p>
              </div>
            </div>
            <div class="panel__body panel__body--flush">
              ${evaluationTable(evaluation)}
            </div>
          </section>

          <section class="panel" aria-labelledby="evidence-heading">
            <div class="panel__header">
              <div>
                <h2 id="evidence-heading">Evidence and artifacts</h2>
                <p>Detailed prompts, patches, responses, and limitations remain available for inspection.</p>
              </div>
            </div>
            <div class="panel__body">
              <dl class="metrics">
                <div class="metric"><dt>Claude worktree</dt><dd><code>${escapeHtml(baseline.repository || "Unavailable")}</code></dd></div>
                <div class="metric"><dt>Codex worktree</dt><dd><code>${escapeHtml(execution.worktree || "Unavailable")}</code></dd></div>
              </dl>
              <details><summary>Reconstructed task prompt</summary><pre>${escapeHtml(report.original_request || "")}</pre></details>
              <details><summary>Claude patch</summary><pre>${escapeHtml(claude.diff || "No attributable Claude patch was recovered.")}</pre></details>
              <details><summary>Codex patch</summary><pre>${escapeHtml(codex.diff || "No Codex patch was recorded.")}</pre></details>
              <details><summary>Claude final response</summary><pre>${escapeHtml(report.historical_final_response || claude.final_response || "Unavailable.")}</pre></details>
              <details><summary>Codex final response</summary><pre>${escapeHtml(codex.final_response || execution.final_output || "Unavailable.")}</pre></details>
              <details>
                <summary>Confidence and limitations (${limitations.length})</summary>
                ${limitations.length
                  ? `<ul>${limitations.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`
                  : `<p class="empty">No limitations were recorded.</p>`}
              </details>
              <details><summary>Raw report JSON</summary><pre>${escapeHtml(safeJson(report))}</pre></details>
            </div>
          </section>

          <div class="footer-actions">
            <span class="footer-actions__note">
              ${state.reportPaths?.report_json
                ? `Saved to ${escapeHtml(state.reportPaths.report_json)}`
                : "The durable report remains in the local run directory."}
            </span>
            ${state.reportPaths?.report_json
              ? `<button type="button" class="button" data-action="copy-report-path">Copy report path</button>`
              : ""}
            ${state.reportPaths?.report_json
              ? `<button type="button" class="button" data-action="download-report" data-format="json">Download JSON</button>`
              : ""}
            ${state.reportPaths?.report_html
              ? `<button type="button" class="button" data-action="download-report" data-format="html">Download HTML report</button>`
              : ""}
            <span class="footer-actions__note">To run another replay, open a new Codex task and invoke Codex Bakeoff.</span>
          </div>
        `;
      }

      function renderContent() {
        if (!state.hostReady && state.error) {
          return `
            ${pageHeading(
              "Connection",
              "The controller could not connect",
              "This page must be opened from the installed Codex Bakeoff plugin."
            )}
            ${renderGlobalMessages()}
            <button type="button" class="button button--primary" data-action="retry-init">Try again</button>
          `;
        }
        const body =
          state.step === "configure" ? renderConfigureStep()
            : state.step === "run" ? renderRunStep()
                : state.step === "results" ? renderResultsStep()
                  : renderThreadStep();
        return `${renderGlobalMessages()}${body}`;
      }

      function render({ focus = false } = {}) {
        const previousLog = document.getElementById("run-log");
        const logScrollTop = previousLog?.scrollTop || 0;
        const logPinned = !previousLog || (
          previousLog.scrollHeight - previousLog.clientHeight - previousLog.scrollTop < 32
        );
        const prompt = document.getElementById("review-request");
        const promptFocused = prompt && document.activeElement === prompt;
        const promptSelection = promptFocused
          ? [prompt.selectionStart, prompt.selectionEnd]
          : null;
        const search = document.getElementById("thread-search");
        const searchSelection = search && document.activeElement === search
          ? [search.selectionStart, search.selectionEnd]
          : null;
        saveDraft();
        app.innerHTML = `
          ${state.pluginVersion
            ? `<div class="plugin-version">v${escapeHtml(state.pluginVersion)}</div>`
            : ""}
          <div class="layout">
            ${renderRail()}
            <main class="workspace" aria-labelledby="page-title">
              <div class="sr-only" aria-live="polite">
                ${escapeHtml(state.busy ? `${titleCase(state.busy)} in progress` : state.notice || "")}
              </div>
              ${renderContent()}
            </main>
          </div>
        `;
        const nextLog = document.getElementById("run-log");
        if (nextLog) {
          nextLog.scrollTop = logPinned ? nextLog.scrollHeight : logScrollTop;
        }
        if (promptSelection) {
          requestAnimationFrame(() => {
            const nextPrompt = document.getElementById("review-request");
            if (!nextPrompt) return;
            nextPrompt.focus();
            nextPrompt.setSelectionRange(...promptSelection);
          });
        } else if (searchSelection) {
          const nextSearch = document.getElementById("thread-search");
          if (nextSearch) {
            nextSearch.focus();
            nextSearch.setSelectionRange(...searchSelection);
          }
        } else if (focus) {
          requestAnimationFrame(() => document.getElementById("page-title")?.focus());
        }
      }

      function loadThreads(query = state.query, { append = false, debounce = false } = {}) {
        if (append && state.loading) return;
        window.clearTimeout(threadSearchTimer);
        const generation = ++threadLoadGeneration;
        const source = state.threadSource;
        const offset = append ? state.threads.length : 0;
        if (!append) {
          state.threads = [];
          state.totalThreads = 0;
        }
        state.loading = true;
        state.error = "";
        render();
        const load = async () => {
          try {
            const payload = await callTool("list_threads", {
              offset,
              limit: THREAD_PAGE_SIZE,
              ...(source ? { source } : {}),
              ...(query.trim() ? { query: query.trim() } : {}),
            });
            if (generation !== threadLoadGeneration) return;
            const threads = asArray(payload.threads);
            state.threads = append ? [...state.threads, ...threads] : threads;
            state.totalThreads = Number(payload.total) || state.threads.length;
            state.threadSource = text(payload.source, "imported");
            state.importedTotal = Number(payload.imported_total) || 0;
            state.sampleTotal = Number(payload.sample_total) || 0;
            state.hostReady = true;
          } catch (error) {
            if (generation !== threadLoadGeneration) return;
            state.error = error instanceof Error ? error.message : String(error);
          } finally {
            if (generation === threadLoadGeneration) {
              state.loading = false;
              render();
            }
          }
        };
        if (debounce) {
          threadSearchTimer = window.setTimeout(load, THREAD_SEARCH_DEBOUNCE_MS);
        } else {
          return load();
        }
      }

      async function initialize() {
        window.clearTimeout(threadSearchTimer);
        const threadGeneration = ++threadLoadGeneration;
        let synthesis = null;
        draftPersistenceReady = false;
        restoredDraft = null;
        state.step = "thread";
        state.controllerSessionId = "";
        state.loading = true;
        state.hostReady = false;
        state.error = "";
        state.notice = "";
        render();
        startControllerHeartbeat();
        try {
          const [statePayload, threadPayload] = await Promise.all([
            callTool("get_state", {}),
            callTool("list_threads", {
              offset: 0,
              limit: THREAD_PAGE_SIZE,
              ...(state.threadSource ? { source: state.threadSource } : {}),
              ...(state.query.trim() ? { query: state.query.trim() } : {}),
            }).catch((error) => {
              if (threadGeneration === threadLoadGeneration) throw error;
              return null;
            }),
          ]);
          const serverState = isObject(statePayload.state) ? statePayload.state : statePayload;
          state.controllerSessionId = text(serverState.controller_session_id);
          if (!state.controllerSessionId) {
            throw new Error("The local replay service did not return a controller instance.");
          }
          restoredDraft = loadDraft();
          state.selectedThreads = restoredDraft?.selectedThreads || [];
          restoreUnitState(restoredDraft);
          state.runRoot = text(serverState.run_root);
          state.pluginVersion = text(serverState.plugin_version);
          state.maxParallelRuns = Number.isInteger(serverState.max_parallel_runs) && serverState.max_parallel_runs > 0
            ? serverState.max_parallel_runs : 8;
          state.models = normalizeModels(serverState.models);
          setSelectedModels(restoredDraft?.selectedModels || []);
          restoreBatch(serverState);
          if (threadGeneration === threadLoadGeneration) {
            state.threads = asArray(threadPayload.threads);
            state.totalThreads = Number(threadPayload.total) || state.threads.length;
            state.threadSource = text(threadPayload.source, "imported");
            state.importedTotal = Number(threadPayload.imported_total) || 0;
            state.sampleTotal = Number(threadPayload.sample_total) || 0;
          }
          state.hostReady = true;

          const rememberedRunId = loadActiveRunId();
          const recent = asArray((rememberedRunId
            ? (await callTool("get_state", { run_id: rememberedRunId })).state
            : serverState).recent_runs).filter((run) =>
            isObject(run) && text(run.controller_session_id) === state.controllerSessionId &&
              (!run.batch_id || run.launch_failed !== true)
          );
          const active = recent.find((run) => currentRunId(run) === rememberedRunId)
            || recent.find((run) => !terminalRunStatus(run.status))
            || recent[0];
          if (active) {
            state.batchId = text(active.batch_id);
            const chunkRuns = !state.batchId && recoverRangeRuns(active);
            if (state.batchId) state.replayMode = "whole";
            if (!chunkRuns) { clearDraft(); restoredDraft = null; }
            const savedRunIds = Object.values(state.unitRuns).flat();
            state.runs = recent.filter((run) => run === active || (state.batchId
              ? run.batch_id === state.batchId : chunkRuns
              ? savedRunIds.includes(currentRunId(run)) || (run.thread_id === active.thread_id && run.start_message_uuid)
              : (
              run.launch_failed !== true && active.prepare_token_hash
              && run.prepare_token_hash === active.prepare_token_hash
            ))).map((run) => {
              const id = currentRunId(run);
              const unit = resultUnits(recent).find((item) => state.unitRuns[item.key]?.includes(id) ||
                (item.start_message_uuid === run.start_message_uuid && item.end_message_uuid === run.end_message_uuid));
              if (unit) state.unitRuns[unit.key] = stringList([...(state.unitRuns[unit.key] || []), id]);
              return { id, model: text(run.model), run, unitNumber: unit?.number };
            });
            if (state.batchId) state.selectedThreads = normalizeSelectedThreads(batchThreadResults().map((entry, index) => ({
              id: entry.id, number: index + 1, thread: { title: entry.title },
            })));
            if (state.submittingUnitKey) {
              if (!state.unitRuns[state.submittingUnitKey]?.length) {
                state.pendingUnitKeys = [];
                state.notice = "The last chunk launch could not be confirmed. Remaining chunks were paused.";
              }
              state.submittingUnitKey = "";
            }
            if (!state.batchId) state.runErrors = asArray(active.run_group_errors).filter(isObject);
            setSelectedModels(state.batch?.models?.length ? state.batch.models
              : restoredDraft?.selectedModels?.length ? restoredDraft.selectedModels : state.runs.map(({ model }) => model));
            activateRun(currentRunId(active));
            rememberActiveRun(state.runId);
            state.step = "run";
            if (state.pendingUnitKeys.length || state.runs.some((run) => successfulRunStatus(run.run.status))) {
              window.setTimeout(() => void refreshRun({ continuePolling: true }), 0);
            } else if (state.runs.some((run) => !terminalRunStatus(run.run.status))) {
              beginPolling();
            }
          } else if (state.batchId) {
            clearDraft();
            restoredDraft = null;
            state.step = "run";
            if (state.batch?.starting) beginPolling();
          } else if (restoredDraft?.selectedThreadId) {
            const selected = state.threads.find(
              (thread) => threadId(thread) === restoredDraft.selectedThreadId
            );
            state.selectedThreadId = restoredDraft.selectedThreadId;
            state.selectedThreadNumber = restoredDraft.selectedThreadNumber;
            state.selectedThread = selected || null;
            try {
              const payload = await callTool("inspect_thread", {
                thread_id: restoredDraft.selectedThreadId,
              });
              state.inspection = payload;
              state.actionableTurns = asArray(payload.replay?.actionable_user_turns || payload.thread?.actionable_user_turns);
              const models = normalizeModels(payload.models);
              if (models.length) state.models = models;
              setSelectedModels(restoredDraft.selectedModels);
              initializeClassifications();
              const fallbackRequest = text(payload.replay?.request || payload.thread?.request);
              applyDraftToInspection(restoredDraft);
              state.reviewDraft = state.reviewDraft || reviewDraftFromConfiguration();
              const batchDraft = isThreadBatch()
                ? state.selectedThreads.find((entry) => entry.id === state.selectedThreadId)?.draft : null;
              if (batchDraft?.reviewDraft) {
                state.reviewDraft = normalizeReviewDraft({ ...state.reviewDraft, ...batchDraft.reviewDraft });
                state.configurationDetailsOpen = batchDraft.detailsOpen;
                state.attributionEdits = batchDraft.attributionEdits;
                setSelectedModels(state.selectedModels);
              }
              state.promptGeneration = batchDraft?.promptGeneration || text(
                payload.replay?.request_generation?.method ||
                payload.thread?.request_generation?.method,
                "concatenated_fallback"
              );
              if (state.promptGeneration === "pending") {
                synthesis = {
                  threadId: restoredDraft.selectedThreadId,
                  fallbackRequest,
                };
              }
              state.step = restoredDraft.step === "thread" ? "thread" : "configure";
              if (state.replayMode === "chunks") {
                const units = replayUnits();
                const key = units.find((unit) => unit.key === state.activeUnitKey)?.key || units[0]?.key;
                state.reviewDraft = null;
                if (key) await editReplayUnit(key);
                synthesis = null;
              }
            } catch (error) {
              state.inspection = {
                replay: selected || { imported_thread_id: restoredDraft.selectedThreadId },
                diagnostics: [{
                  step: "inspection",
                  message: error instanceof Error ? error.message : String(error),
                }],
              };
              const saved = state.selectedThreads.find((entry) => entry.id === restoredDraft.selectedThreadId)?.draft;
              state.reviewDraft = normalizeReviewDraft(saved?.reviewDraft || restoredDraft.reviewDraft) || reviewDraftFromConfiguration();
              if (!saved) state.reviewDraft.request = "";
              else state.classifications = { ...saved.classifications };
              setSelectedModels(state.selectedModels);
              state.promptGeneration = saved?.promptGeneration || "concatenated_fallback";
              state.step = "configure";
              state.error = "";
            }
          }
        } catch (error) {
          state.error = error instanceof Error ? error.message : String(error);
          state.hostReady = false;
        } finally {
          draftPersistenceReady = state.hostReady;
          if (threadGeneration === threadLoadGeneration) state.loading = false;
          render({ focus: true });
        }
        if (synthesis) {
          void synthesizePrompt(synthesis.threadId, synthesis.fallbackRequest);
        }
        if (state.pendingUnitKeys.length) await advanceChunkQueue();
        if (!state.run && state.selectedThreadId && !text(state.reviewDraft?.repo)) {
          void inferWorkingDirectory(state.selectedThreadId);
        }
      }

      async function selectThread(id, number, { selected: suppliedThread, saved } = {}) {
        if (state.busy || state.run) return;
        const selected = suppliedThread || state.threads.find((thread) => threadId(thread) === id);
        if (!selected) return;
        if (!suppliedThread) state.selectedThreads = [{ id, number, thread: selected, draft: null }];
        let fallbackRequest = "";
        let shouldSynthesize = false;
        state.busy = "inspection";
        state.error = "";
        state.notice = "";
        state.selectedThreadId = id;
        state.selectedThreadNumber = Number.isInteger(number) && number > 0 ? number : 0;
        state.selectedThread = selected;
        state.replayMode = "whole";
        state.actionableTurns = [];
        state.dividers = [];
        state.activeUnitKey = "";
        state.unitDrafts = {};
        state.wholeDraft = null;
        state.attributionEdits = [];
        state.pendingUnitKeys = [];
        state.unitRuns = {};
        state.submittingUnitKey = "";
        state.inspection = null;
        state.classifications = Object.create(null);
        state.reviewDraft = null;
        state.configurationStep = 0;
        state.configurationMaxStep = 0;
        state.configurationDetailsOpen = false;
        state.reviewRevision += 1;
        state.promptGeneration = "";
        state.promptEditRevision = 0;
        state.promptSynthesisGeneration += 1;
        state.workingDirectoryEditRevision = 0;
        state.workingDirectoryGeneration += 1;
        state.workingDirectoryLoading = false;
        state.preparation = null;
        render();
        try {
          const payload = await callTool("inspect_thread", { thread_id: id });
          state.inspection = payload;
          state.actionableTurns = asArray(payload.replay?.actionable_user_turns || payload.thread?.actionable_user_turns);
          const models = normalizeModels(payload.models);
          if (models.length) state.models = models;
          setSelectedModels(state.selectedModels);
          initializeClassifications();
          state.reviewDraft = reviewDraftFromConfiguration();
          if (saved?.reviewDraft) {
            state.reviewDraft = normalizeReviewDraft({ ...state.reviewDraft, ...saved.reviewDraft, thread_id: id });
            for (const file of inspectionParts().files) {
              if (file.selectable !== false && saved.classifications[file.path]) {
                state.classifications[file.path] = saved.classifications[file.path];
              }
            }
            state.configurationDetailsOpen = saved.detailsOpen;
            state.attributionEdits = saved.attributionEdits;
            setSelectedModels(state.selectedModels);
          }
          fallbackRequest = text(payload.replay?.request || payload.thread?.request);
          state.promptGeneration = saved?.promptGeneration || text(
            payload.replay?.request_generation?.method ||
            payload.thread?.request_generation?.method,
            "concatenated_fallback"
          );
          shouldSynthesize = !id.startsWith("claude-sample:") && state.promptGeneration === "pending";
          state.workingDirectoryLoading = !id.startsWith("claude-sample:") && !saved?.reviewDraft?.repo;
          state.step = "configure";
        } catch (error) {
          state.inspection = {
            replay: selected,
            diagnostics: [{
              step: "inspection",
              message: error instanceof Error ? error.message : String(error),
            }],
          };
          initializeClassifications();
          state.reviewDraft = normalizeReviewDraft(saved?.reviewDraft) || reviewDraftFromConfiguration();
          if (saved) {
            state.classifications = { ...saved.classifications };
            state.attributionEdits = saved.attributionEdits;
            state.configurationDetailsOpen = saved.detailsOpen;
            setSelectedModels(state.selectedModels);
          }
          if (isThreadBatch()) state.error = error instanceof Error ? error.message : String(error);
          state.promptGeneration = saved?.promptGeneration || "concatenated_fallback";
          state.workingDirectoryLoading = !id.startsWith("claude-sample:") && !saved?.reviewDraft?.repo;
          state.step = "configure";
        } finally {
          state.busy = "";
          render({ focus: true });
        }
        await Promise.all([
          shouldSynthesize ? synthesizePrompt(id, fallbackRequest) : Promise.resolve(),
          !id.startsWith("claude-sample:") && !saved?.reviewDraft?.repo
            ? inferWorkingDirectory(id) : Promise.resolve(),
        ]);
      }

      async function refreshAttributionAndContinue() {
        state.busy = "attribution";
        state.preparation = null;
        state.error = "";
        state.notice = "";
        const reviewRevision = state.reviewRevision;
        render();
        try {
          const preparation = await callTool("prepare_run", reviewPayload());
          if (
            reviewRevision !== state.reviewRevision ||
            state.step !== "configure" ||
            !state.reviewDraft
          ) return;
          applyPreparationInspection(preparation);
          state.preparation = null;
          saveDraft();
        } catch (error) {
          if (reviewRevision === state.reviewRevision && state.step === "configure") {
            state.error = error instanceof Error ? error.message : String(error);
          }
        } finally {
          state.busy = "";
          render({ focus: true });
        }
      }

      function previousConfigurationStep() {
        state.step = "thread";
        state.error = "";
        state.notice = "";
        saveDraft();
        render({ focus: true });
      }

      async function prepareRun({ autoStart = true } = {}) {
        if (autoStart && state.replayMode === "chunks" && !allUnitsConfigured()) return;
        if (selectionNeedsRefresh()) {
          await refreshAttributionAndContinue();
          if (selectionNeedsRefresh()) return;
          if (
            inspectionParts().files.length &&
            selectionPayload().confirm_file_selection !== true
          ) {
            state.configurationDetailsOpen = true;
            state.notice = "Repository changes were refreshed. Review historical output before starting.";
            render({ focus: true });
            return;
          }
        }
        const problems = reviewProblems();
        if (problems.length) {
          state.error = "";
          state.notice = "";
          render({ focus: true });
          return;
        }
        if (state.promptGeneration === "pending") {
          state.promptSynthesisGeneration += 1;
          state.promptGeneration = "concatenated_fallback";
          recordPromptGeneration({ method: "concatenated_fallback" });
        }
        state.busy = "prepare";
        state.preparation = null;
        state.error = "";
        state.notice = "";
        const reviewRevision = state.reviewRevision;
        const configuration = reviewPayload();
        let shouldStart = false;
        render();
        try {
          const preparation = await callTool("prepare_run", configuration);
          if (
            reviewRevision !== state.reviewRevision ||
            state.step !== "configure" ||
            !state.reviewDraft
          ) return;
          state.preparation = preparation;
          applyPreparationInspection(preparation);
          shouldStart = preparationReady();
        } catch (error) {
          if (reviewRevision === state.reviewRevision && state.step === "configure") {
            state.error = error instanceof Error ? error.message : String(error);
          }
        } finally {
          state.busy = "";
          if (shouldStart && autoStart) await startRun();
          else render({ focus: true });
        }
      }

      async function startRun() {
        if (state.replayMode === "chunks" && !allUnitsConfigured()) return;
        if (!preparationReady()) return;
        state.busy = "start";
        state.error = "";
        state.notice = "";
        startPending = true;
        const unit = activeUnit();
        if (unit) { state.submittingUnitKey = unit.key; saveDraft(); }
        else clearDraft();
        render();
        try {
          const approvedRunConfiguration = { ...approvedConfiguration() };
          if (unit) {
            delete approvedRunConfiguration.message_uuid;
            Object.assign(approvedRunConfiguration, rangeParameters());
          }
          const payload = await callTool("start_run", {
            ...approvedRunConfiguration,
            approved: true,
            prepare_token: text(
              state.preparation?.prepare_token ||
              state.preparation?.approval?.prepare_token
            ),
          });
          const launched = asArray(payload.runs).length ? payload.runs : [payload];
          const newRuns = launched.flatMap((item) => {
            const run = ownedRunRecord(item);
            const id = currentRunId(item);
            return run && id ? [{ id, run, model: text(item.model || run.model), unitNumber: unit?.number }] : [];
          });
          const errors = asArray(payload.errors).filter(isObject).map((error) => ({ ...error, unitNumber: unit?.number }));
          state.runErrors = unit ? [...state.runErrors, ...errors] : errors;
          if (!newRuns.length) {
            throw new Error("The controller started no durable run.");
          }
          state.runs = unit ? [...state.runs, ...newRuns] : newRuns;
          if (unit) {
            state.unitRuns[unit.key] = newRuns.map(({ id }) => id);
            state.submittingUnitKey = "";
          }
          activateRun(newRuns[0].id);
          rememberActiveRun(state.runId);
          state.step = "run";
          if (!unit) clearDraft();
          restoredDraft = null;
          startPending = false;
          state.busy = "";
          render({ focus: true });
          if (!chunkLaunchActive()) beginPolling();
        } catch (error) {
          startPending = false;
          if (unit) state.pendingUnitKeys = [];
          state.error = error instanceof Error ? error.message : String(error);
          state.busy = "";
          render();
        }
      }

      async function refreshRun({ continuePolling = false } = {}) {
        if((!state.runId&&!state.batchId)||state.busy==="run"||chunkLaunchActive())return;
        state.busy="run";
        try {
          const previouslyCompleted = new Set(state.runs.filter((entry) => successfulRunStatus(entry.run?.status)).map((entry) => entry.id));
          if (state.batchId && (state.batch?.starting || !state.run)) {
            const payload = await callTool("get_state", state.runId ? {run_id: state.runId} : {});
            const snapshot = payload.state || payload;
            restoreBatch(snapshot);
            for (const record of asArray(snapshot.recent_runs).filter((run) => run.batch_id === state.batchId && run.launch_failed !== true)) {
              const run = ownedRunRecord(record), id = currentRunId(record);
              const entry = state.runs.find((item) => item.id === id);
              if (entry) entry.run = run;
              else state.runs.push({id, run, model: text(run.model)});
            }
            if (!state.runId && state.runs.length) {
              activateRun(state.runs[0].id);
              rememberActiveRun(state.runId);
            }
          }
          const pending=state.runs.filter(e=>!terminalRunStatus(e.run?.status));
          const updates=await Promise.allSettled(pending.map(async e=>{
            const run=ownedRunRecord(await callTool("get_run",{run_id:e.id}));
            if(run)e.run=run;
          }));
          const failure=updates.find(r=>r.status==="rejected");
          state.error=failure?String(failure.reason?.message||failure.reason):"";
          // A later model review can revise already completed model siblings.
          const reviewGroup = (entry) => JSON.stringify([entry.run?.thread_id, entry.run?.source_path,
            entry.run?.prepare_token_hash, entry.run?.start_message_uuid, entry.run?.end_message_uuid]);
          const changedGroups = new Set(state.runs.filter((entry) => successfulRunStatus(entry.run?.status) && !previouslyCompleted.has(entry.id)).map(reviewGroup));
          for (const entry of state.runs) {
            if (entry.report && changedGroups.has(reviewGroup(entry))) entry.needsReportRefresh = true;
          }
          const reports = await Promise.allSettled(state.runs.filter(e=>
            successfulRunStatus(e.run?.status)&&(!e.report||e.needsReportRefresh)
          ).map(async e=>{
            const p=await callTool("get_report",{run_id:e.id});
            e.report=isObject(p.report)?p.report:p;
            e.reportPaths={report_json:text(p.report_json),report_html:text(p.report_html)};
            e.needsReportRefresh=false;
          }));
          const reportFailure = reports.find((result) => result.status === "rejected");
          if (reportFailure) state.error = `A comparison report could not be loaded. Retrying automatically. ${String(reportFailure.reason?.message || reportFailure.reason)}`;
          activateRun(state.runId);
        } catch (error) {
          state.error=error instanceof Error?error.message:String(error);
        } finally {
          state.busy="";
          render();
        }
        const running=state.batch?.starting || state.runs.some(e=>!terminalRunStatus(e.run?.status));
        if (state.pendingUnitKeys.length && await advanceChunkQueue()) return;
        const pending=running||state.runs.some(e=>successfulRunStatus(e.run?.status)&&(!e.report||e.needsReportRefresh));
        if(!running&&state.runs.some(e=>e.report)){
          if(!state.report && state.step === "run")activateRun(state.runs.find(e=>e.report).id);
          if(state.step==="run")state.step="results";
          render({focus:true});
          if(!pending)return;
        }
        if(continuePolling&&pending)schedulePoll();
      }

      async function cancelRun(id = state.runId) {
        const entry = state.runs.find((item) => item.id === id);
        if (!entry || terminalRunStatus(entry.run?.status) || state.busy) return;
        state.pendingUnitKeys = [];
        state.pollGeneration += 1;
        state.busy = "cancel";
        state.error = "";
        render();
        try {
          const payload = await callTool("cancel_run", { run_id: id });
          const run = ownedRunRecord(payload);
          if (run) entry.run = run;
          activateRun(state.runId);
        } catch (error) {
          state.error = error instanceof Error ? error.message : String(error);
        } finally {
          state.busy = "";
          render({ focus: true });
        }
        if (state.runs.some((item) => !terminalRunStatus(item.run?.status))) beginPolling();
        else if (state.runs.some((item) => successfulRunStatus(item.run?.status))) {
          await refreshRun();
        }
      }

      function schedulePoll() {
        const generation = state.pollGeneration;
        window.setTimeout(() => {
          if (generation !== state.pollGeneration) return;
          refreshRun({ continuePolling: true });
        }, 1800);
      }

      function beginPolling() {
        state.pollGeneration += 1;
        schedulePoll();
      }

      async function loadReport({ navigate = true, runId = state.runId } = {}) {
        if (!runId || state.busy === "report") return;
        state.busy = "report";
        state.error = "";
        render();
        try {
          const payload = await callTool("get_report", { run_id: runId });
          const report = isObject(payload.report) ? payload.report : payload;
          if (!isObject(report)) throw new Error("The report response was empty.");
          const entry = state.runs.find((item) => item.id === runId);
          if (!entry) throw new Error("The replay no longer exists.");
          entry.report = report;
          entry.reportPaths = {
            report_json: text(payload.report_json),
            report_html: text(payload.report_html),
          };
          activateRun(runId);
          if (navigate && state.step === "run") state.step = "results";
          if (!state.runs.some((item) => !terminalRunStatus(item.run?.status))) {
            state.pollGeneration += 1;
          }
        } catch (error) {
          state.error = error instanceof Error ? error.message : String(error);
        } finally {
          state.busy = "";
          render({ focus: navigate && state.step === "results" });
        }
      }

      async function copyReportPath() {
        const value = text(state.reportPaths?.report_json);
        if (!value) return;
        try {
          await navigator.clipboard.writeText(value);
          state.notice = "Report path copied.";
        } catch {
          state.error = "Clipboard access is unavailable. Select the report path shown on the page.";
        }
        render();
      }

      async function downloadReport(format) {
        if (!state.runId || !["json", "html"].includes(format)) return;
        try {
          const response = await fetch("/api/download", {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ run_id: state.runId, format }),
          });
          if (!response.ok) {
            let detail = "";
            try {
              const payload = await response.json();
              detail = text(payload.error || payload.content?.[0]?.text);
            } catch {
              // Fall back to the status message.
            }
            throw new Error(detail || `The report download failed (${response.status}).`);
          }
          const url = URL.createObjectURL(await response.blob());
          const link = document.createElement("a");
          link.href = url;
          link.download = `codex-bakeoff-${state.runId}-report.${format}`;
          document.body.append(link);
          try {
            link.click();
          } finally {
            link.remove();
            URL.revokeObjectURL(url);
          }
          state.error = "";
          state.notice = `${format.toUpperCase()} report download started.`;
        } catch (error) {
          state.error = error instanceof Error ? error.message : String(error);
        }
        render();
      }

      app.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (!target || target.disabled) return;
        const action = target.dataset.action;
        if (action === "retry-init") initialize();
        if (action === "refresh-threads") loadThreads(state.query);
        if (action === "load-more-threads") loadThreads(state.query, { append: true });
        if (action === "thread-source") {
          state.threadSource = target.dataset.source || "imported";
          state.query = "";
          loadThreads();
        }
        if (action === "select-thread") {
          selectThread(target.dataset.threadId || "", Number(target.dataset.threadNumber));
        }
        if (action === "configure-selected") configureSelectedThreads();
        if (action === "configure-thread") selectBatchThread(target.dataset.threadId);
        if (action === "thread-results") selectThreadResult(target.dataset.threadId);
        if (action === "aggregate-results") {
          state.batchView = "aggregate";
          state.step = "results";
          render({ focus: true });
        }
        if (action === "replay-mode") changeReplayMode(target.dataset.mode);
        if (action === "toggle-divider") toggleDivider(target.dataset.messageUuid);
        if (action === "edit-unit") editReplayUnit(target.dataset.unitKey);
        if (action === "select-chunk-result") selectChunkResult(Number(target.dataset.unitNumber));
        if (action === "configuration-back") previousConfigurationStep();
        if (action === "refresh-files") refreshAttributionAndContinue();
        if (action === "approve-configuration") {
          if (isThreadBatch()) startThreadBatch();
          else if (state.replayMode === "chunks") startChunks();
          else prepareRun();
        }
        if (action === "refresh-run") refreshRun();
        if (action === "cancel-run") cancelRun(target.dataset.runId || state.runId);
        if (action === "load-report") loadReport();
        if (action === "select-run") {
          activateRun(target.dataset.runId || "");
          rememberActiveRun(state.runId);
          state.step = state.report ? "results" : "run";
          if (state.report) state.batchView = "individual";
          render({ focus: true });
        }
        if (action === "copy-report-path") copyReportPath();
        if (action === "download-report") downloadReport(target.dataset.format || "");
        if (action === "go-step") {
          const step = target.dataset.step;
          if (!step || !canNavigateTo(step)) return;
          if (step === "configure" && state.replayMode === "chunks") {
            editReplayUnit(state.activeUnitKey);
            return;
          }
          state.error = "";
          state.notice = "";
          if (step === "results" && !state.report && !isThreadBatch()) {
            activateRun(state.runs.find((entry) => entry.report)?.id);
          }
          state.step = step;
          render({ focus: true });
        }
      });

      app.addEventListener("toggle", (event) => {
        if (event.target.id === "configuration-details") {
          state.configurationDetailsOpen = event.target.open;
        }
      }, true);

      app.addEventListener("input", (event) => {
        const target = event.target;
        if (state.batchPreparing) return;
        if (!(target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement)) return;
        if (target.id === "thread-search") {
          state.query = target.value;
          loadThreads(state.query, { debounce: true });
        }
        const reviewFields = {
          "review-model": "model",
          "review-message-uuid": "message_uuid",
          "review-request": "request",
          "review-repo": "repo",
          "review-baseline-commit": "baseline_commit",
          "review-ending-commit": "ending_commit",
        };
        const reviewKey = reviewFields[target.id];
        if (reviewKey && state.reviewDraft) {
          state.reviewDraft[reviewKey] = target.value;
          if (reviewKey === "model") setSelectedModels([target.value]);
          if (reviewKey === "request") state.promptEditRevision += 1;
          if (reviewKey === "repo") state.workingDirectoryEditRevision += 1;
          invalidateReviewPreparation();
          saveDraft();
          const ranges = app.querySelector(".range-selection");
          if (ranges && state.replayMode === "chunks") ranges.outerHTML = renderRangeSelection();
          const confirmation = app.querySelector("#configuration-confirmation");
          if (confirmation) {
            const problems = reviewProblems();
            confirmation.innerHTML = problems.length || replayDetailsLoading()
              ? ""
              : renderConfigurationConfirmation(
                  normalizeReviewDraft(state.reviewDraft),
                  inspectionParts().capabilities
                );
          }
          const startButton = app.querySelector('[data-action="approve-configuration"]');
          if (startButton) {
            startButton.disabled = Boolean(state.busy) || replayDetailsLoading() ||
              reviewProblems().length > 0 ||
              (state.replayMode === "chunks" && (!remainingUnits().length || Boolean(state.submittingUnitKey)));
          }
        }
      });

      app.addEventListener("change", (event) => {
        const target = event.target;
        if (state.batchPreparing) return;
        if (!(
          target instanceof HTMLInputElement ||
          target instanceof HTMLSelectElement ||
          target instanceof HTMLTextAreaElement
        )) return;
        state.error = "";
        state.notice = "";
        if (target.dataset.threadSelection) {
          toggleThreadSelection(target.dataset.threadSelection, Number(target.dataset.threadNumber));
          return;
        }
        if (["review-repo", "review-baseline-commit", "review-ending-commit", "review-message-uuid"].includes(target.id)) {
          render();
          return;
        }
        if (target.dataset.modelVariant && state.reviewDraft) {
          setSelectedModels(target.checked
            ? [...state.selectedModels, target.dataset.modelVariant]
            : state.selectedModels.filter((id) => id !== target.dataset.modelVariant));
          invalidateReviewPreparation();
          saveDraft();
          render();
          return;
        }
        if (target.id === "review-beginning-kind" && state.reviewDraft) {
          state.reviewDraft.beginning_kind = target.value;
          if (target.value === "git") state.reviewDraft.ending_kind = "git";
          invalidateReviewPreparation();
          render();
          return;
        }
        if (target.id === "review-ending-kind" && state.reviewDraft) {
          state.reviewDraft.ending_kind = target.value;
          invalidateReviewPreparation();
          render();
          return;
        }
        if (target.dataset.fileKind === "git") {
          state.classifications[target.dataset.path] = target.checked ? "claude" : "exclude";
          state.attributionEdits = stringList([...state.attributionEdits, target.dataset.path]);
          invalidateConfigurationReview();
          render();
          return;
        }
        if (target.dataset.fileKind === "non_git") {
          state.classifications[target.dataset.path] = target.value;
          state.attributionEdits = stringList([...state.attributionEdits, target.dataset.path]);
          invalidateConfigurationReview();
          render();
        }
      });

      window.addEventListener("pagehide", () => {
        saveDraft();
        stopControllerHeartbeat();
      });
      window.addEventListener("pageshow", (event) => {
        if (event.persisted && state.hostReady) {
          startControllerHeartbeat();
        }
      });

      initialize();
    })();
  </script>
</body>
</html>
