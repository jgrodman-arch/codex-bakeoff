<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Bakeoff</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #151b23;
      --panel-raised: #1b2330;
      --panel-soft: #111720;
      --text: #f2f5f8;
      --muted: #9ca9b8;
      --faint: #748191;
      --line: #2b3543;
      --line-strong: #3c4858;
      --accent: #8cb4ff;
      --accent-strong: #a8c6ff;
      --accent-soft: rgba(91, 140, 230, .16);
      --good: #66d19e;
      --good-soft: rgba(64, 180, 125, .13);
      --warn: #e7bd67;
      --warn-soft: rgba(210, 157, 54, .14);
      --bad: #ff8d93;
      --bad-soft: rgba(221, 83, 93, .14);
      --shadow: 0 18px 50px rgba(0, 0, 0, .25);
      --radius: 12px;
      --radius-sm: 8px;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f8f9fb;
        --panel: #ffffff;
        --panel-raised: #ffffff;
        --panel-soft: #f4f6f9;
        --text: #17202b;
        --muted: #5e6a78;
        --faint: #7d8794;
        --line: #dfe4eb;
        --line-strong: #cbd3dd;
        --accent: #315fae;
        --accent-strong: #234d94;
        --accent-soft: rgba(49, 95, 174, .09);
        --good: #19744a;
        --good-soft: rgba(25, 116, 74, .08);
        --warn: #8d630d;
        --warn-soft: rgba(141, 99, 13, .09);
        --bad: #b43842;
        --bad-soft: rgba(180, 56, 66, .08);
        --shadow: 0 18px 50px rgba(26, 38, 54, .12);
      }
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
    }

    button, input, select, textarea { font: inherit; }

    button, input, select, textarea, summary { outline: none; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    summary:focus-visible {
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 34%, transparent);
    }

    button { color: inherit; }

    .app {
      width: min(1180px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px;
    }

    .plugin-version {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 10;
      color: var(--faint);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .layout {
      display: grid;
      grid-template-columns: 218px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .step-rail {
      position: sticky;
      top: 22px;
      padding: 4px 0;
    }

    .step-rail__label {
      margin: 0 0 14px 10px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .steps {
      display: grid;
      gap: 4px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .diagnostics {
      display: grid;
      gap: 10px;
      margin: 20px 10px 0;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .diagnostics p {
      margin-bottom: 3px;
      color: var(--faint);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .diagnostics code {
      display: block;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.45;
    }

    .step-button {
      display: grid;
      width: 100%;
      grid-template-columns: 24px 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      text-align: left;
      cursor: default;
    }

    .step-button[data-clickable="true"] { cursor: pointer; }
    .step-button[data-clickable="true"]:hover { background: var(--panel-soft); }
    .step-button[aria-current="step"] { background: var(--accent-soft); }

    .step-number {
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .step-button[aria-current="step"] .step-number {
      border-color: var(--accent);
      background: var(--accent);
      color: #0d1523;
    }

    .step-button[data-state="complete"] .step-number {
      border-color: var(--good);
      background: var(--good-soft);
      color: var(--good);
    }

    .step-copy { min-width: 0; }
    .step-name { display: block; font-weight: 650; }
    .step-state {
      display: block;
      margin-top: 1px;
      color: var(--faint);
      font-size: 11px;
    }

    .workspace { min-width: 0; }

    .page-heading {
      margin-bottom: 20px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 34px);
      letter-spacing: -.025em;
      line-height: 1.16;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      letter-spacing: -.008em;
    }

    h3 {
      margin: 0;
      font-size: 14px;
    }

    p { margin: 0; }

    .lede {
      max-width: 760px;
      margin-top: 8px;
      color: var(--muted);
    }

    .banner {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--panel-soft);
    }

    .banner--error {
      border-color: color-mix(in srgb, var(--bad) 45%, var(--line));
      background: var(--bad-soft);
    }

    .banner--warning {
      border-color: color-mix(in srgb, var(--warn) 45%, var(--line));
      background: var(--warn-soft);
    }

    .banner--success {
      border-color: color-mix(in srgb, var(--good) 45%, var(--line));
      background: var(--good-soft);
    }

    .banner__mark {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      border: 1px solid currentColor;
      border-radius: 50%;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      line-height: 16px;
    }

    .banner__body { min-width: 0; }
    .banner__body strong { display: block; margin-bottom: 2px; }
    .banner__body p, .banner__body li { color: var(--muted); }
    .banner__body ul { margin: 6px 0 0; padding-left: 20px; }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 1px 0 rgba(255,255,255,.02);
    }

    .panel + .panel { margin-top: 14px; }

    .panel__header {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .panel__header p {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .panel__body { padding: 18px; }

    .panel__body--flush { padding: 0; }

    .configuration-steps {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
      margin: 0 0 14px;
      padding: 0;
      list-style: none;
    }

    .configuration-step {
      width: 100%;
      min-height: 52px;
      padding: 8px;
      border: 0;
      border-bottom: 2px solid var(--line);
      background: transparent;
      color: var(--faint);
      text-align: left;
      cursor: default;
    }

    .configuration-step:not(:disabled) { cursor: pointer; }
    .configuration-step:not(:disabled):hover { color: var(--text); }
    .configuration-step[aria-current="step"] {
      border-color: var(--accent);
      color: var(--text);
    }

    .configuration-step small { display: block; margin-bottom: 2px; }

    .configuration-review {
      display: grid;
      gap: 0;
      margin: 0;
    }

    .configuration-review__row {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }

    .configuration-review__row:last-child { border-bottom: 0; }
    .configuration-review dt { color: var(--muted); }
    .configuration-review dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }

    .search {
      position: relative;
      margin-bottom: 14px;
    }

    .search input {
      width: 100%;
      min-height: 42px;
      padding: 9px 12px 9px 36px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--panel-soft);
      color: var(--text);
    }

    .search input::placeholder { color: var(--faint); }

    .search__icon {
      position: absolute;
      top: 12px;
      left: 13px;
      width: 14px;
      height: 14px;
      border: 2px solid var(--faint);
      border-radius: 50%;
      pointer-events: none;
    }

    .search__icon::after {
      position: absolute;
      right: -5px;
      bottom: -3px;
      width: 6px;
      height: 2px;
      transform: rotate(45deg);
      border-radius: 1px;
      background: var(--faint);
      content: "";
    }

    .thread-list {
      display: grid;
      gap: 8px;
    }

    .thread {
      display: grid;
      width: 100%;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-soft);
      text-align: left;
      cursor: pointer;
    }

    .thread:hover:not(:disabled) {
      border-color: var(--line-strong);
      background: var(--panel-raised);
    }

    .thread:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .thread__title {
      display: block;
      overflow: hidden;
      font-weight: 670;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .thread__number {
      margin-right: 7px;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .thread__meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 12px;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .thread__project {
      max-width: 520px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .arrow {
      color: var(--faint);
      font-size: 20px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .metrics {
      display: grid;
      gap: 0;
      margin: 0;
    }

    .metric {
      display: grid;
      grid-template-columns: minmax(120px, .7fr) minmax(0, 1.3fr);
      gap: 14px;
      padding: 8px 0;
      border-top: 1px solid var(--line);
    }

    .metric:first-child { border-top: 0; padding-top: 0; }
    .metric:last-child { padding-bottom: 0; }
    .metric dt { color: var(--muted); }
    .metric dd { min-width: 0; margin: 0; overflow-wrap: anywhere; text-align: right; }
    .metric code { font-size: 12px; }

    .metric--better,
    .metric--worse {
      margin: 0 -10px;
      padding-right: 10px;
      padding-left: 10px;
      border-radius: var(--radius-sm);
    }

    .metric--better { background: var(--good-soft); }
    .metric--worse { background: var(--bad-soft); }
    .metric--better dd { color: var(--good); font-weight: 750; }
    .metric--worse dd { color: var(--bad); font-weight: 750; }

    .token-label {
      position: relative;
      cursor: help;
      text-decoration: underline dotted;
      text-underline-offset: 3px;
    }

    .token-tooltip {
      position: absolute;
      z-index: 3;
      top: calc(100% + 4px);
      left: 0;
      display: none;
      width: min(300px, 75vw);
      padding: 9px 11px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--panel-raised);
      color: var(--text);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
      text-decoration: none;
      box-shadow: var(--shadow);
    }

    .token-label:hover .token-tooltip,
    .token-label:focus .token-tooltip { display: block; }

    .pill {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    .pill--good {
      border-color: color-mix(in srgb, var(--good) 45%, var(--line));
      background: var(--good-soft);
      color: var(--good);
    }

    .pill--warning {
      border-color: color-mix(in srgb, var(--warn) 45%, var(--line));
      background: var(--warn-soft);
      color: var(--warn);
    }

    .pill--bad {
      border-color: color-mix(in srgb, var(--bad) 45%, var(--line));
      background: var(--bad-soft);
      color: var(--bad);
    }

    .capability-list, .plain-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .capability {
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr);
      gap: 9px;
      align-items: start;
    }

    .capability__dot {
      width: 7px;
      height: 7px;
      margin-top: 6px;
      border-radius: 50%;
      background: var(--good);
    }

    .capability--warning .capability__dot { background: var(--warn); }
    .capability--bad .capability__dot { background: var(--bad); }
    .capability small { display: block; color: var(--muted); }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field label, .field__label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 680;
    }

    .field select,
    .field textarea,
    .field input[type="number"],
    .field input[type="text"] {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--panel-soft);
      color: var(--text);
    }

    .field textarea {
      min-height: 92px;
      resize: vertical;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .field--wide { grid-column: 1 / -1; }

    .review-fields {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .field small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
    }

    .file-list {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .file-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      min-height: 52px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }

    .file-row:first-child { border-top: 0; }

    .file-copy { min-width: 0; }
    .file-path {
      display: block;
      overflow: hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 9px;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .choice {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      cursor: pointer;
    }

    .choice input { accent-color: var(--accent); }
    .choice[aria-disabled="true"] { color: var(--muted); cursor: not-allowed; }

    .segmented {
      display: inline-flex;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
    }

    .segment {
      position: relative;
      display: inline-flex;
    }

    .segment input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .segment span {
      padding: 6px 8px;
      border-radius: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      cursor: pointer;
      white-space: nowrap;
    }

    .segment input:checked + span {
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .segment input:disabled + span {
      opacity: .6;
      cursor: not-allowed;
    }

    .attestation {
      display: grid;
      gap: 8px;
      margin-top: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--panel-soft);
    }

    .attestation legend {
      padding: 0 4px;
      font-weight: 680;
    }

    .footer-actions {
      position: sticky;
      z-index: 2;
      bottom: 0;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      margin-top: 18px;
      padding: 14px 0 max(8px, env(safe-area-inset-bottom));
      background: linear-gradient(to bottom, transparent, var(--bg) 18%, var(--bg));
    }

    .footer-actions__note {
      margin-right: auto;
      color: var(--muted);
      font-size: 12px;
    }

    .footer-actions--configuration {
      position: static;
      margin-top: 0;
      margin-bottom: 18px;
      padding: 0;
      background: none;
    }

    .button {
      display: inline-flex;
      min-height: 38px;
      gap: 7px;
      align-items: center;
      justify-content: center;
      padding: 8px 13px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--panel-raised);
      color: var(--text);
      font-weight: 650;
      cursor: pointer;
    }

    .button:hover:not(:disabled) { border-color: var(--faint); }

    .button--primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #0b1526;
    }

    .button--primary:hover:not(:disabled) { background: var(--accent-strong); }

    .button--quiet { background: transparent; }

    .button--danger {
      border-color: var(--bad);
      background: var(--bad-soft);
      color: var(--bad);
    }

    .button:disabled {
      opacity: .46;
      cursor: not-allowed;
    }

    .step-item { position: relative; }

    .step-tooltip {
      position: absolute;
      z-index: 4;
      top: calc(100% + 6px);
      left: 12px;
      display: none;
      width: min(280px, calc(100vw - 32px));
      padding: 10px 12px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--panel-raised);
      color: var(--text);
      font-size: 12px;
      line-height: 1.4;
      box-shadow: var(--shadow);
    }

    .step-tooltip ul {
      margin: 6px 0 0;
      padding-left: 18px;
    }

    .step-item:hover .step-tooltip,
    .step-item:focus .step-tooltip,
    .step-item:focus-within .step-tooltip { display: block; }

    .spinner {
      width: 14px;
      height: 14px;
      animation: spin .8s linear infinite;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .review-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .review-item {
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--panel-soft);
    }

    .review-item span {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .review-item strong, .review-item code {
      display: block;
      overflow-wrap: anywhere;
    }

    details {
      margin-top: 14px;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    summary {
      cursor: pointer;
      font-weight: 650;
    }

    pre {
      max-height: 420px;
      margin: 10px 0 0;
      padding: 12px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--panel-soft);
      color: var(--text);
      font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .run-log {
      min-height: 180px;
      max-height: 360px;
      margin: 0;
    }

    .phase-list {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .phase {
      position: relative;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 48px;
    }

    .phase:not(:last-child)::after {
      position: absolute;
      top: 34px;
      bottom: -14px;
      left: 11px;
      width: 1px;
      background: var(--line);
      content: "";
    }

    .phase__mark {
      z-index: 1;
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      background: var(--panel);
      color: var(--faint);
      font-size: 10px;
      font-weight: 800;
    }

    .phase--running .phase__mark {
      border-color: var(--accent);
      color: var(--accent);
    }

    .phase--running .phase__mark::before {
      width: 8px;
      height: 8px;
      animation: pulse 1.3s ease-in-out infinite;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    @keyframes pulse {
      50% { transform: scale(.7); opacity: .45; }
    }

    .phase--complete .phase__mark {
      border-color: var(--good);
      background: var(--good-soft);
      color: var(--good);
    }

    .phase--failed .phase__mark {
      border-color: var(--bad);
      background: var(--bad-soft);
      color: var(--bad);
    }

    .phase__name { font-weight: 650; }
    .phase__state { color: var(--muted); font-size: 11px; text-transform: capitalize; }

    .activity {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .activity li {
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr);
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .activity time { color: var(--faint); font-variant-numeric: tabular-nums; }

    .result-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 20px;
      border: 1px solid color-mix(in srgb, var(--good) 38%, var(--line));
      border-radius: var(--radius);
      background: var(--good-soft);
    }

    .result-hero h1 { font-size: 27px; }
    .result-hero p { margin-top: 6px; color: var(--muted); }

    .score {
      font-size: 24px;
      font-weight: 780;
      letter-spacing: -.03em;
      white-space: nowrap;
    }

    .provider-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .provider {
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .provider h2 { margin-bottom: 12px; }

    .table-wrap { overflow: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th { color: var(--muted); font-size: 11px; font-weight: 680; }
    td { font-size: 12px; }
    tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }

    .empty {
      padding: 34px 18px;
      color: var(--muted);
      text-align: center;
    }

    .skeleton {
      height: 72px;
      animation: shimmer 1.2s ease-in-out infinite alternate;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-soft);
      opacity: .6;
    }

    @keyframes shimmer { to { opacity: .9; } }

    dialog {
      width: min(680px, calc(100vw - 32px));
      max-height: min(820px, calc(100vh - 32px));
      padding: 0;
      overflow: auto;
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      background: var(--panel-raised);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    dialog::backdrop { background: rgba(3, 7, 12, .72); }

    .dialog__header {
      padding: 20px 20px 14px;
      border-bottom: 1px solid var(--line);
    }

    .dialog__header h2 { font-size: 20px; }
    .dialog__header p { margin-top: 5px; color: var(--muted); }
    .dialog__body { padding: 18px 20px; }
    .dialog__footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      padding: 14px 20px 20px;
    }

    .approval-promises {
      display: grid;
      gap: 8px;
      margin: 16px 0;
      padding: 0;
      list-style: none;
    }

    .approval-promises li {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 8px;
    }

    .approval-promises li::before {
      color: var(--good);
      font-weight: 800;
      content: "✓";
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 780px) {
      .app { padding: 16px; }
      .layout { grid-template-columns: 1fr; gap: 16px; }
      .step-rail { position: static; overflow-x: auto; }
      .step-rail__label { display: none; }
      .steps { display: flex; min-width: max-content; }
      .step-button { width: auto; grid-template-columns: 22px auto; padding: 8px; }
      .step-state { display: none; }
      .step-number { width: 22px; height: 22px; }
      .diagnostics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin: 12px 8px 0;
      }
      .grid-2, .provider-grid, .review-grid, .field-grid { grid-template-columns: 1fr; }
      .file-row { grid-template-columns: 1fr; gap: 7px; }
      .segmented { width: 100%; }
      .segment { flex: 1; }
      .segment span { width: 100%; text-align: center; }
      .metric { grid-template-columns: 1fr; gap: 2px; }
      .metric dd { text-align: left; }
      .result-hero { grid-template-columns: 1fr; }
      .configuration-steps { grid-template-columns: 1fr; gap: 0; }
      .configuration-step { display: none; }
      .configuration-step[aria-current="step"] { display: block; }
      .configuration-review__row { grid-template-columns: 1fr; gap: 3px; }
      .footer-actions { flex-wrap: wrap; }
      .footer-actions__note { width: 100%; margin: 0; }
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <p class="empty">Connecting to the local bakeoff controller…</p>
  </div>

  <script>
    (() => {
      "use strict";

      const STEPS = [
        { id: "thread", name: "Choose thread", short: "Imported history" },
        { id: "configure", name: "Configure", short: "Exact configuration" },
        { id: "run", name: "Run", short: "Isolated replay" },
        { id: "results", name: "Results", short: "Comparison report" },
      ];

      const CONFIGURATION_STEPS = [
        { id: "replay", name: "Replay details" },
        { id: "beginning", name: "Beginning state" },
        { id: "end", name: "End state" },
        { id: "output", name: "Historical output" },
        { id: "capabilities", name: "Capability parity" },
        { id: "confirm", name: "Review & confirm" },
      ];

      const DEFAULT_PHASES = [
        ["preparing", "Preparing configuration"],
        ["creating_workspace", "Creating isolated workspace"],
        ["implementing", "Implementing with Codex"],
        ["collecting", "Capturing result"],
        ["verifying", "Running shared verification"],
        ["reviewing", "Running blind review"],
        ["reporting", "Finalizing report"],
      ];

      const DRAFT_STORAGE_KEY = "codex-bakeoff.controller-draft.v7";
      const CONTROLLER_SESSION_STORAGE_KEY = "codex-bakeoff.controller-session.v1";
      const DRAFT_VERSION = 7;
      const DRAFT_STEPS = new Set(["thread", "configure"]);

      const state = {
        step: "thread",
        hostReady: false,
        loading: true,
        busy: "",
        error: "",
        notice: "",
        threads: [],
        totalThreads: 0,
        query: "",
        selectedThreadId: "",
        selectedThreadNumber: 0,
        selectedThread: null,
        inspection: null,
        models: [],
        model: "",
        timeoutSeconds: 1800,
        classifications: Object.create(null),
        reviewDraft: null,
        configurationStep: 0,
        configurationMaxStep: 0,
        reviewRevision: 0,
        promptGeneration: "",
        promptEditRevision: 0,
        promptSynthesisGeneration: 0,
        workingDirectoryEditRevision: 0,
        workingDirectoryGeneration: 0,
        workingDirectoryLoading: false,
        preparation: null,
        runId: "",
        run: null,
        report: null,
        reportPaths: null,
        runRoot: "",
        controllerLogPath: "",
        pluginVersion: "",
        pollGeneration: 0,
      };

      const app = document.getElementById("app");
      let draftPersistenceReady = false;
      let startPending = false;

      const isObject = (value) =>
        value !== null && typeof value === "object" && !Array.isArray(value);

      const asArray = (value) => Array.isArray(value) ? value : [];

      const text = (value, fallback = "") =>
        typeof value === "string" || typeof value === "number"
          ? String(value)
          : fallback;

      const escapeHtml = (value) =>
        text(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");

      const safeJson = (value) => {
        try {
          return JSON.stringify(value, null, 2);
        } catch {
          return "The configuration could not be serialized.";
        }
      };

      const stringList = (value) => asArray(value)
        .map((item) => text(item).trim())
        .filter((item, index, values) => item && values.indexOf(item) === index);

      function normalizeReviewDraft(value) {
        if (!isObject(value)) return null;
        return {
          thread_id: text(value.thread_id),
          source_path: text(value.source_path),
          message_uuid: text(value.message_uuid),
          request: text(value.request),
          repo: text(value.repo),
          beginning_kind: ["git", "non_git"].includes(value.beginning_kind)
            ? value.beginning_kind
            : "",
          ending_kind: ["git", "non_git"].includes(value.ending_kind)
            ? value.ending_kind
            : "",
          baseline_commit: text(value.baseline_commit),
          ending_commit: text(value.ending_commit),
          model: text(value.model),
          timeout_seconds: text(value.timeout_seconds),
        };
      }

      function normalizeDraft(value) {
        if (!isObject(value) || value.version !== DRAFT_VERSION) return null;
        const timeoutSeconds = Number(value.timeoutSeconds);
        const classifications = Object.create(null);
        if (isObject(value.classifications)) {
          for (const [path, classification] of Object.entries(value.classifications)) {
            if (path && ["claude", "exclude"].includes(classification)) {
              classifications[path] = classification;
            }
          }
        }
        return {
          version: DRAFT_VERSION,
          step: DRAFT_STEPS.has(value.step) ? value.step : "thread",
          selectedThreadId: text(value.selectedThreadId),
          selectedThreadNumber: Number.isInteger(value.selectedThreadNumber) && value.selectedThreadNumber > 0
            ? value.selectedThreadNumber
            : 0,
          model: text(value.model),
          timeoutSeconds:
            Number.isInteger(timeoutSeconds) && timeoutSeconds >= 1 && timeoutSeconds <= 14400
              ? timeoutSeconds
              : 1800,
          classifications,
          reviewDraft: normalizeReviewDraft(value.reviewDraft),
          configurationStep: Number.isInteger(value.configurationStep)
            ? Math.min(Math.max(value.configurationStep, 0), CONFIGURATION_STEPS.length - 1)
            : 0,
          configurationMaxStep: Number.isInteger(value.configurationMaxStep)
            ? Math.min(Math.max(value.configurationMaxStep, 0), CONFIGURATION_STEPS.length - 1)
            : 0,
        };
      }

      function loadDraft() {
        try {
          return normalizeDraft(JSON.parse(localStorage.getItem(DRAFT_STORAGE_KEY) || "null"));
        } catch {
          return null;
        }
      }

      function draftSnapshot() {
        const reviewDraft = normalizeReviewDraft(state.reviewDraft);
        if (reviewDraft) delete reviewDraft.request;
        return {
          version: DRAFT_VERSION,
          step: DRAFT_STEPS.has(state.step) ? state.step : "thread",
          selectedThreadId: state.selectedThreadId,
          selectedThreadNumber: state.selectedThreadNumber,
          model: state.model,
          timeoutSeconds: Number(state.timeoutSeconds),
          classifications: Object.fromEntries(
            Object.entries(state.classifications)
              .filter(([, value]) => ["claude", "exclude"].includes(value))
          ),
          reviewDraft,
          configurationStep: state.configurationStep,
          configurationMaxStep: state.configurationMaxStep,
        };
      }

      function saveDraft() {
        if (
          !draftPersistenceReady ||
          startPending ||
          state.run ||
          ["run", "results"].includes(state.step)
        ) return;
        try {
          localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(draftSnapshot()));
        } catch {
          // Draft persistence is best-effort when browser storage is unavailable.
        }
      }

      function clearDraft() {
        try {
          localStorage.removeItem(DRAFT_STORAGE_KEY);
        } catch {
          // Reset the in-memory controller even if browser storage is unavailable.
        }
      }

      function controllerSessionToken() {
        try {
          return localStorage.getItem(CONTROLLER_SESSION_STORAGE_KEY) || "";
        } catch {
          return "";
        }
      }

      let restoredDraft = loadDraft();

      const pathBase = (value) => {
        const parts = text(value).split("/").filter(Boolean);
        return parts.at(-1) || text(value, "Unknown project");
      };

      const titleCase = (value) =>
        text(value, "unknown")
          .replaceAll("_", " ")
          .replace(/\b\w/g, (letter) => letter.toUpperCase());

      const formatDate = (value) => {
        const stamp = Date.parse(text(value));
        if (!Number.isFinite(stamp)) return "Date unavailable";
        return new Intl.DateTimeFormat(undefined, {
          dateStyle: "medium",
          timeStyle: "short",
        }).format(stamp);
      };

      const formatTime = (value) => {
        const stamp = Date.parse(text(value));
        if (!Number.isFinite(stamp)) return "—";
        return new Intl.DateTimeFormat(undefined, {
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit",
        }).format(stamp);
      };

      const formatDuration = (value) => {
        const amount = Number(value);
        if (!Number.isFinite(amount) || amount < 0) return "Unavailable";
        const seconds = Math.round(amount);
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const remainder = seconds % 60;
        return [
          hours ? `${hours}h` : "",
          minutes ? `${minutes}m` : "",
          remainder || (!hours && !minutes) ? `${remainder}s` : "",
        ].filter(Boolean).join(" ");
      };

      const formatTokens = (value) => {
        const amount = Number(value);
        return Number.isFinite(amount) ? new Intl.NumberFormat().format(amount) : "Unavailable";
      };

      const formatCost = (value) => {
        if (value === null || value === undefined || value === "") return "Unavailable";
        const amount = Number(value);
        return Number.isFinite(amount) ? `$${amount.toFixed(amount < .01 ? 4 : 2)}` : "Unavailable";
      };

      function unwrapToolResult(result) {
        if (isObject(result) && result.isError) {
          const content = asArray(result.content);
          const message = content
            .filter((item) => isObject(item) && item.type === "text")
            .map((item) => text(item.text))
            .join("\n");
          throw new Error(message || "The controller tool returned an error.");
        }
        if (isObject(result) && isObject(result.structuredContent)) {
          return result.structuredContent;
        }
        if (isObject(result) && isObject(result.result)) {
          return unwrapToolResult(result.result);
        }
        if (isObject(result)) {
          const content = asArray(result.content);
          for (const item of content) {
            if (!isObject(item) || item.type !== "text") continue;
            try {
              const parsed = JSON.parse(text(item.text));
              if (isObject(parsed)) return parsed;
            } catch {
              // Human-readable content is intentionally not treated as state.
            }
          }
          return result;
        }
        throw new Error("The controller returned an unreadable response.");
      }

      async function callTool(name, args = {}) {
        const sessionToken = controllerSessionToken();
        if (!sessionToken) {
          throw new Error(
            "This browser session has expired. Invoke the plugin again to reopen the controller."
          );
        }
        let response;
        try {
          response = await fetch("/api/call", {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json",
              "X-Codex-Bakeoff-Session": sessionToken,
            },
            body: JSON.stringify({ name, arguments: args }),
          });
        } catch {
          throw new Error(
            "The local bakeoff service is unavailable. Invoke the plugin again to reopen it."
          );
        }
        let result;
        try {
          result = await response.json();
        } catch {
          throw new Error("The local bakeoff service returned an unreadable response.");
        }
        if (!response.ok && !result.isError) {
          throw new Error(text(result.error, `The controller request failed (${response.status}).`));
        }
        return unwrapToolResult(result);
      }

      function threadId(thread) {
        if (!isObject(thread)) return "";
        return text(
          thread.imported_thread_id ||
          thread.thread_id ||
          thread.id ||
          thread.session_id
        );
      }

      function threadTitle(thread) {
        return text(thread?.title || thread?.name || thread?.request, "Untitled Claude thread");
      }

      function threadStepEyebrow(label) {
        return state.selectedThreadNumber > 0
          ? `${label} · Thread #${state.selectedThreadNumber}`
          : label;
      }

      function normalizeModels(values) {
        return asArray(values).flatMap((item) => {
          if (typeof item === "string") {
            return [{ id: item, label: item, description: "", recommended: false }];
          }
          if (!isObject(item)) return [];
          const id = text(item.id || item.slug || item.model);
          if (!id) return [];
          return [{
            id,
            label: text(item.label || item.display_name || item.name, id),
            description: text(item.description),
            recommended: item.recommended === true || item.is_default === true,
          }];
        });
      }

      function inspectionParts() {
        const inspection = isObject(state.inspection) ? state.inspection : {};
        const baseline = isObject(inspection.baseline) ? inspection.baseline : {};
        const selection = isObject(inspection.file_selection)
          ? inspection.file_selection
          : {};
        const workspace = isObject(inspection.workspace) ? inspection.workspace : {};
        const capabilities = isObject(inspection.capabilities)
          ? inspection.capabilities
          : {};
        const replay = isObject(inspection.replay)
          ? inspection.replay
          : (isObject(inspection.thread) ? inspection.thread : {});
        const files = asArray(
          workspace.files?.length ? workspace.files : selection.candidates
        );
        const kind = text(
          workspace.kind || selection.source_kind || baseline.source_kind || baseline.kind
        );
        return { inspection, baseline, selection, workspace, capabilities, replay, files, kind };
      }

      function initializeClassifications() {
        state.classifications = Object.create(null);
        const { selection, files, kind } = inspectionParts();
        if (kind === "git") {
          const selected = new Set(
            asArray(selection.claude_output_changes).map((item) =>
              text(isObject(item) ? item.path : item)
            )
          );
          for (const file of files) {
            const path = text(file?.path);
            if (path) state.classifications[path] = selected.has(path) ? "claude" : "exclude";
          }
          return;
        }
        const classes = isObject(selection.classifications)
          ? selection.classifications
          : {};
        for (const item of asArray(classes.created_by_claude)) {
          const path = text(isObject(item) ? item.path : item);
          if (path) state.classifications[path] = "claude";
        }
        for (const item of asArray(classes.exclude)) {
          const path = text(isObject(item) ? item.path : item);
          if (path) state.classifications[path] = "exclude";
        }
        for (const file of files) {
          const path = text(file?.path);
          if (!path) continue;
          if (file.selectable !== true || file.suggested_class === "exclude") {
            state.classifications[path] = "exclude";
          }
        }
      }

      function applyDraftToInspection(draft) {
        if (!isObject(draft)) return;
        if (draft.model) state.model = draft.model;
        state.timeoutSeconds = draft.timeoutSeconds;
        state.configurationStep = draft.configurationStep;
        state.configurationMaxStep = Math.max(
          draft.configurationStep,
          draft.configurationMaxStep
        );
        const { files } = inspectionParts();
        const fileByPath = new Map(
          files
            .map((file) => [text(file?.path), file])
            .filter(([path]) => Boolean(path))
        );
        for (const [path, classification] of Object.entries(draft.classifications)) {
          const file = fileByPath.get(path);
          if (!file || !["claude", "exclude"].includes(classification)) continue;
          state.classifications[path] =
            file.selectable === false ? "exclude" : classification;
        }
        state.reviewDraft = normalizeReviewDraft(draft.reviewDraft);
        if (state.reviewDraft) {
          const { replay } = inspectionParts();
          state.reviewDraft.request = text(replay.request);
        }
      }

      function selectedModelDefault() {
        return (
          state.models.find((model) => model.recommended)?.id ||
          state.models[0]?.id ||
          ""
        );
      }

      function recordPromptGeneration(requestGeneration, request = "") {
        if (!isObject(state.inspection)) return;
        for (const key of ["replay", "thread"]) {
          if (!isObject(state.inspection[key])) continue;
          state.inspection[key] = {
            ...state.inspection[key],
            ...(request ? { request } : {}),
            request_generation: requestGeneration,
          };
        }
      }

      async function synthesizePrompt(threadIdValue, fallbackRequest) {
        const generation = ++state.promptSynthesisGeneration;
        const editRevision = state.promptEditRevision;
        state.promptGeneration = "pending";
        recordPromptGeneration({ method: "pending" });
        render();
        try {
          const payload = await callTool("synthesize_request", {
            thread_id: threadIdValue,
          });
          if (
            generation !== state.promptSynthesisGeneration ||
            threadIdValue !== state.selectedThreadId
          ) return;
          const requestGeneration = isObject(payload.request_generation)
            ? payload.request_generation
            : {};
          const method = text(requestGeneration.method);
          const request = text(payload.request).trim();
          if (method === "llm_synthesis" && request) {
            state.promptGeneration = "llm_synthesis";
            const canReplace = (
              state.promptEditRevision === editRevision &&
              text(state.reviewDraft?.request) === fallbackRequest
            );
            if (canReplace && state.reviewDraft) {
              state.reviewDraft.request = request;
              state.reviewRevision += 1;
              state.preparation = null;
              recordPromptGeneration(requestGeneration, request);
            } else {
              recordPromptGeneration(requestGeneration);
            }
          } else {
            state.promptGeneration = "concatenated_fallback";
            recordPromptGeneration({ method: "concatenated_fallback" });
          }
        } catch {
          if (
            generation !== state.promptSynthesisGeneration ||
            threadIdValue !== state.selectedThreadId
          ) return;
          state.promptGeneration = "concatenated_fallback";
          recordPromptGeneration({ method: "concatenated_fallback" });
        } finally {
          if (
            generation === state.promptSynthesisGeneration &&
            threadIdValue === state.selectedThreadId
          ) {
            render();
          }
        }
      }

      async function inferWorkingDirectory(threadIdValue) {
        const generation = ++state.workingDirectoryGeneration;
        const editRevision = state.workingDirectoryEditRevision;
        if (!state.workingDirectoryLoading) {
          state.workingDirectoryLoading = true;
          render();
        }
        try {
          const payload = await callTool("infer_working_directory", {
            thread_id: threadIdValue,
          });
          if (
            generation !== state.workingDirectoryGeneration ||
            threadIdValue !== state.selectedThreadId ||
            editRevision !== state.workingDirectoryEditRevision ||
            !state.reviewDraft
          ) return;
          const workingDirectory = text(payload.working_directory).trim();
          if (state.reviewDraft.repo !== workingDirectory) {
            state.reviewDraft.repo = workingDirectory;
            state.reviewRevision += 1;
            state.preparation = null;
            saveDraft();
            render();
          }
        } catch {
          // Keep the recorded cwd already present in the draft.
        } finally {
          if (
            generation === state.workingDirectoryGeneration &&
            threadIdValue === state.selectedThreadId
          ) {
            state.workingDirectoryLoading = false;
            render();
          }
        }
      }

      function resetController() {
        clearDraft();
        restoredDraft = null;
        startPending = false;
        state.pollGeneration += 1;
        state.step = "thread";
        state.loading = false;
        state.busy = "";
        state.error = "";
        state.notice = "";
        state.query = "";
        state.selectedThreadId = "";
        state.selectedThreadNumber = 0;
        state.selectedThread = null;
        state.inspection = null;
        state.model = selectedModelDefault();
        state.timeoutSeconds = 1800;
        state.classifications = Object.create(null);
        state.reviewDraft = null;
        state.configurationStep = 0;
        state.configurationMaxStep = 0;
        state.reviewRevision += 1;
        state.promptGeneration = "";
        state.promptEditRevision = 0;
        state.promptSynthesisGeneration += 1;
        state.workingDirectoryEditRevision = 0;
        state.workingDirectoryGeneration += 1;
        state.workingDirectoryLoading = false;
        state.preparation = null;
        state.runId = "";
        state.run = null;
        state.report = null;
        state.reportPaths = null;
        render({ focus: true });
      }

      function selectionNeedsRefresh() {
        const draft = normalizeReviewDraft(state.reviewDraft);
        if (!draft || !state.inspection) return false;
        const { baseline, replay, selection } = inspectionParts();
        const inspectedBeginning = text(baseline.beginning_kind) || (
          baseline.kind === "git_commit"
            ? "git"
            : baseline.kind === "empty_directory" ||
                baseline.proposed_kind === "empty_directory"
              ? "non_git"
              : ""
        );
        const inspectedEnding = text(baseline.ending_kind) || text(
          selection.source_kind || baseline.source_kind
        );
        const inspectedRepository = text(
          baseline.attribution_root ||
          baseline.repository ||
          replay.project_dir
        );
        return (
          !inspectedBeginning ||
          !inspectedEnding ||
          draft.message_uuid.trim() !== text(replay.message_uuid).trim() ||
          draft.repo.trim() !== inspectedRepository.trim() ||
          draft.beginning_kind !== inspectedBeginning ||
          draft.ending_kind !== inspectedEnding ||
          (
            draft.beginning_kind === "git" &&
            draft.baseline_commit.trim().toLowerCase() !==
              text(baseline.commit).trim().toLowerCase()
          )
        );
      }

      function selectionPayload() {
        const { baseline, files, kind } = inspectionParts();
        const draft = normalizeReviewDraft(state.reviewDraft);
        const isGit = draft
          ? draft.ending_kind === "git"
          : kind === "git";
        const refreshing = selectionNeedsRefresh();
        const claude = [];
        const excluded = [];
        for (const file of files) {
          const path = text(file?.path);
          if (!path) continue;
          if (state.classifications[path] === "claude") claude.push(path);
          else if (state.classifications[path] === "exclude") excluded.push(path);
        }
        const allClassified = files.every((file) => {
          const path = text(file?.path);
          return !path || ["claude", "exclude"].includes(state.classifications[path]);
        });
        const common = {
          thread_id: state.selectedThreadId,
          model: state.model,
          timeout_seconds: Number(state.timeoutSeconds),
          repo: text(baseline.attribution_root || baseline.repository) || undefined,
          claude_output_files: isGit && !refreshing ? claude : [],
          created_by_claude: !isGit && !refreshing ? claude : [],
          excluded_files: !isGit && !refreshing ? excluded : [],
          confirm_file_selection: refreshing
            ? false
            : isGit
              ? kind === "git"
              : kind === "non_git" && allClassified,
        };
        return Object.fromEntries(
          Object.entries(common).filter(([, value]) => value !== undefined)
        );
      }

      function applyPreparationInspection(preparation) {
        if (!isObject(preparation)) return;
        const current = isObject(state.inspection) ? state.inspection : {};
        const baseline = isObject(preparation.baseline)
          ? preparation.baseline
          : current.baseline;
        const replay = isObject(preparation.replay)
          ? {
              ...(isObject(current.replay) ? current.replay : {}),
              ...preparation.replay,
            }
          : current.replay;
        const selection = isObject(preparation.file_selection)
          ? preparation.file_selection
          : current.file_selection;
        const capabilities = isObject(preparation.capabilities)
          ? preparation.capabilities
          : current.capabilities;
        const workspace = {
          ...(isObject(current.workspace) ? current.workspace : {}),
          kind: text(selection?.source_kind),
          files: asArray(selection?.candidates),
        };
        state.inspection = {
          ...current,
          baseline,
          replay,
          file_selection: selection,
          capabilities,
          workspace,
        };
        if (state.reviewDraft) {
          if (typeof replay?.message_uuid === "string") {
            state.reviewDraft.message_uuid = replay.message_uuid;
          }
          if (typeof replay?.request === "string") {
            state.reviewDraft.request = replay.request;
          }
          if (typeof baseline?.commit === "string") {
            state.reviewDraft.baseline_commit = baseline.commit;
          }
          if (typeof baseline?.ending_commit === "string") {
            state.reviewDraft.ending_commit = baseline.ending_commit;
          }
          if (["git", "non_git"].includes(baseline?.beginning_kind)) {
            state.reviewDraft.beginning_kind = baseline.beginning_kind;
          }
          if (["git", "non_git"].includes(baseline?.ending_kind)) {
            state.reviewDraft.ending_kind = baseline.ending_kind;
          }
        }
        initializeClassifications();
      }

      function inspectionDiagnostics() {
        const inspection = isObject(state.inspection) ? state.inspection : {};
        const selection = isObject(inspection.file_selection) ? inspection.file_selection : {};
        const repositoryBlockers = new Set(
          asArray(inspection.repository_blockers)
            .map((item) => text(isObject(item) ? item.message : item))
            .filter(Boolean)
        );
        return [
          ...asArray(inspection.diagnostics),
          ...asArray(inspection.blockers),
          ...asArray(selection.blocking_reasons),
        ]
          .map((item) => text(isObject(item) ? item.message : item))
          .filter((item, index, values) => (
            item && !repositoryBlockers.has(item) && values.indexOf(item) === index
          ));
      }

      function reviewDraftFromConfiguration() {
        const { inspection, baseline, selection, replay, kind } = inspectionParts();
        const failedSteps = new Set(
          asArray(inspection.diagnostics)
            .map((item) => text(isObject(item) ? item.step : ""))
            .filter(Boolean)
        );
        const beginningKind = text(baseline.beginning_kind) || (
          baseline.kind === "git_commit"
            ? "git"
            : baseline.kind === "empty_directory" || baseline.proposed_kind === "empty_directory"
              ? "non_git"
              : "git"
        );
        const endingKind = text(
          baseline.ending_kind || selection.source_kind || baseline.source_kind || kind
        ) || (beginningKind === "git" ? "git" : "non_git");
        const baselineUnresolved = (
          failedSteps.has("baseline") ||
          asArray(inspection.repository_blockers).length > 0 ||
          !beginningKind ||
          !endingKind
        );
        return normalizeReviewDraft({
          thread_id: state.selectedThreadId,
          source_path: replay.source_path || state.selectedThread?.source_path,
          message_uuid: failedSteps.has("thread") ? "" : replay.message_uuid,
          request: failedSteps.has("thread")
            ? ""
            : replay.request || state.selectedThread?.request,
          repo:
            replay.project_dir ||
            state.selectedThread?.project_dir,
          beginning_kind: beginningKind,
          ending_kind: beginningKind === "git" ? "git" : endingKind,
          baseline_commit: baselineUnresolved ? "" : baseline.commit,
          ending_commit: baselineUnresolved ? "" : baseline.ending_commit,
          model: state.model,
          timeout_seconds: state.timeoutSeconds,
        });
      }

      function reviewPayload() {
        const draft = normalizeReviewDraft(state.reviewDraft) || {};
        const gitBeginning = draft.beginning_kind === "git";
        const gitEnding = draft.ending_kind === "git";
        const selection = selectionPayload();
        return {
          thread_id: text(draft.thread_id).trim(),
          source_path: text(draft.source_path).trim(),
          message_uuid: text(draft.message_uuid).trim(),
          request: text(draft.request).trim(),
          repo: text(draft.repo).trim(),
          beginning_kind: text(draft.beginning_kind),
          ending_kind: text(draft.ending_kind),
          baseline_commit: gitBeginning ? text(draft.baseline_commit).trim() : "",
          ending_commit: gitEnding ? text(draft.ending_commit).trim() : "",
          confirm_empty_beginning: draft.beginning_kind === "non_git",
          confirm_repository_selection: Boolean(text(draft.repo).trim()),
          model: text(draft.model).trim(),
          timeout_seconds: Number(draft.timeout_seconds),
          claude_output_files: gitEnding ? stringList(selection.claude_output_files) : [],
          created_by_claude: gitEnding ? [] : stringList(selection.created_by_claude),
          excluded_files: gitEnding ? [] : stringList(selection.excluded_files),
          confirm_file_selection: selection.confirm_file_selection === true,
        };
      }

      function reviewProblems() {
        const draft = normalizeReviewDraft(state.reviewDraft);
        if (!draft) return ["Open a configuration draft."];
        const selection = selectionPayload();
        const problems = [];
        if (!draft.thread_id.trim()) problems.push("Choose the Claude task again.");
        if (!draft.source_path.trim()) {
          problems.push("The selected Claude task has no source transcript.");
        }
        if (!draft.message_uuid.trim()) {
          problems.push("Enter the message ID within the original thread.");
        }
        if (!draft.request.trim()) problems.push("Enter the reconstructed task prompt.");
        if (!draft.repo.trim()) problems.push("Enter the replay repository.");
        if (!draft.beginning_kind) problems.push("Choose the beginning state.");
        if (!draft.ending_kind) problems.push("Choose the end state.");
        if (draft.beginning_kind === "git" && draft.ending_kind === "non_git") {
          problems.push("A Git beginning state requires a Git end state.");
        }
        if (draft.beginning_kind === "git" && !draft.baseline_commit.trim()) {
          problems.push("Enter the starting commit.");
        }
        if (draft.ending_kind === "git" && !draft.ending_commit.trim()) {
          problems.push("Enter the ending commit.");
        }
        if (!draft.model.trim()) problems.push("Enter a Codex model.");
        const timeout = Number(draft.timeout_seconds);
        if (!Number.isInteger(timeout) || timeout < 1 || timeout > 14400) {
          problems.push("Set a timeout from 1 through 14,400 seconds.");
        }
        if (
          draft.ending_kind === "non_git" &&
          !selectionNeedsRefresh() &&
          selection.confirm_file_selection !== true
        ) {
          problems.push("Classify every file in the Non-Git end state.");
        }
        return problems;
      }

      function invalidateReviewPreparation() {
        state.reviewRevision += 1;
        state.preparation = null;
        state.error = "";
        state.notice = "";
      }

      function invalidateConfigurationReview() {
        state.reviewRevision += 1;
        state.preparation = null;
        state.error = "";
        state.notice = "";
        saveDraft();
      }

      function preparationBlockers() {
        const preparation = isObject(state.preparation) ? state.preparation : {};
        return [
          ...asArray(preparation.blockers?.length
            ? preparation.blockers
            : preparation.blocking_reasons),
          ...asArray(preparation.questions),
        ]
          .map((item) => text(isObject(item) ? item.question : item))
          .filter((item, index, values) => item && values.indexOf(item) === index);
      }

      function preparationReady() {
        const preparation = isObject(state.preparation) ? state.preparation : {};
        return (
          preparation.ready === true ||
          preparation.can_run === true ||
          preparation.status === "ready_for_approval"
        ) && preparationBlockers().length === 0;
      }

      function approvedConfiguration() {
        const preparation = isObject(state.preparation) ? state.preparation : {};
        return (
          (isObject(preparation.run_config) && preparation.run_config) ||
          reviewPayload()
        );
      }

      function runRecord(payload) {
        if (!isObject(payload)) return null;
        return isObject(payload.run) ? payload.run : payload;
      }

      function currentRunId(payload) {
        const run = runRecord(payload);
        return text(payload?.run_id || run?.run_id || run?.id);
      }

      function terminalRunStatus(value) {
        return ["completed", "complete", "succeeded", "failed", "cancelled", "canceled"]
          .includes(text(value).toLowerCase());
      }

      function successfulRunStatus(value) {
        return ["completed", "complete", "succeeded"]
          .includes(text(value).toLowerCase());
      }

      function stepIndex(id) {
        return Math.max(0, STEPS.findIndex((step) => step.id === id));
      }

      function canNavigateTo(id) {
        if (state.busy && !state.run) return false;
        if (id === state.step) return false;
        if (id === "thread") return true;
        if (id === "configure") return Boolean(state.inspection);
        if (id === "run") return Boolean(state.run);
        if (id === "results") return Boolean(state.report);
        return false;
      }

      function renderRail() {
        const current = stepIndex(state.step);
        return `
          <nav class="step-rail" aria-label="Bakeoff progress">
            <p class="step-rail__label">Bakeoff</p>
            <ol class="steps">
              ${STEPS.map((step, index) => {
                const isCurrent = step.id === state.step;
                const completed = (
                  index < current ||
                  (step.id === "run" && state.run && successfulRunStatus(state.run.status))
                );
                const clickable = canNavigateTo(step.id);
                const marker = completed ? "✓" : String(index + 1);
                const missingRequirements = (
                  step.id === "run" && state.step === "configure" && !state.run
                ) ? reviewProblems() : [];
                const tooltipId = `${step.id}-requirements-tooltip`;
                return `
                  <li class="step-item" ${missingRequirements.length
                    ? `tabindex="0" aria-describedby="${tooltipId}"`
                    : ""}>
                    <button
                      type="button"
                      class="step-button"
                      data-action="go-step"
                      data-step="${escapeHtml(step.id)}"
                      data-state="${completed ? "complete" : isCurrent ? "current" : "waiting"}"
                      data-clickable="${clickable}"
                      ${isCurrent ? 'aria-current="step"' : ""}
                      ${clickable ? "" : "disabled"}
                    >
                      <span class="step-number" aria-hidden="true">${marker}</span>
                      <span class="step-copy">
                        <span class="step-name">${escapeHtml(step.name)}</span>
                        <span class="step-state">${escapeHtml(
                          completed ? "Complete" : isCurrent ? "Current step" : step.short
                        )}</span>
                      </span>
                    </button>
                    ${missingRequirements.length
                      ? `<div id="${tooltipId}" class="step-tooltip" role="tooltip">
                          <strong>Complete required fields before starting</strong>
                          <ul>${missingRequirements.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
                        </div>`
                      : ""}
                  </li>
                `;
              }).join("")}
            </ol>
            ${renderDiagnostics()}
          </nav>
        `;
      }

      function renderDiagnostics() {
        const exactLogPath = text(state.run?.log_path);
        const runPath = exactLogPath || state.runRoot;
        if (!runPath && !state.controllerLogPath) return "";
        return `
          <div class="diagnostics" aria-label="Local diagnostics">
            ${runPath
              ? `<div>
                  <p>${exactLogPath ? "Current run log" : "Run log root"}</p>
                  <code title="${escapeHtml(runPath)}">${escapeHtml(runPath)}</code>
                </div>`
              : ""}
            ${state.controllerLogPath
              ? `<div>
                  <p>Controller log</p>
                  <code title="${escapeHtml(state.controllerLogPath)}">${escapeHtml(state.controllerLogPath)}</code>
                </div>`
              : ""}
          </div>
        `;
      }

      function renderGlobalMessages() {
        const messages = [];
        if (state.error) {
          messages.push(`
            <div class="banner banner--error" role="alert">
              <span class="banner__mark" aria-hidden="true">!</span>
              <div class="banner__body">
                <strong>Something needs attention</strong>
                <p>${escapeHtml(state.error)}</p>
              </div>
            </div>
          `);
        }
        if (state.notice) {
          messages.push(`
            <div class="banner banner--success" role="status">
              <span class="banner__mark" aria-hidden="true">✓</span>
              <div class="banner__body"><p>${escapeHtml(state.notice)}</p></div>
            </div>
          `);
        }
        return messages.join("");
      }

      function pageHeading(eyebrow, heading, description) {
        return `
          <header class="page-heading">
            <p class="eyebrow">${escapeHtml(eyebrow)}</p>
            <h1 id="page-title" tabindex="-1">${escapeHtml(heading)}</h1>
            <p class="lede">${escapeHtml(description)}</p>
          </header>
        `;
      }

      function renderThreadStep() {
        const needle = state.query.trim().toLowerCase();
        const threads = state.threads.filter((thread) => {
          if (!needle) return true;
          return [
            threadTitle(thread),
            thread.project_dir,
            thread.claude_model,
            thread.imported_thread_id,
          ].some((value) => text(value).toLowerCase().includes(needle));
        });
        return `
          ${pageHeading(
            "Historical source",
            "Choose an imported Claude thread",
            "The relevant conversation is reconstructed into one editable replay task. Claude is not rerun."
          )}
          ${state.busy === "inspection"
            ? `<div class="banner" role="status">
                <span class="spinner" aria-hidden="true"></span>
                <div class="banner__body">
                  <strong>Inspecting ${escapeHtml(threadTitle(state.selectedThread || {}))}</strong>
                  <p>Loading the thread, models, baseline, and capabilities…</p>
                </div>
              </div>`
            : ""}
          ${state.run
            ? `<div class="banner banner--warning" role="status">
                <span class="banner__mark" aria-hidden="true">i</span>
                <div class="banner__body">
                  <strong>A bakeoff is already ${terminalRunStatus(state.run.status) ? "recorded" : "running"}</strong>
                  <p>Reviewing this list does not replace the current run.</p>
                  <button type="button" class="button button--quiet" data-action="reset-controller" ${state.busy ? "disabled" : ""}>Start another bakeoff</button>
                </div>
              </div>`
            : ""}
          <section class="panel" aria-labelledby="threads-heading">
            <div class="panel__header">
              <div>
                <h2 id="threads-heading">Imported threads</h2>
                <p>${state.loading ? "Loading local imports…" : `${threads.length} of ${state.totalThreads || state.threads.length} shown`}</p>
              </div>
              <button
                type="button"
                class="button button--quiet"
                data-action="refresh-threads"
                ${state.busy ? "disabled" : ""}
              >Refresh</button>
            </div>
            <div class="panel__body">
              <label class="sr-only" for="thread-search">Search imported threads</label>
              <div class="search">
                <span class="search__icon" aria-hidden="true"></span>
                <input
                  id="thread-search"
                  type="search"
                  autocomplete="off"
                  placeholder="Search by title, project, model, or ID"
                  value="${escapeHtml(state.query)}"
                >
              </div>
              ${state.loading
                ? `<div class="thread-list" aria-label="Loading threads">
                    <div class="skeleton"></div>
                    <div class="skeleton"></div>
                    <div class="skeleton"></div>
                  </div>`
                : threads.length
                  ? `<div class="thread-list">
                      ${threads.map((thread, index) => {
                        const id = threadId(thread);
                        const number = index + 1;
                        const project = text(thread.project_dir, "No project detected");
                        const complexity = Number(thread.complexity_score);
                        const calls = Number(thread.tool_call_count);
                        return `
                          <button
                            type="button"
                            class="thread"
                            data-action="select-thread"
                            data-thread-id="${escapeHtml(id)}"
                            data-thread-number="${number}"
                            ${!id || state.busy || state.run ? "disabled" : ""}
                          >
                            <span>
                              <span class="thread__title"><span class="thread__number">#${number}</span>${escapeHtml(threadTitle(thread))}</span>
                              <span class="thread__meta">
                                <span>${escapeHtml(formatDate(thread.created_at))}</span>
                                <span class="thread__project" title="${escapeHtml(project)}">${escapeHtml(project)}</span>
                                ${Number.isFinite(complexity) ? `<span>Complexity ${complexity}</span>` : ""}
                                ${Number.isFinite(calls) ? `<span>${calls} tool calls</span>` : ""}
                                ${thread.claude_model ? `<span>${escapeHtml(thread.claude_model)}</span>` : ""}
                              </span>
                            </span>
                            <span class="arrow" aria-hidden="true">›</span>
                          </button>
                        `;
                      }).join("")}
                    </div>`
                  : `<div class="empty">
                      ${state.query
                        ? "No imported threads match this search."
                        : "No imported Claude threads are available."}
                    </div>`
              }
            </div>
          </section>
        `;
      }

      function capabilityRows(capabilities) {
        const items = asArray(capabilities.items);
        if (!items.length) {
          const count = Number(capabilities.observed_count);
          return `
            <li class="capability">
              <span class="capability__dot" aria-hidden="true"></span>
              <span>${Number.isFinite(count) ? `${count} capabilities observed` : "No capability gaps recorded"}</span>
            </li>
          `;
        }
        return items.map((item) => {
          const record = isObject(item) ? item : { name: text(item) };
          const status = text(record.status || record.parity || "available").toLowerCase();
          const tone = /missing|not_available|unsupported|failed/.test(status)
            ? "bad"
            : /partial|warning|limited|manual/.test(status)
              ? "warning"
              : "";
          return `
            <li class="capability ${tone ? `capability--${tone}` : ""}">
              <span class="capability__dot" aria-hidden="true"></span>
              <span>
                ${escapeHtml(record.title || record.name || record.capability || record.tool || "Observed capability")}
                ${record.reason || record.status
                  ? `<small>${escapeHtml(record.reason || titleCase(record.status))}</small>`
                  : ""}
                ${record.guidance ? `<small>${escapeHtml(record.guidance)}</small>` : ""}
              </span>
            </li>
          `;
        }).join("");
      }

      function fileMetadata(file, kind) {
        const values = [];
        if (kind === "git") {
          if (file.staged) values.push("staged");
          if (file.unstaged) values.push("unstaged");
          if (file.untracked) values.push("untracked");
          if (!values.length && file.status) values.push(text(file.status).trim());
        } else if (file.kind) {
          values.push(titleCase(file.kind));
        }
        if (Number.isFinite(Number(file.size))) {
          values.push(`${new Intl.NumberFormat().format(Number(file.size))} bytes`);
        }
        if (file.reason) values.push(text(file.reason));
        return values.filter(Boolean);
      }

      function renderGitFiles(files, selection) {
        return `
          <div class="panel__body">
            ${files.length
              ? `<ul class="file-list">
                  ${files.map((file) => {
                    const path = text(file.path);
                    const selectable = file.selectable === true;
                    const selected = state.classifications[path] === "claude";
                    return `
                      <li class="file-row">
                        <span class="file-copy">
                          <span class="file-path" title="${escapeHtml(path)}">${escapeHtml(path)}</span>
                          <span class="file-meta">
                            ${fileMetadata(file, "git").map((item) => `<span>${escapeHtml(item)}</span>`).join("")}
                          </span>
                        </span>
                        <label class="choice" ${selectable ? "" : 'aria-disabled="true"'}>
                          <input
                            type="checkbox"
                            data-file-kind="git"
                            data-path="${escapeHtml(path)}"
                            ${selected ? "checked" : ""}
                            ${selectable && !state.busy && !state.run ? "" : "disabled"}
                          >
                          <span>Attribute to this run</span>
                        </label>
                      </li>
                    `;
                  }).join("")}
                </ul>`
              : `<p class="empty">The current Git working tree is clean. No attribution is required.</p>`
            }
          </div>
        `;
      }

      function renderNonGitFiles(files) {
        return `
          <div class="panel__body">
            ${files.length
              ? `<ul class="file-list">
                  ${files.map((file, index) => {
                    const path = text(file.path);
                    const selectable = file.selectable === true;
                    const selected = state.classifications[path] || "";
                    return `
                      <li class="file-row">
                        <span class="file-copy">
                          <span class="file-path" title="${escapeHtml(path)}">${escapeHtml(path)}</span>
                          <span class="file-meta">
                            ${fileMetadata(file, "non_git").map((item) => `<span>${escapeHtml(item)}</span>`).join("")}
                          </span>
                        </span>
                        <span class="segmented" role="radiogroup" aria-label="Classification for ${escapeHtml(path)}">
                          <label class="segment">
                            <input
                              type="radio"
                              name="file-${index}"
                              value="claude"
                              data-file-kind="non_git"
                              data-path="${escapeHtml(path)}"
                              ${selected === "claude" ? "checked" : ""}
                              ${selectable && !state.busy && !state.run ? "" : "disabled"}
                            >
                            <span>Created by Claude</span>
                          </label>
                          <label class="segment">
                            <input
                              type="radio"
                              name="file-${index}"
                              value="exclude"
                              data-file-kind="non_git"
                              data-path="${escapeHtml(path)}"
                              ${selected === "exclude" ? "checked" : ""}
                              ${state.busy || state.run ? "disabled" : ""}
                            >
                            <span>Exclude</span>
                          </label>
                        </span>
                      </li>
                    `;
                  }).join("")}
                </ul>`
              : `<p class="empty">No current files were found in this directory.</p>`
            }
          </div>
        `;
      }

      function capabilityGaps(capabilities) {
        return asArray(capabilities.items).filter((item) => {
          const status = text(item?.status || item?.parity).toLowerCase();
          return /missing|not_available|unsupported|failed/.test(status);
        });
      }

      function configurationStepProblems(index) {
        const draft = normalizeReviewDraft(state.reviewDraft);
        if (!draft) return ["Open a configuration draft."];
        const problems = [];
        if (index === 0) {
          if (!draft.thread_id.trim()) problems.push("Choose the Claude task again.");
          if (!draft.source_path.trim()) problems.push("The selected Claude task has no source transcript.");
          if (!draft.message_uuid.trim()) problems.push("Enter the message ID within the original thread.");
          if (!draft.request.trim()) problems.push("Enter the reconstructed task prompt.");
          if (!draft.repo.trim()) problems.push("Enter the replay repository.");
