<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Bakeoff</title>
  <link rel="stylesheet" href="/controller.css">
</head>
<body>
  <div id="app" class="app">
    <p class="empty">Connecting to Codex Bakeoff…</p>
  </div>

  <script src="/controller-ranges.js"></script>
  <script>
    (() => {
      "use strict";

      const STEPS = [
        { id: "thread", name: "Choose thread", short: "Imported history" },
        { id: "configure", name: "Configure", short: "Exact configuration" },
        { id: "run", name: "Run", short: "Isolated replay" },
        { id: "results", name: "Results", short: "Comparison report" },
      ];

      const CONFIGURATION_STEPS = [
        { id: "replay", name: "Replay details" },
        { id: "beginning", name: "Beginning state" },
        { id: "end", name: "End state" },
        { id: "output", name: "Historical output" },
        { id: "capabilities", name: "Capability parity" },
        { id: "confirm", name: "Review & confirm" },
      ];

      const DEFAULT_PHASES = [
        ["preparing", "Preparing configuration"],
        ["creating_workspace", "Creating isolated workspace"],
        ["implementing", "Implementing with Codex"],
        ["collecting", "Capturing result"],
        ["reviewing", "Running blind review"],
        ["reporting", "Finalizing report"],
      ];

      const DEFAULT_MODEL_IDS = [
        "gpt-5.6-sol",
        "gpt-5.6-terra",
        "gpt-5.6-luna",
      ];

      const THREAD_PAGE_SIZE = 20;
      const THREAD_SEARCH_DEBOUNCE_MS = 200;
      const DRAFT_STORAGE_KEY = "codex-bakeoff.controller-draft.v7";
      const ACTIVE_RUN_STORAGE_KEY = "codex-bakeoff.controller-active-run.v1";
      const DRAFT_VERSION = 7;
      const DRAFT_STEPS = new Set(["thread", "configure"]);

      const state = {
        step: "thread",
        hostReady: false,
        loading: true,
        busy: "",
        error: "",
        notice: "",
        threads: [],
        totalThreads: 0,
        threadSource: "",
        importedTotal: 0,
        sampleTotal: 0,
        query: "",
        selectedThreadId: "",
        selectedThreadNumber: 0,
        selectedThread: null,
        selectedThreads: [],
        batchId: "",
        batch: null,
        batchPreparing: false,
        batchView: "aggregate",
        inspection: null,
        replayMode: "whole",
        actionableTurns: [],
        dividers: [],
        activeUnitKey: "",
        unitDrafts: {},
        wholeDraft: null,
        attributionEdits: [],
        pendingUnitKeys: [],
        unitRuns: {},
        submittingUnitKey: "",
        maxParallelRuns: 8,
        models: [],
        model: "",
        selectedModels: [],
        classifications: Object.create(null),
        reviewDraft: null,
        configurationStep: 0,
        configurationMaxStep: 0,
        configurationDetailsOpen: false,
        reviewRevision: 0,
        promptGeneration: "",
        promptEditRevision: 0,
        promptSynthesisGeneration: 0,
        workingDirectoryEditRevision: 0,
        workingDirectoryGeneration: 0,
        workingDirectoryLoading: false,
        preparation: null,
        runId: "",
        run: null,
        runs: [],
        runErrors: [],
        report: null,
        reportPaths: null,
        runRoot: "",
        pluginVersion: "",
        controllerSessionId: "",
        pollGeneration: 0,
      };

      const app = document.getElementById("app");
      let draftPersistenceReady = false;
      let startPending = false;
      let heartbeatTimer = null;
      let threadLoadGeneration = 0;
      let threadSearchTimer = null;

      const isObject = (value) =>
        value !== null && typeof value === "object" && !Array.isArray(value);

      const asArray = (value) => Array.isArray(value) ? value : [];

      const text = (value, fallback = "") =>
        typeof value === "string" || typeof value === "number"
          ? String(value)
          : fallback;

      const escapeHtml = (value) =>
        text(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");

      const safeJson = (value) => {
        try {
          return JSON.stringify(value, null, 2);
        } catch {
          return "The configuration could not be serialized.";
        }
      };

      const stringList = (value) => asArray(value)
        .map((item) => text(item).trim())
        .filter((item, index, values) => item && values.indexOf(item) === index);

      function normalizeReviewDraft(value) {
        if (!isObject(value)) return null;
        const models = stringList(value.models?.length ? value.models : [value.model]);
        return {
          thread_id: text(value.thread_id),
          source_path: text(value.source_path),
          message_uuid: text(value.message_uuid),
          request: text(value.request),
          repo: text(value.repo),
          beginning_kind: ["git", "non_git"].includes(value.beginning_kind)
            ? value.beginning_kind
            : "",
          ending_kind: ["git", "non_git"].includes(value.ending_kind)
            ? value.ending_kind
            : "",
          baseline_commit: text(value.baseline_commit),
          ending_commit: text(value.ending_commit),
          model: models[0] || "",
          models,
        };
      }

      function normalizeDraft(value) {
        if (!isObject(value) || value.version !== DRAFT_VERSION) return null;
        const classifications = Object.create(null);
        if (isObject(value.classifications)) {
          for (const [path, classification] of Object.entries(value.classifications)) {
            if (path && ["claude", "exclude"].includes(classification)) {
              classifications[path] = classification;
            }
          }
        }
        return {
          version: DRAFT_VERSION,
          step: DRAFT_STEPS.has(value.step) ? value.step : "thread",
          selectedThreadId: text(value.selectedThreadId),
          selectedThreadNumber: Number.isInteger(value.selectedThreadNumber) && value.selectedThreadNumber > 0
            ? value.selectedThreadNumber
            : 0,
          selectedThreads: normalizeSelectedThreads(value.selectedThreads),
          model: text(value.model),
          selectedModels: stringList(value.selectedModels?.length
            ? value.selectedModels : value.reviewDraft?.models?.length
              ? value.reviewDraft.models : [value.model]),
          classifications,
          reviewDraft: normalizeReviewDraft(value.reviewDraft),
          replayMode: value.replayMode === "chunks" ? "chunks" : "whole",
          actionableTurns: asArray(value.actionableTurns).filter((turn) => text(turn?.message_uuid)),
          dividers: stringList(value.dividers),
          activeUnitKey: text(value.activeUnitKey),
          unitDrafts: Object.fromEntries(Object.entries(isObject(value.unitDrafts) ? value.unitDrafts : {})
            .map(([key, draft]) => [key, normalizeUnitDraft(draft)]).filter(([, draft]) => draft)),
          wholeDraft: normalizeUnitDraft(value.wholeDraft),
          pendingUnitKeys: stringList(value.pendingUnitKeys),
          unitRuns: Object.fromEntries(Object.entries(isObject(value.unitRuns) ? value.unitRuns : {})
            .map(([key, ids]) => [key, stringList(ids)])),
          submittingUnitKey: text(value.submittingUnitKey),
          configurationStep: Number.isInteger(value.configurationStep)
            ? Math.min(Math.max(value.configurationStep, 0), CONFIGURATION_STEPS.length - 1)
            : 0,
          configurationMaxStep: Number.isInteger(value.configurationMaxStep)
            ? Math.min(Math.max(value.configurationMaxStep, 0), CONFIGURATION_STEPS.length - 1)
            : 0,
        };
      }

      function controllerStorageKey(key) {
        return state.controllerSessionId ? `${key}.${state.controllerSessionId}` : "";
      }

      function loadDraft() {
        const key = controllerStorageKey(DRAFT_STORAGE_KEY);
        if (!key) return null;
        try {
          return normalizeDraft(JSON.parse(localStorage.getItem(key) || "null"));
        } catch {
          return null;
        }
      }

      function loadActiveRunId() {
        const key = controllerStorageKey(ACTIVE_RUN_STORAGE_KEY);
        if (!key) return "";
        try {
          return text(localStorage.getItem(key));
        } catch {
          return "";
        }
      }

      function rememberActiveRun(runId) {
        const key = controllerStorageKey(ACTIVE_RUN_STORAGE_KEY);
        if (!key) return;
        try {
          if (runId) localStorage.setItem(key, runId);
          else localStorage.removeItem(key);
        } catch {
          // Runs remain durable.
        }
      }

      function draftSnapshot() {
        rememberBatchThread();
        rememberUnitDraft();
        const reviewDraft = normalizeReviewDraft(state.reviewDraft);
        if (reviewDraft && state.replayMode === "whole") delete reviewDraft.request;
        const wholeDraft = normalizeUnitDraft(state.wholeDraft);
        if (wholeDraft?.reviewDraft) delete wholeDraft.reviewDraft.request;
        return {
          version: DRAFT_VERSION,
          step: DRAFT_STEPS.has(state.step) ? state.step : "thread",
          selectedThreadId: state.selectedThreadId,
          selectedThreadNumber: state.selectedThreadNumber,
          selectedThreads: normalizeSelectedThreads(state.selectedThreads),
          model: state.model,
          selectedModels: state.selectedModels,
          classifications: Object.fromEntries(
            Object.entries(state.classifications)
              .filter(([, value]) => ["claude", "exclude"].includes(value))
          ),
          reviewDraft,
          replayMode: state.replayMode,
          actionableTurns: state.actionableTurns.map(({ message_uuid }) => ({ message_uuid })),
          dividers: state.dividers,
          activeUnitKey: state.activeUnitKey,
          unitDrafts: state.unitDrafts,
          wholeDraft,
          pendingUnitKeys: state.pendingUnitKeys,
          unitRuns: state.unitRuns,
          submittingUnitKey: state.submittingUnitKey,
          configurationStep: state.configurationStep,
          configurationMaxStep: state.configurationMaxStep,
        };
      }

      function saveDraft() {
        if (
          !draftPersistenceReady ||
          (state.replayMode !== "chunks" && (
            startPending || state.run || ["run", "results"].includes(state.step)
          ))
        ) return;
        try {
          localStorage.setItem(controllerStorageKey(DRAFT_STORAGE_KEY), JSON.stringify(draftSnapshot()));
        } catch {
          // Draft persistence is best-effort.
        }
      }

      function clearDraft() {
        const key = controllerStorageKey(DRAFT_STORAGE_KEY);
        if (!key) return;
        try {
          localStorage.removeItem(key);
        } catch {
          // Reset without browser storage.
        }
      }

      let restoredDraft = null;

      const {
        normalizeUnitDraft, rememberUnitDraft, restoreUnitState, replayUnits,
        activeUnit, rangeParameters, earlierFileAttribution, configurationIsLocked,
        editReplayUnit, changeReplayMode, toggleDivider, remainingUnits, unitConfigured, allUnitsConfigured, markUnitInspected,
        startChunks, advanceChunkQueue, chunkLaunchActive, renderPendingChunks, renderRangeSelection, resultUnit, selectChunkResult, renderChunkResults,
        recoverRangeRuns, resultUnits, resultScope
      } = globalThis.createReplayRangeUI({
        state, isObject, asArray, text, stringList, normalizeReviewDraft, escapeHtml, terminalRunStatus,
        render: (...args) => render(...args),
        callTool: (...args) => callTool(...args),
        initializeClassifications: (...args) => initializeClassifications(...args),
        reviewDraftFromConfiguration: (...args) => reviewDraftFromConfiguration(...args),
        inspectionParts: (...args) => inspectionParts(...args),
        setSelectedModels: (...args) => setSelectedModels(...args),
        synthesizePrompt: (...args) => synthesizePrompt(...args),
        inferWorkingDirectory: (...args) => inferWorkingDirectory(...args),
        saveDraft: (...args) => saveDraft(...args),
        prepareRun: (...args) => prepareRun(...args),
        reviewProblems: (...args) => reviewProblems(...args),
        preparationBlockers: (...args) => preparationBlockers(...args),
        replayDetailsLoading: (...args) => replayDetailsLoading(...args),
        selectionNeedsRefresh: (...args) => selectionNeedsRefresh(...args),
        activateRun: (...args) => activateRun(...args),
        rememberActiveRun: (...args) => rememberActiveRun(...args),
        preparationReady: () => preparationReady(),
        startRun: () => startRun(),
        beginPolling: () => beginPolling(),
      });

      const {
        normalizeSelectedThreads, isThreadBatch, restoreBatch, rememberBatchThread, toggleThreadSelection, configureSelectedThreads, selectBatchThread, renderBatchConfiguration, startThreadBatch, batchThreadResults, selectThreadResult, renderBatchResultsNavigation, aggregateModelResults, renderAggregateResults, renderThreadStep
      } = globalThis.createReplayBatchUI({
        state, text, isObject, asArray, stringList, normalizeUnitDraft, normalizeReviewDraft, escapeHtml,
        threadTitle: (...args) => threadTitle(...args),
        threadId: (...args) => threadId(...args),
        reviewProblems: (...args) => reviewProblems(...args),
        preparationBlockers: (...args) => preparationBlockers(...args),
        replayDetailsLoading: (...args) => replayDetailsLoading(...args),
        selectionNeedsRefresh: (...args) => selectionNeedsRefresh(...args),
        render: (...args) => render(...args),
        selectThread: (...args) => selectThread(...args),
        setSelectedModels: (...args) => setSelectedModels(...args),
        refreshAttributionAndContinue: (...args) => refreshAttributionAndContinue(...args),
        reviewPayload: (...args) => reviewPayload(...args),
        callTool: (...args) => callTool(...args),
        ownedRunRecord: (...args) => ownedRunRecord(...args),
        currentRunId: (...args) => currentRunId(...args),
        clearDraft: (...args) => clearDraft(...args),
        rememberActiveRun: (...args) => rememberActiveRun(...args),
        activateRun: (...args) => activateRun(...args),
        beginPolling: (...args) => beginPolling(...args),
        applyPreparationInspection: (...args) => applyPreparationInspection(...args),
        formatCost: (...args) => formatCost(...args),
        formatDate: (...args) => formatDate(...args),
        terminalRunStatus: (...args) => terminalRunStatus(...args),
        successfulRunStatus: (...args) => successfulRunStatus(...args),
        pageHeading: (...args) => pageHeading(...args),
        setStartPending: (value) => { startPending = value; },
        clearRestoredDraft: () => { restoredDraft = null; },
      });

      const pathBase = (value) => {
        const parts = text(value).split("/").filter(Boolean);
        return parts.at(-1) || text(value, "Unknown project");
      };

      const titleCase = (value) =>
        text(value, "unknown")
          .replaceAll("_", " ")
          .replace(/\b\w/g, (letter) => letter.toUpperCase());

      const formatDate = (value) => {
        const stamp = Date.parse(text(value));
        if (!Number.isFinite(stamp)) return "Date unavailable";
        return new Intl.DateTimeFormat(undefined, {
          dateStyle: "medium",
          timeStyle: "short",
        }).format(stamp);
      };

      const formatTime = (value) => {
        const stamp = Date.parse(text(value));
        if (!Number.isFinite(stamp)) return "—";
        return new Intl.DateTimeFormat(undefined, {
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit",
        }).format(stamp);
      };

      const formatDuration = (value) => {
        if (value === null || value === undefined || value === "") return "Unavailable";
        const amount = Number(value);
        if (!Number.isFinite(amount) || amount < 0) return "Unavailable";
        const seconds = Math.round(amount), hours = Math.floor(seconds / 3600), minutes = Math.floor((seconds % 3600) / 60), remainder = seconds % 60;
        return [hours && `${hours}h`, minutes && `${minutes}m`, (remainder || (!hours && !minutes)) && `${remainder}s`].filter(Boolean).join(" ");
      };

      const formatTokens = (value) => {
        const amount = Number(value);
        return Number.isFinite(amount) ? new Intl.NumberFormat().format(amount) : "Unavailable";
      };

      const formatCost = (value) => {
        if (value === null || value === undefined || value === "") return "Unavailable";
        const amount = Number(value);
        return Number.isFinite(amount) ? `$${amount.toFixed(amount < .01 ? 4 : 2)}` : "Unavailable";
      };

      const outcomeSummary = globalThis.createReplayOutcomeSummary({ isObject, formatCost });

      function unwrapToolResult(result) {
        if (isObject(result) && result.isError) {
          const content = asArray(result.content);
          const message = content
            .filter((item) => isObject(item) && item.type === "text")
            .map((item) => text(item.text))
            .join("\n");
          throw new Error(message || "The controller tool returned an error.");
        }
        if (isObject(result) && isObject(result.structuredContent)) {
          return result.structuredContent;
        }
        if (isObject(result) && isObject(result.result)) {
          return unwrapToolResult(result.result);
        }
        if (isObject(result)) {
          const content = asArray(result.content);
          for (const item of content) {
            if (!isObject(item) || item.type !== "text") continue;
            try {
              const parsed = JSON.parse(text(item.text));
              if (isObject(parsed)) return parsed;
            } catch {
              // Ignore human-readable content.
            }
          }
          return result;
        }
        throw new Error("The controller returned an unreadable response.");
      }

      async function callTool(name, args = {}) {
        let response;
        try {
          response = await fetch("/api/call", {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ name, arguments: args }),
          });
        } catch {
          throw new Error(
            "The local replay service is unavailable. Invoke the plugin again to reopen it."
          );
        }
        let result;
        try {
          result = await response.json();
        } catch {
          throw new Error("The local replay service returned an unreadable response.");
        }
        if (!response.ok && !result.isError) {
          throw new Error(text(result.error, `The controller request failed (${response.status}).`));
        }
        return unwrapToolResult(result);
      }

      async function heartbeatController() {
        try {
          const response = await fetch("/api/heartbeat", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: "{}",
          });
          if (!response.ok) return;
          const payload = await response.json();
          if (
            state.controllerSessionId &&
            text(payload.controller_session_id) !== state.controllerSessionId
          ) {
            stopControllerHeartbeat();
            state.error = "The controller session changed. Invoke the plugin again to reopen it.";
            render();
          }
        } catch {
          // Requests report connectivity failures.
        }
      }

      function stopControllerHeartbeat() {
        if (heartbeatTimer !== null) window.clearInterval(heartbeatTimer);
        heartbeatTimer = null;
      }

      function startControllerHeartbeat() {
        stopControllerHeartbeat();
        void heartbeatController();
        heartbeatTimer = window.setInterval(heartbeatController, 15_000);
      }

      function threadId(thread) {
        if (!isObject(thread)) return "";
        return text(
          thread.imported_thread_id ||
          thread.thread_id ||
          thread.id ||
          thread.session_id
        );
      }

      function threadTitle(thread) {
        return text(thread?.title || thread?.name || thread?.request, "Untitled Claude thread");
      }

      function threadStepEyebrow(label) {
        return state.selectedThreadNumber > 0
          ? `${label} · Thread #${state.selectedThreadNumber}`
          : label;
      }

      function normalizeModels(values) {
        const found = new Map(asArray(values).flatMap((item) => {
          const value = typeof item === "string" ? { id: item } : item;
          if (!isObject(value)) return [];
          const id = text(value.id || value.slug || value.model).trim();
          if (!id) return [];
          return [[id, {
            id,
            label: text(value.label || value.display_name || value.name, id),
            description: text(value.description),
            recommended: value.recommended === true || value.is_default === true,
          }]];
        }));
        return [...found.values()];
      }

      function setSelectedModels(values) {
        const available = new Set(state.models.map(({ id }) => id));
        state.selectedModels = stringList(values).filter((id) => !available.size || available.has(id));
        if (!state.selectedModels.length && state.models.length) {
          state.selectedModels = DEFAULT_MODEL_IDS.filter((id) => available.has(id));
          if (!state.selectedModels.length) {
            state.selectedModels = [selectedModelDefault()];
          }
        }
        state.model = state.selectedModels[0] || "";
        if (state.reviewDraft) {
          state.reviewDraft.model = state.model;
          state.reviewDraft.models = [...state.selectedModels];
        }
      }

      function inspectionParts() {
        const inspection = isObject(state.inspection) ? state.inspection : {};
        const baseline = isObject(inspection.baseline) ? inspection.baseline : {};
        const selection = isObject(inspection.file_selection)
          ? inspection.file_selection
          : {};
        const workspace = isObject(inspection.workspace) ? inspection.workspace : {};
        const capabilities = isObject(inspection.capabilities)
          ? inspection.capabilities
          : {};
        const replay = isObject(inspection.replay)
          ? inspection.replay
          : (isObject(inspection.thread) ? inspection.thread : {});
        const candidates = asArray(
          workspace.files?.length ? workspace.files : selection.candidates
        );
        const kind = text(
          workspace.kind || selection.source_kind || baseline.source_kind || baseline.kind
        );
        const carried = new Set(asArray(selection.before_files)
          .map((file) => text(isObject(file) ? file.path : file)));
        const outputs = new Set(asArray(kind === "git" ? selection.claude_output_changes
          : selection.classifications?.created_by_claude)
          .map((file) => text(isObject(file) ? file.path : file)));
        const files = state.replayMode === "chunks"
          ? candidates.filter((file) => !carried.has(text(file?.path)) || outputs.has(text(file?.path)))
          : candidates;
        return { inspection, baseline, selection, workspace, capabilities, replay, files, kind };
      }

      function initializeClassifications() {
        state.classifications = Object.create(null);
        const { selection, files, kind } = inspectionParts();
        if (kind === "git") {
          const selected = new Set(
            asArray(selection.claude_output_changes).map((item) =>
              text(isObject(item) ? item.path : item)
            )
          );
          for (const file of files) {
            const path = text(file?.path);
            if (path) state.classifications[path] = selected.has(path) ? "claude" : "exclude";
          }
          return;
        }
        const classes = isObject(selection.classifications)
          ? selection.classifications
          : {};
        for (const item of asArray(classes.created_by_claude)) {
          const path = text(isObject(item) ? item.path : item);
          if (path) state.classifications[path] = "claude";
        }
        for (const item of asArray(classes.exclude)) {
          const path = text(isObject(item) ? item.path : item);
          if (path) state.classifications[path] = "exclude";
        }
        for (const file of files) {
          const path = text(file?.path);
          if (!path) continue;
          if (file.selectable !== true || file.suggested_class === "exclude") {
            state.classifications[path] = "exclude";
          }
        }
      }

      function applyDraftToInspection(draft) {
        if (!isObject(draft)) return;
        setSelectedModels(draft.selectedModels);
        state.configurationStep = draft.configurationStep;
        state.configurationMaxStep = Math.max(
          draft.configurationStep,
          draft.configurationMaxStep
        );
        const { files } = inspectionParts();
        const fileByPath = new Map(
          files
            .map((file) => [text(file?.path), file])
            .filter(([path]) => Boolean(path))
        );
        for (const [path, classification] of Object.entries(draft.classifications)) {
          const file = fileByPath.get(path);
          if (!file || !["claude", "exclude"].includes(classification)) continue;
          state.classifications[path] =
            file.selectable === false ? "exclude" : classification;
        }
        state.reviewDraft = normalizeReviewDraft(draft.reviewDraft);
        if (state.reviewDraft) {
          setSelectedModels(state.selectedModels);
          const { replay } = inspectionParts();
          state.reviewDraft.request = text(replay.request);
        }
      }

      function selectedModelDefault() {
        return (
          state.models.find((model) => model.recommended)?.id ||
          state.models[0]?.id ||
          ""
        );
      }

      function recordPromptGeneration(requestGeneration, request = "") {
        if (!isObject(state.inspection)) return;
        for (const key of ["replay", "thread"]) {
          if (!isObject(state.inspection[key])) continue;
          state.inspection[key] = {
            ...state.inspection[key],
            ...(request ? { request } : {}),
            request_generation: requestGeneration,
          };
        }
      }

      async function synthesizePrompt(threadIdValue, fallbackRequest) {
        const generation = ++state.promptSynthesisGeneration;
        const editRevision = state.promptEditRevision;
        state.promptGeneration = "pending";
        recordPromptGeneration({ method: "pending" });
        render();
        try {
          const payload = await callTool("synthesize_request", {
            thread_id: threadIdValue,
            ...rangeParameters(),
          });
          if (
            generation !== state.promptSynthesisGeneration ||
            threadIdValue !== state.selectedThreadId
          ) return;
          const requestGeneration = isObject(payload.request_generation)
            ? payload.request_generation
            : {};
          const method = text(requestGeneration.method);
          const request = text(payload.request).trim();
          if (method === "llm_synthesis" && request) {
            state.promptGeneration = "llm_synthesis";
            const canReplace = (
              state.promptEditRevision === editRevision &&
              text(state.reviewDraft?.request) === fallbackRequest
            );
            if (canReplace && state.reviewDraft) {
              state.reviewDraft.request = request;
              state.reviewRevision += 1;
              state.preparation = null;
              recordPromptGeneration(requestGeneration, request);
            } else {
              recordPromptGeneration(requestGeneration);
            }
          } else {
            state.promptGeneration = "concatenated_fallback";
            recordPromptGeneration({ method: "concatenated_fallback" });
          }
        } catch {
          if (
            generation !== state.promptSynthesisGeneration ||
            threadIdValue !== state.selectedThreadId
          ) return;
          state.promptGeneration = "concatenated_fallback";
          recordPromptGeneration({ method: "concatenated_fallback" });
        } finally {
          if (
            generation === state.promptSynthesisGeneration &&
            threadIdValue === state.selectedThreadId
          ) {
            render();
          }
        }
      }

      async function inferWorkingDirectory(threadIdValue) {
        if (threadIdValue.startsWith("claude-sample:")) {
          state.workingDirectoryLoading = false;
          return;
        }
        const generation = ++state.workingDirectoryGeneration;
        const editRevision = state.workingDirectoryEditRevision;
        if (!state.workingDirectoryLoading) {
          state.workingDirectoryLoading = true;
          render();
        }
        try {
          const payload = await callTool("infer_working_directory", {
            thread_id: threadIdValue,
            ...rangeParameters(),
          });
          if (
            generation !== state.workingDirectoryGeneration ||
            threadIdValue !== state.selectedThreadId ||
            editRevision !== state.workingDirectoryEditRevision ||
            !state.reviewDraft
          ) return;
          const workingDirectory = text(payload.working_directory).trim();
          if (state.reviewDraft.repo !== workingDirectory) {
            state.reviewDraft.repo = workingDirectory;
            state.reviewRevision += 1;
            state.preparation = null;
            saveDraft();
            render();
          }
        } catch {
          // Keep the recorded cwd.
        } finally {
          if (
            generation === state.workingDirectoryGeneration &&
            threadIdValue === state.selectedThreadId
          ) {
            state.workingDirectoryLoading = false;
            render();
          }
        }
      }

      function selectionNeedsRefresh() {
        const draft = normalizeReviewDraft(state.reviewDraft);
        if (!draft || !state.inspection) return false;
        const { baseline, replay, selection } = inspectionParts();
        const inspectedBeginning = text(baseline.beginning_kind) || (
          baseline.kind === "git_commit"
            ? "git"
            : baseline.kind === "empty_directory" ||
                baseline.proposed_kind === "empty_directory"
              ? "non_git"
              : ""
        );
        const inspectedEnding = text(baseline.ending_kind) || text(
          selection.source_kind || baseline.source_kind
        );
        const inspectedRepository = text(
          baseline.attribution_root ||
          baseline.repository ||
          replay.project_dir
        );
        return (
          !inspectedBeginning ||
          !inspectedEnding ||
          draft.message_uuid.trim() !== text(replay.message_uuid).trim() ||
          draft.repo.trim() !== inspectedRepository.trim() ||
          draft.beginning_kind !== inspectedBeginning ||
          draft.ending_kind !== inspectedEnding ||
          (
            draft.beginning_kind === "git" &&
            draft.baseline_commit.trim().toLowerCase() !==
              text(baseline.commit).trim().toLowerCase()
          ) || (
            draft.ending_kind === "git" &&
            draft.ending_commit.trim().toLowerCase() !==
              text(baseline.ending_commit).trim().toLowerCase()
          )
        );
      }

      function selectionPayload() {
        const { baseline, files, kind } = inspectionParts();
        const draft = normalizeReviewDraft(state.reviewDraft);
        const isGit = draft
          ? draft.ending_kind === "git"
          : kind === "git";
        const refreshing = selectionNeedsRefresh();
        const claude = [];
        const excluded = [];
        for (const file of files) {
          const path = text(file?.path);
          if (!path) continue;
          if (state.classifications[path] === "claude") claude.push(path);
          else if (state.classifications[path] === "exclude") excluded.push(path);
        }
        const allClassified = files.every((file) => {
          const path = text(file?.path);
          return !path || ["claude", "exclude"].includes(state.classifications[path]);
        });
        const common = {
          thread_id: state.selectedThreadId,
          model: state.model,
          models: state.selectedModels,
          repo: text(baseline.attribution_root || baseline.repository) || undefined,
          claude_output_files: isGit && !refreshing ? claude : [],
          created_by_claude: !isGit && !refreshing ? claude : [],
          excluded_files: !isGit && !refreshing ? excluded : [],
          confirm_file_selection: refreshing
            ? false
            : isGit
              ? kind === "git"
              : kind === "non_git" && allClassified,
        };
        return Object.fromEntries(
          Object.entries(common).filter(([, value]) => value !== undefined)
        );
      }

      function applyPreparationInspection(preparation) {
        if (!isObject(preparation)) return;
        if (activeUnit() && !markUnitInspected(preparation)) return;
        const current = isObject(state.inspection) ? state.inspection : {};
        const baseline = isObject(preparation.baseline)
          ? preparation.baseline
          : current.baseline;
        const replay = isObject(preparation.replay)
          ? {
              ...(isObject(current.replay) ? current.replay : {}),
              ...preparation.replay,
            }
          : current.replay;
        const selection = isObject(preparation.file_selection)
          ? preparation.file_selection
          : current.file_selection;
        const capabilities = isObject(preparation.capabilities)
          ? preparation.capabilities
          : current.capabilities;
        const workspace = {
          ...(isObject(current.workspace) ? current.workspace : {}),
          kind: text(selection?.source_kind),
          files: asArray(selection?.candidates),
        };
        state.inspection = {
          ...current,
          baseline,
          replay,
          file_selection: selection,
          capabilities,
          workspace,
        };
        if (state.reviewDraft) {
          if (typeof replay?.message_uuid === "string") {
            state.reviewDraft.message_uuid = replay.message_uuid;
          }
          if (typeof replay?.request === "string") {
            state.reviewDraft.request = replay.request;
          }
          if (typeof baseline?.commit === "string") {
            state.reviewDraft.baseline_commit = baseline.commit;
          }
          if (typeof baseline?.ending_commit === "string") {
            state.reviewDraft.ending_commit = baseline.ending_commit;
          }
          if (["git", "non_git"].includes(baseline?.beginning_kind)) {
            state.reviewDraft.beginning_kind = baseline.beginning_kind;
          }
          if (["git", "non_git"].includes(baseline?.ending_kind)) {
            state.reviewDraft.ending_kind = baseline.ending_kind;
          }
        }
        initializeClassifications();
      }

      function inspectionDiagnostics() {
        const inspection = isObject(state.inspection) ? state.inspection : {};
        const selection = isObject(inspection.file_selection) ? inspection.file_selection : {};
        const repositoryBlockers = new Set(
          asArray(inspection.repository_blockers)
            .map((item) => text(isObject(item) ? item.message : item))
            .filter(Boolean)
        );
        return [
          ...asArray(inspection.diagnostics),
          ...asArray(inspection.blockers),
          ...asArray(selection.blocking_reasons),
        ]
          .map((item) => text(isObject(item) ? item.message : item))
          .filter((item, index, values) => (
            item && !repositoryBlockers.has(item) && values.indexOf(item) === index
          ));
      }

      function reviewDraftFromConfiguration() {
        const { inspection, baseline, selection, replay, kind } = inspectionParts();
        const failedSteps = new Set(
          asArray(inspection.diagnostics)
            .map((item) => text(isObject(item) ? item.step : ""))
            .filter(Boolean)
        );
        const beginningKind = text(baseline.beginning_kind) || (
          baseline.kind === "git_commit"
            ? "git"
            : baseline.kind === "empty_directory" || baseline.proposed_kind === "empty_directory"
              ? "non_git"
              : "git"
        );
        const endingKind = text(
          baseline.ending_kind || selection.source_kind || baseline.source_kind || kind
        ) || (beginningKind === "git" ? "git" : "non_git");
        const baselineUnresolved = (
          failedSteps.has("baseline") ||
          asArray(inspection.repository_blockers).length > 0 ||
          !beginningKind ||
          !endingKind
        );
        return normalizeReviewDraft({
          thread_id: state.selectedThreadId,
          source_path: replay.source_path || state.selectedThread?.source_path,
          message_uuid: failedSteps.has("thread") ? "" : replay.message_uuid,
          request: failedSteps.has("thread")
            ? ""
            : replay.request || state.selectedThread?.request,
          repo:
            replay.project_dir ||
            state.selectedThread?.project_dir,
          beginning_kind: beginningKind,
          ending_kind: beginningKind === "git" ? "git" : endingKind,
          baseline_commit: baselineUnresolved ? "" : baseline.commit,
          ending_commit: baselineUnresolved ? "" : baseline.ending_commit,
          model: state.model,
          models: state.selectedModels,
        });
      }

      function reviewPayload() {
        const draft = normalizeReviewDraft(state.reviewDraft) || {};
        const gitBeginning = draft.beginning_kind === "git";
        const gitEnding = draft.ending_kind === "git";
        const selection = selectionPayload();
        const earlier = earlierFileAttribution();
        const currentOutputs = new Set(gitEnding ? selection.claude_output_files : selection.created_by_claude);
        const carriedFiles = new Set(asArray(activeUnit() ? inspectionParts().selection.before_files : [])
          .map((file) => text(isObject(file) ? file.path : file)));
        return {
          thread_id: text(draft.thread_id).trim(),
          source_path: text(draft.source_path).trim(),
          ...(activeUnit() ? rangeParameters() : { message_uuid: text(draft.message_uuid).trim() }),
          request: text(draft.request).trim(),
          repo: text(draft.repo).trim(),
          beginning_kind: text(draft.beginning_kind),
          ending_kind: text(draft.ending_kind),
          baseline_commit: gitBeginning ? text(draft.baseline_commit).trim() : "",
          ending_commit: gitEnding ? text(draft.ending_commit).trim() : "",
          confirm_empty_beginning: draft.beginning_kind === "non_git",
          confirm_repository_selection: Boolean(text(draft.repo).trim()),
          model: text(draft.model).trim(),
          models: draft.models,
          claude_output_files: gitEnding ? stringList(selection.claude_output_files) : [],
          created_by_claude: gitEnding ? [] : stringList(selection.created_by_claude),
          excluded_files: stringList([
            ...(gitEnding ? [] : stringList(selection.excluded_files).filter((path) =>
              !carriedFiles.has(path) || state.attributionEdits.includes(path))),
            ...earlier.excluded_files.filter((path) => !currentOutputs.has(path)),
          ]),
          ...(activeUnit() ? { carried_forward_files: earlier.carried_forward_files } : {}),
          confirm_file_selection: selection.confirm_file_selection === true,
        };
      }

      function reviewProblems() {
        const draft = normalizeReviewDraft(state.reviewDraft);
        if (!draft) return ["Open a configuration draft."];
        const selection = selectionPayload();
        const problems = [];
        if (!draft.thread_id.trim()) problems.push("Choose the Claude task again.");
        if (!draft.source_path.trim()) {
          problems.push("The selected Claude task has no source transcript.");
        }
        if (!draft.message_uuid.trim()) {
          problems.push("Enter the message ID within the original thread.");
        }
        if (!draft.request.trim()) problems.push("Enter the reconstructed task prompt.");
        if (!draft.repo.trim()) problems.push("Enter the replay repository.");
        if (!draft.beginning_kind) problems.push("Choose the beginning state.");
        if (!draft.ending_kind) problems.push("Choose the end state.");
        if (draft.beginning_kind === "git" && draft.ending_kind === "non_git") {
          problems.push("A Git beginning state requires a Git end state.");
        }
        if (draft.beginning_kind === "git" && !draft.baseline_commit.trim()) {
          problems.push("Enter the starting commit.");
        }
        if (draft.ending_kind === "git" && !draft.ending_commit.trim()) {
          problems.push("Enter the ending commit.");
        }
        if (!draft.models.length) problems.push("Select at least one available Codex model.");
        if (
          draft.ending_kind === "non_git" &&
          !selectionNeedsRefresh() &&
          selection.confirm_file_selection !== true
        ) {
          problems.push("Classify every file in the Non-Git end state.");
        }
        return problems;
      }

      function invalidateReviewPreparation() {
        state.reviewRevision += 1;
        state.preparation = null;
        state.error = "";
        state.notice = "";
      }

      function invalidateConfigurationReview() {
        state.reviewRevision += 1;
        state.preparation = null;
        state.error = "";
        state.notice = "";
        saveDraft();
      }

      function preparationBlockers() {
        const preparation = isObject(state.preparation) ? state.preparation : {};
        return [
          ...asArray(preparation.blockers?.length
            ? preparation.blockers
            : preparation.blocking_reasons),
          ...asArray(preparation.questions),
        ]
          .map((item) => text(isObject(item) ? item.question : item))
          .filter((item, index, values) => item && values.indexOf(item) === index);
      }

      function preparationReady() {
        const preparation = isObject(state.preparation) ? state.preparation : {};
        return (
          preparation.ready === true ||
          preparation.can_run === true ||
          preparation.status === "ready_for_approval"
        ) && preparationBlockers().length === 0;
      }

      function approvedConfiguration() {
        const preparation = isObject(state.preparation) ? state.preparation : {};
        return (
          (isObject(preparation.run_config) && preparation.run_config) ||
          reviewPayload()
        );
      }

      function runRecord(payload) {
        if (!isObject(payload)) return null;
        return isObject(payload.run) ? payload.run : payload;
      }

      function ownedRunRecord(payload) {
        const run = runRecord(payload);
        if (run && text(run.controller_session_id) !== state.controllerSessionId) {
          throw new Error("The replay belongs to another controller instance.");
        }
        return run;
      }

      function currentRunId(payload) {
        const run = runRecord(payload);
        return text(payload?.run_id || run?.run_id || run?.id);
      }

      function activateRun(id) {
        const entry = state.runs.find((item) => item.id === id);
        if (!entry) return;
        state.runId = entry.id;
        state.run = entry.run;
        state.report = entry.report || null;
        state.reportPaths = entry.reportPaths || null;
      }

      function terminalRunStatus(value) {
        return ["completed", "complete", "succeeded", "failed", "cancelled", "canceled"]
          .includes(text(value).toLowerCase());
      }

      function successfulRunStatus(value) {
        return ["completed", "complete", "succeeded"]
          .includes(text(value).toLowerCase());
      }

      function stepIndex(id) {
        return Math.max(0, STEPS.findIndex((step) => step.id === id));
      }

      function canNavigateTo(id) {
        if (state.batchPreparing) return false;
        if (state.busy && !state.run) return false;
        if (id === state.step) return false;
        if (id === "thread") return !state.run && !state.batchId;
        if (id === "configure") return Boolean(state.selectedThreads.length) && Boolean(state.replayMode === "chunks"
          ? activeUnit() : state.inspection) && !configurationIsLocked() && !state.batchId;
        if (id === "run") return Boolean(state.run || state.batchId);
        if (id === "results") return Boolean(state.report) || state.runs.some((entry) => entry.report);
        return false;
      }

      function renderRail() {
        const current = stepIndex(state.step);
        return `
          <nav class="step-rail" aria-label="Replay progress">
            <p class="step-rail__label">Codex Bakeoff</p>
            <ol class="steps">
              ${STEPS.map((step, index) => {
                const isCurrent = step.id === state.step;
                const completed = (
                  index < current ||
                  (step.id === "run" && state.run && successfulRunStatus(state.run.status))
                );
                const clickable = canNavigateTo(step.id);
                const marker = completed ? "✓" : String(index + 1);
                const missingRequirements = (
                  step.id === "run" && state.step === "configure" && !state.run
                ) ? reviewProblems() : [];
                const tooltipId = `${step.id}-requirements-tooltip`;
                return `
                  <li class="step-item" ${missingRequirements.length
                    ? `tabindex="0" aria-describedby="${tooltipId}"`
                    : ""}>
                    <button
                      type="button"
                      class="step-button"
                      data-action="go-step"
                      data-step="${escapeHtml(step.id)}"
                      data-state="${completed ? "complete" : isCurrent ? "current" : "waiting"}"
                      data-clickable="${clickable}"
                      ${isCurrent ? 'aria-current="step"' : ""}
                      ${clickable ? "" : "disabled"}
                    >
                      <span class="step-number" aria-hidden="true">${marker}</span>
                      <span class="step-copy">
                        <span class="step-name">${escapeHtml(step.name)}</span>
                        <span class="step-state">${escapeHtml(
                          completed ? "Complete" : isCurrent ? "Current step" : step.short
                        )}</span>
                      </span>
                    </button>
                    ${missingRequirements.length
                      ? `<div id="${tooltipId}" class="step-tooltip" role="tooltip">
                          <strong>Complete required fields before starting</strong>
                          <ul>${missingRequirements.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
                        </div>`
                      : ""}
                  </li>
                `;
              }).join("")}
            </ol>
            ${renderDiagnostics()}
          </nav>
        `;
      }

      function renderDiagnostics() {
        const exactLogPath = text(state.run?.log_path);
        const runPath = exactLogPath || state.runRoot;
        if (!runPath) return "";
        return `
          <div class="diagnostics" aria-label="Local diagnostics">
            <div>
              <p>${exactLogPath ? "Current run log" : "Run log root"}</p>
              <code title="${escapeHtml(runPath)}">${escapeHtml(runPath)}</code>
            </div>
          </div>
        `;
      }

      function renderGlobalMessages() {
        const messages = [];
        if (state.error) {
          messages.push(`
            <div class="banner banner--error" role="alert">
              <span class="banner__mark" aria-hidden="true">!</span>
              <div class="banner__body">
                <strong>Something needs attention</strong>
                <p>${escapeHtml(state.error)}</p>
              </div>
            </div>
          `);
        }
        if (state.notice) {
          messages.push(`
            <div class="banner banner--success" role="status">
              <span class="banner__mark" aria-hidden="true">✓</span>
              <div class="banner__body"><p>${escapeHtml(state.notice)}</p></div>
            </div>
          `);
        }
        return messages.join("");
      }

      function pageHeading(eyebrow, heading, description) {
        return `
          <header class="page-heading">
            <p class="eyebrow">${escapeHtml(eyebrow)}</p>
            <h1 id="page-title" tabindex="-1">${escapeHtml(heading)}</h1>
            <p class="lede">${escapeHtml(description)}</p>
          </header>
        `;
      }

      function capabilityRows(capabilities) {
        const items = asArray(capabilities.items);
        if (!items.length) {
          const count = Number(capabilities.observed_count);
          return `
            <li class="capability">
              <span class="capability__dot" aria-hidden="true"></span>
              <span>${Number.isFinite(count) ? `${count} capabilities observed` : "No capability gaps recorded"}</span>
            </li>
          `;
        }
        return items.map((item) => {
          const record = isObject(item) ? item : { name: text(item) };
          const status = text(record.status || record.parity || "available").toLowerCase();
          const tone = /missing|not_available|unsupported|failed/.test(status)
            ? "bad"
            : /partial|warning|limited|manual/.test(status)
              ? "warning"
              : "";
          return `
            <li class="capability ${tone ? `capability--${tone}` : ""}">
              <span class="capability__dot" aria-hidden="true"></span>
              <span>
                ${escapeHtml(record.title || record.name || record.capability || record.tool || "Observed capability")}
                ${record.reason || record.status
                  ? `<small>${escapeHtml(record.reason || titleCase(record.status))}</small>`
                  : ""}
                ${record.guidance ? `<small>${escapeHtml(record.guidance)}</small>` : ""}
              </span>
            </li>
          `;
        }).join("");
      }

      function fileMetadata(file, kind) {
        const values = [];
        if (kind === "git") {
          if (file.staged) values.push("staged");
          if (file.unstaged) values.push("unstaged");
          if (file.untracked) values.push("untracked");
          if (!values.length && file.status) values.push(text(file.status).trim());
        } else if (file.kind) {
          values.push(titleCase(file.kind));
        }
        if (Number.isFinite(Number(file.size))) {
          values.push(`${new Intl.NumberFormat().format(Number(file.size))} bytes`);
        }
        if (file.reason) values.push(text(file.reason));
        return values.filter(Boolean);
      }

      function renderGitFiles(files, selection) {
        return `
          <div class="panel__body">
            ${files.length
              ? `<ul class="file-list">
                  ${files.map((file) => {
                    const path = text(file.path);
                    const selectable = file.selectable === true;
                    const selected = state.classifications[path] === "claude";
                    return `
                      <li class="file-row">
                        <span class="file-copy">
                          <span class="file-path" title="${escapeHtml(path)}">${escapeHtml(path)}</span>
                          <span class="file-meta">
                            ${fileMetadata(file, "git").map((item) => `<span>${escapeHtml(item)}</span>`).join("")}
                          </span>
                        </span>
                        <label class="choice" ${selectable ? "" : 'aria-disabled="true"'}>
                          <input
                            type="checkbox"
                            data-file-kind="git"
                            data-path="${escapeHtml(path)}"
                            ${selected ? "checked" : ""}
                            ${selectable && !state.busy && !configurationIsLocked() ? "" : "disabled"}
                          >
                          <span>Attribute to this run</span>
                        </label>
                      </li>
                    `;
                  }).join("")}
                </ul>`
              : `<p class="empty">The current Git working tree is clean. No attribution is required.</p>`
            }
          </div>
        `;
      }

      function renderNonGitFiles(files) {
        return `
          <div class="panel__body">
            ${files.length
              ? `<ul class="file-list">
                  ${files.map((file, index) => {
                    const path = text(file.path);
                    const selectable = file.selectable === true;
                    const selected = state.classifications[path] || "";
                    return `
                      <li class="file-row">
                        <span class="file-copy">
                          <span class="file-path" title="${escapeHtml(path)}">${escapeHtml(path)}</span>
                          <span class="file-meta">
                            ${fileMetadata(file, "non_git").map((item) => `<span>${escapeHtml(item)}</span>`).join("")}
                          </span>
                        </span>
                        <span class="segmented" role="radiogroup" aria-label="Classification for ${escapeHtml(path)}">
                          <label class="segment">
                            <input
                              type="radio"
                              name="file-${index}"
                              value="claude"
                              data-file-kind="non_git"
                              data-path="${escapeHtml(path)}"
                              ${selected === "claude" ? "checked" : ""}
                              ${selectable && !state.busy && !configurationIsLocked() ? "" : "disabled"}
                            >
                            <span>Created by Claude</span>
                          </label>
                          <label class="segment">
                            <input
                              type="radio"
                              name="file-${index}"
                              value="exclude"
                              data-file-kind="non_git"
                              data-path="${escapeHtml(path)}"
                              ${selected === "exclude" ? "checked" : ""}
                              ${state.busy || configurationIsLocked() ? "disabled" : ""}
                            >
                            <span>Exclude</span>
                          </label>
                        </span>
                      </li>
                    `;
                  }).join("")}
                </ul>`
              : `<p class="empty">No current files were found in this directory.</p>`
            }
          </div>
        `;
      }

      function capabilityGaps(capabilities) {
        return asArray(capabilities.items).filter((item) => {
          const status = text(item?.status || item?.parity).toLowerCase();
          return /missing|not_available|unsupported|failed/.test(status);
        });
      }

      function replayDetailsLoading() {
        return state.busy === "inspection" || state.configurationStep === 0 && (
          state.promptGeneration === "pending" || state.workingDirectoryLoading
        );
      }

      function configurationStepProblems(index) {
        const draft = normalizeReviewDraft(state.reviewDraft);
        if (!draft) return ["Open a configuration draft."];
        const problems = [];
        if (index === 0) {
          if (!draft.thread_id.trim()) problems.push("Choose the Claude task again.");
          if (!draft.source_path.trim()) problems.push("The selected Claude task has no source transcript.");
          if (!draft.message_uuid.trim()) problems.push("Enter the message ID within the original thread.");
          if (!draft.request.trim()) problems.push("Enter the reconstructed task prompt.");
          if (!draft.repo.trim()) problems.push("Enter the replay repository.");
          if (!draft.models.length) problems.push("Select at least one available Codex model.");
        }
        if (index === 1) {
          if (!draft.beginning_kind) problems.push("Choose the beginning state.");
          if (draft.beginning_kind === "git" && !draft.baseline_commit.trim()) {
            problems.push("Enter the starting commit.");
          }
        }
        if (index === 2) {
          if (!draft.ending_kind) problems.push("Choose the end state.");
          if (draft.beginning_kind === "git" && draft.ending_kind === "non_git") {
            problems.push("A Git beginning state requires a Git end state.");
          }
          if (draft.ending_kind === "git" && !draft.ending_commit.trim()) {
            problems.push("Enter the ending commit.");
          }
        }
        if (
          index === 3 &&
          draft.ending_kind === "non_git" &&
          !selectionNeedsRefresh() &&
          selectionPayload().confirm_file_selection !== true
        ) {
          problems.push("Classify every file in the Non-Git end state.");
        }
        return problems;
      }

      function renderReplayConfiguration(draft, replay, configurationLocked) {
        const requestMethod = state.promptGeneration || text(replay.request_generation?.method);
        const promptLoading = requestMethod === "pending";
        const workingDirectoryLoading = state.workingDirectoryLoading;
        const originalThreadId = text(
          replay.session_id || state.selectedThread?.session_id,
          "Unavailable"
        );
        return `<section class="panel" aria-labelledby="configuration-heading">
          <div class="panel__header"><div>
            <h2 id="configuration-heading">Replay details</h2>
            <p>Review the task and choose how Codex should run it.</p>
          </div></div>
          <div class="panel__body">
            <fieldset class="review-fields" ${state.busy || configurationLocked ? "disabled" : ""}>
              <div class="field-grid">
                <div class="field">
                  <label for="original-thread">Original Claude thread ID</label>
                  <input id="original-thread" type="text" value="${escapeHtml(originalThreadId)}" readonly>
                  <small>Selected on the previous step.</small>
                </div>
                ${activeUnit() ? `<div class="field field--wide">
                  <label>Chunk boundaries</label>
                  <p class="range-boundaries"><code>${escapeHtml(activeUnit().start_message_uuid)}</code> through <code>${escapeHtml(activeUnit().end_message_uuid)}</code></p>
                  <small>Set by the dividers between user turns.</small>
                </div>` : `<div class="field field--wide">
                  <label for="review-message-uuid">Message ID within the original thread</label>
                  <input id="review-message-uuid" type="text" value="${escapeHtml(draft.message_uuid)}">
                </div>`}
                <div class="field field--wide">
                  <label for="review-request">${activeUnit() ? "Handoff summary" : "Reconstructed task prompt"} ${promptLoading
                    ? '<span class="pill"><span class="spinner" aria-hidden="true"></span>Reconstructing task prompt…</span>'
                    : requestMethod === "llm_synthesis"
                      ? '<span class="pill">AI synthesized</span>'
                      : requestMethod === "single_user_prompt"
                        ? '<span class="pill">Original request</span>'
                        : requestMethod === "concatenated_fallback"
                          ? '<span class="pill pill--warning">Concatenated fallback</span>'
                          : ""}</label>
                  <textarea id="review-request" ${promptLoading ? 'placeholder="Reconstructing task prompt…" disabled' : ""}>${promptLoading ? "" : escapeHtml(draft.request)}</textarea>
                  <small>Review and edit the reconstructed task before approval.</small>
                </div>
                <div class="field field--wide">
                  <label for="review-repo">Replay working directory ${workingDirectoryLoading
                    ? '<span class="pill"><span class="spinner" aria-hidden="true"></span>Inferring working directory…</span>'
                    : ""}</label>
                  <input id="review-repo" type="text" value="${workingDirectoryLoading ? "" : escapeHtml(draft.repo)}" placeholder="${workingDirectoryLoading ? "Inferring working directory…" : "/absolute/path/to/project"}" ${workingDirectoryLoading ? "disabled" : ""}>
                </div>
              </div>
            </fieldset>
          </div>
        </section>`;
      }

      function renderBeginningConfiguration(draft, configurationLocked) {
        const gitBeginning = draft.beginning_kind === "git";
        return `<section class="panel" aria-labelledby="beginning-state-heading">
          <div class="panel__header"><div>
            <h2 id="beginning-state-heading">Beginning state</h2>
            <p>The isolated replay starts from this state.</p>
          </div></div>
          <div class="panel__body">
            <fieldset class="review-fields" ${state.busy || configurationLocked ? "disabled" : ""}>
              <div class="field-grid">
                <div class="field field--wide">
                  <label for="beginning-repo">Replay working directory</label>
                  <input id="beginning-repo" type="text" value="${escapeHtml(draft.repo)}" readonly>
                  <small>Configured in Replay details.</small>
                </div>
                <div class="field">
                  <label for="review-beginning-kind">State type</label>
                  <select id="review-beginning-kind">
                    <option value="git" ${gitBeginning ? "selected" : ""}>Git</option>
                    <option value="non_git" ${gitBeginning ? "" : "selected"}>Non-Git</option>
                  </select>
                </div>
                ${gitBeginning
                  ? `<div class="field"><label for="review-baseline-commit">Starting commit</label>
                      <input id="review-baseline-commit" type="text" value="${escapeHtml(draft.baseline_commit)}">
                      <small>Inferred starting state; editable.</small></div>`
                  : `<div class="field field--wide"><p>${activeUnit() ? "The beginning state is an empty Non-Git directory plus files carried forward from earlier chunks." : "The beginning state is a blank, Non-Git directory. No commit is required."}</p></div>`}
                ${activeUnit() && asArray(inspectionParts().selection.before_files).length
                  ? `<div class="field field--wide"><label>Files carried forward from earlier chunks</label><p>${asArray(inspectionParts().selection.before_files).map((file) => `<code>${escapeHtml(isObject(file) ? file.path : file)}</code>`).join(", ")}</p><small>Whole-file inputs; intermediate file versions are not reconstructed.</small></div>` : ""}
              </div>
            </fieldset>
          </div>
        </section>`;
      }

      function renderEndConfiguration(draft, configurationLocked) {
        const gitBeginning = draft.beginning_kind === "git";
        const gitEnding = draft.ending_kind === "git";
        return `<section class="panel" aria-labelledby="end-state-heading">
          <div class="panel__header"><div>
            <h2 id="end-state-heading">End state</h2>
            <p>The historical result is reconstructed from this state.</p>
          </div></div>
          <div class="panel__body">
            <fieldset class="review-fields" ${state.busy || configurationLocked ? "disabled" : ""}>
              <div class="field-grid">
                <div class="field field--wide">
                  <label for="ending-repo">Replay working directory</label>
                  <input id="ending-repo" type="text" value="${escapeHtml(draft.repo)}" readonly>
                  <small>Configured in Replay details.</small>
                </div>
                <div class="field">
                  <label for="review-ending-kind">State type</label>
                  <select id="review-ending-kind">
                    <option value="git" ${gitEnding ? "selected" : ""}>Git</option>
                    <option value="non_git" ${gitEnding ? "" : "selected"} ${gitBeginning ? "disabled" : ""}>Non-Git</option>
                  </select>
                  ${gitBeginning ? "<small>A Git beginning requires a Git end state.</small>" : ""}
                </div>
                ${gitEnding
                  ? `<div class="field"><label for="review-ending-commit">Ending commit</label>
                      <input id="review-ending-commit" type="text" value="${escapeHtml(draft.ending_commit)}">
                      <small>Inferred Claude completion state; editable.</small></div>`
                  : '<div class="field field--wide"><p>The run ends as a directory that is still outside Git.</p></div>'}
              </div>
            </fieldset>
          </div>
        </section>`;
      }

      function renderHistoricalOutput(draft, selection, files, kind) {
        const gitEnding = draft.ending_kind === "git";
        const stale = selectionNeedsRefresh();
        if (!files.length && gitEnding && !stale) return "";
        return `<section class="panel" aria-labelledby="files-heading">
            <div class="panel__header"><div>
              <h2 id="files-heading">Historical output</h2>
              <p>${gitEnding
                ? "Optionally include working-tree changes in addition to the ending commit."
                : "Identify the files created by the historical run."}</p>
            </div><span class="pill">${files.length} ${files.length === 1 ? "item" : "items"}</span></div>
            ${stale
              ? `<div class="panel__body"><p>Refresh files for the edited working directory and state.</p><button type="button" class="button" data-action="refresh-files" ${state.busy ? "disabled" : ""}>Refresh files</button></div>`
              : gitEnding && kind === "git"
                ? renderGitFiles(files, selection)
                : !gitEnding && kind === "non_git"
                  ? files.length ? renderNonGitFiles(files) : '<div class="panel__body"><p>No files were found in this directory.</p></div>'
                  : '<div class="panel__body"><p class="empty">No end-state files were found.</p></div>'}
          </section>`;
      }

      function renderTranscriptInference(selection, files, kind) {
        if (
          !files.length ||
          !["git", "non_git"].includes(kind) ||
          !("transcript_inferred_file_count" in selection)
        ) return "";
        const included = stringList(selection.transcript_inferred_files).filter(
          (path) => state.classifications[path] === "claude"
        ).length;
        return `<div class="banner" role="status"><div class="banner__body"><strong>Included ${included} ${included === 1 ? "file" : "files"} inferred from the Claude transcript.</strong></div></div>`;
      }

      function renderCapabilityConfiguration(capabilities) {
        const gaps = capabilityGaps(capabilities);
        return `${gaps.length
          ? `<div class="banner banner--warning" role="status">
              <span class="banner__mark" aria-hidden="true">!</span>
              <div class="banner__body">
                <strong>${gaps.length} capability ${gaps.length === 1 ? "gap" : "gaps"} may affect comparison fairness</strong>
                <p>You can continue, but review the guidance before approval.</p>
              </div>
            </div>`
          : ""}
          <section class="panel" aria-labelledby="capability-heading">
            <div class="panel__header"><div>
              <h2 id="capability-heading">Capability parity</h2>
              <p>Observed Claude capabilities and Codex equivalents for this replay.</p>
            </div></div>
            <div class="panel__body">
              <ul class="capability-list">${capabilityRows(capabilities)}</ul>
              ${asArray(capabilities.resolution_actions).length
                ? `<details><summary>Guidance</summary><ul class="plain-list">
                    ${asArray(capabilities.resolution_actions).map((item) => `<li>${escapeHtml(isObject(item) ? item.remediation_action || item.title : item)}</li>`).join("")}
                  </ul></details>`
                : ""}
            </div>
          </section>`;
      }

      function renderConfigurationConfirmation(draft, capabilities) {
        const configuration = reviewPayload();
        const selection = selectionPayload();
        const outputFiles = draft.ending_kind === "git"
          ? stringList(selection.claude_output_files)
          : stringList(selection.created_by_claude);
        const gaps = capabilityGaps(capabilities);
        return `${gaps.length
          ? `<div class="banner banner--warning" role="status">
              <span class="banner__mark" aria-hidden="true">!</span>
              <div class="banner__body">
                <strong>${gaps.length} capability ${gaps.length === 1 ? "gap" : "gaps"} will be recorded</strong>
                <p>The run can proceed, but the comparison may not have complete capability parity.</p>
              </div>
            </div>`
          : ""}
          <section class="panel" aria-labelledby="confirmation-heading">
            <div class="panel__header"><div>
              <h2 id="confirmation-heading">Review and confirm</h2>
              <p>Configuration is complete. Review it once more before starting the replay.</p>
            </div></div>
            <div class="panel__body">
              <dl class="configuration-review">
                <div class="configuration-review__row"><dt>Replay</dt><dd><strong>${escapeHtml(draft.models.join(", "))}</strong><br><small>${escapeHtml(draft.repo)}</small></dd></div>
                <div class="configuration-review__row"><dt>Beginning state</dt><dd>${draft.beginning_kind === "git" ? `Git at <code>${escapeHtml(draft.baseline_commit)}</code>` : activeUnit() ? "Empty Non-Git directory plus files from earlier chunks" : "Blank Non-Git directory"}</dd></div>
                <div class="configuration-review__row"><dt>End state</dt><dd>${draft.ending_kind === "git" ? `Git at <code>${escapeHtml(draft.ending_commit)}</code>` : "Non-Git directory"}</dd></div>
                <div class="configuration-review__row"><dt>Historical output</dt><dd>${outputFiles.length ? outputFiles.map((path) => `<code>${escapeHtml(path)}</code>`).join(", ") : "No additional files selected"}</dd></div>
                <div class="configuration-review__row"><dt>Capability parity</dt><dd>${gaps.length ? `${gaps.length} ${gaps.length === 1 ? "gap" : "gaps"}` : "All observed capabilities matched"}</dd></div>
              </dl>
              <details open>
                <summary>Entire configuration</summary>
                <pre>${escapeHtml(safeJson(configuration))}</pre>
              </details>
            </div>
          </section>`;
      }

      function renderConfigureStep() {
        const draft = normalizeReviewDraft(state.reviewDraft) || reviewDraftFromConfiguration();
        const { selection, capabilities, replay, files, kind } = inspectionParts();
        const diagnostics = inspectionDiagnostics();
        const blockers = preparationBlockers();
        const problems = reviewProblems();
        const configurationLocked = configurationIsLocked() || state.batchPreparing;
        const gaps = capabilityGaps(capabilities);
        const loading = replayDetailsLoading();
        const needsFileAttribution = !loading && (
          draft.ending_kind === "non_git" || (!problems.length && selectionNeedsRefresh()));
        const needsReplayDetails = !loading && (
          !draft.message_uuid.trim() || !draft.request.trim() ||
          !draft.repo.trim());
        const needsBeginningState = !loading && (!draft.beginning_kind ||
          (draft.beginning_kind === "git" && !draft.baseline_commit.trim()));
        const needsEndState = !loading && (!draft.ending_kind ||
          (draft.ending_kind === "git" && !draft.ending_commit.trim()) ||
          (draft.beginning_kind === "git" && draft.ending_kind === "non_git"));
        const nextDisabled = Boolean(state.busy) || state.batchPreparing || loading || problems.length > 0 ||
          (state.replayMode === "chunks" && (!remainingUnits().length || Boolean(state.submittingUnitKey)));
        const selectedThread = state.selectedThread || replay;
        return `
          ${pageHeading(
            threadStepEyebrow("Replay"),
            "Choose models and start",
            isThreadBatch() ? "Replay selected threads with shared models and a separate historical state for each thread."
              : "Replay the selected task from its automatically detected historical state."
          )}
          ${isThreadBatch() ? renderBatchConfiguration() : `<section class="panel" aria-labelledby="selected-thread-heading">
            <div class="panel__header"><div>
              <h2 id="selected-thread-heading">Selected thread</h2>
              <p>${escapeHtml(threadTitle(selectedThread))}</p>
            </div>${configurationLocked ? "" : `<button type="button" class="button button--quiet" data-action="configuration-back" ${state.busy ? "disabled" : ""}>Choose another thread</button>`}</div>
          </section>`}
          ${isThreadBatch() ? "" : renderRangeSelection()}
          <section class="panel" aria-labelledby="replay-models-heading" style="margin-top:14px">
            <div class="panel__header"><div>
              <h2 id="replay-models-heading">Choose models</h2>
              <p>Select one or more models for the entire replay. ${isThreadBatch() ? "Every thread" : "Every chunk"} uses this selection.</p>
            </div></div>
            <div class="panel__body"><fieldset class="review-fields" ${state.busy || configurationLocked ? "disabled" : ""}>
              <div class="variant-options" role="group" aria-label="Available Codex models">
                ${state.models.length ? state.models.map(({ id, label }) => {
                  const checked = draft.models.includes(id);
                  return `<label class="variant-choice"><input type="checkbox" data-model-variant="${escapeHtml(id)}" ${checked ? "checked" : ""} ${(checked ? draft.models.length === 1 : draft.models.length>=8) ? "disabled" : ""}>${escapeHtml(label)}</label>`;
                }).join("") : `<input id="review-model" type="text" value="${escapeHtml(draft.model)}">`}
              </div>
            </fieldset></div>
          </section>
          ${!loading && diagnostics.length
            ? `<div class="banner banner--warning" role="status"><span class="banner__mark" aria-hidden="true">i</span><div class="banner__body"><strong>Some values could not be discovered</strong><ul>${diagnostics.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul></div></div>`
            : ""}
          ${!loading && blockers.length
            ? `<div class="banner banner--warning" role="status"><span class="banner__mark" aria-hidden="true">!</span><div class="banner__body"><strong>The configuration still needs attention</strong><ul>${blockers.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul></div></div>`
            : ""}
          ${!loading ? renderTranscriptInference(selection, files, kind) : ""}
          ${needsReplayDetails ? renderReplayConfiguration(draft, replay, configurationLocked) : ""}
          ${needsBeginningState ? renderBeginningConfiguration(draft, configurationLocked) : ""}
          ${needsEndState ? renderEndConfiguration(draft, configurationLocked) : ""}
          ${needsFileAttribution ? renderHistoricalOutput(draft, selection, files, kind) : ""}
          ${!loading && gaps.length ? `<div class="banner banner--warning" role="status"><span class="banner__mark" aria-hidden="true">!</span><div class="banner__body"><strong>${gaps.length} capability ${gaps.length === 1 ? "gap" : "gaps"} may affect comparison fairness</strong><p>Review capability parity in configuration details before starting.</p></div></div>` : ""}
          <details id="configuration-details" class="panel" style="margin-top:14px" ${state.configurationDetailsOpen ? "open" : ""}>
            <summary class="panel__header">Configure details</summary>
            <div class="panel__body">
              ${needsReplayDetails ? "" : renderReplayConfiguration(draft, replay, configurationLocked)}
              ${needsBeginningState ? "" : renderBeginningConfiguration(draft, configurationLocked)}
              ${needsEndState ? "" : renderEndConfiguration(draft, configurationLocked)}
              ${needsFileAttribution ? "" : renderHistoricalOutput(draft, selection, files, kind)}
              ${renderCapabilityConfiguration(capabilities)}
              <div id="configuration-confirmation">
                ${problems.length || loading
                  ? ""
                  : renderConfigurationConfirmation(draft, capabilities)}
              </div>
            </div>
          </details>
          ${problems.length && !loading
            ? `<div class="banner banner--warning" role="status" style="margin-top:14px"><span class="banner__mark" aria-hidden="true">i</span><div class="banner__body"><strong>Required to continue</strong><ul>${problems.map((problem) => `<li>${escapeHtml(problem)}</li>`).join("")}</ul></div></div>`
            : ""}
          <div class="footer-actions footer-actions--configuration" style="margin-top:18px">
            <span class="footer-actions__note">${configurationLocked
              ? state.batchPreparing ? "Checking each thread before starting…" : chunkLaunchActive() ? "Checking chunks before starting their model runs…" : "This is the configuration used for the current replay."
              : `${draft.models.length} ${draft.models.length === 1 ? "model" : "models"} · isolated workspaces · original task preserved`}</span>
            ${state.batchPreparing
              ? `<button type="button" class="button button--primary" disabled>Preparing threads…</button>`
