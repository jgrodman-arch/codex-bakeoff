          if (!draft.model.trim()) problems.push("Enter a Codex model.");
          const timeout = Number(draft.timeout_seconds);
          if (!Number.isInteger(timeout) || timeout < 1 || timeout > 14400) {
            problems.push("Set a timeout from 1 through 14,400 seconds.");
          }
        }
        if (index === 1) {
          if (!draft.beginning_kind) problems.push("Choose the beginning state.");
          if (draft.beginning_kind === "git" && !draft.baseline_commit.trim()) {
            problems.push("Enter the starting commit.");
          }
        }
        if (index === 2) {
          if (!draft.ending_kind) problems.push("Choose the end state.");
          if (draft.beginning_kind === "git" && draft.ending_kind === "non_git") {
            problems.push("A Git beginning state requires a Git end state.");
          }
          if (draft.ending_kind === "git" && !draft.ending_commit.trim()) {
            problems.push("Enter the ending commit.");
          }
        }
        if (
          index === 3 &&
          draft.ending_kind === "non_git" &&
          !selectionNeedsRefresh() &&
          selectionPayload().confirm_file_selection !== true
        ) {
          problems.push("Classify every file in the Non-Git end state.");
        }
        return problems;
      }

      function renderConfigurationProgress() {
        return `<ol class="configuration-steps" aria-label="Configuration progress">
          ${CONFIGURATION_STEPS.map((step, index) => `
            <li>
              <button
                type="button"
                class="configuration-step"
                data-action="configuration-step"
                data-configuration-step="${index}"
                ${index === state.configurationStep ? 'aria-current="step"' : ""}
                ${index <= state.configurationMaxStep && !state.busy ? "" : "disabled"}
              >
                <small>${index + 1} of ${CONFIGURATION_STEPS.length}</small>
                ${escapeHtml(step.name)}
              </button>
            </li>`).join("")}
        </ol>`;
      }

      function renderReplayConfiguration(draft, replay, configurationLocked) {
        const requestMethod = state.promptGeneration || text(replay.request_generation?.method);
        const promptLoading = requestMethod === "pending";
        const workingDirectoryLoading = state.workingDirectoryLoading;
        const originalThreadId = text(
          replay.session_id || state.selectedThread?.session_id,
          "Unavailable"
        );
        return `<section class="panel" aria-labelledby="configuration-heading">
          <div class="panel__header"><div>
            <h2 id="configuration-heading">Replay details</h2>
            <p>Review the task and choose how Codex should run it.</p>
          </div></div>
          <div class="panel__body">
            <fieldset class="review-fields" ${state.busy || configurationLocked ? "disabled" : ""}>
              <div class="field-grid">
                <div class="field">
                  <label for="original-thread">Original Claude thread ID</label>
                  <input id="original-thread" type="text" value="${escapeHtml(originalThreadId)}" readonly>
                  <small>Selected on the previous step.</small>
                </div>
                <div class="field">
                  <label for="review-model">Codex model</label>
                  ${state.models.length
                    ? `<select id="review-model">${state.models.map((model) => `<option value="${escapeHtml(model.id)}" ${draft.model === model.id ? "selected" : ""}>${escapeHtml(model.label === model.id ? model.id : `${model.label} (${model.id})`)}</option>`).join("")}</select>
                      <small>All locally available Codex models in one list.</small>`
                    : `<input id="review-model" type="text" value="${escapeHtml(draft.model)}">
                      <small>Model discovery failed; enter an available Codex model.</small>`}
                </div>
                <div class="field field--wide">
                  <label for="review-message-uuid">Message ID within the original thread</label>
                  <input id="review-message-uuid" type="text" value="${escapeHtml(draft.message_uuid)}">
                </div>
                <div class="field field--wide">
                  <label for="review-request">Reconstructed task prompt ${promptLoading
                    ? '<span class="pill"><span class="spinner" aria-hidden="true"></span>Reconstructing task prompt…</span>'
                    : requestMethod === "llm_synthesis"
                      ? '<span class="pill">AI synthesized</span>'
                      : requestMethod === "single_user_prompt"
                        ? '<span class="pill">Original request</span>'
                        : requestMethod === "concatenated_fallback"
                          ? '<span class="pill pill--warning">Concatenated fallback</span>'
                          : ""}</label>
                  <textarea id="review-request" ${promptLoading ? 'placeholder="Reconstructing task prompt…" disabled' : ""}>${promptLoading ? "" : escapeHtml(draft.request)}</textarea>
                  <small>Review and edit the reconstructed task before approval.</small>
                </div>
                <div class="field field--wide">
                  <label for="review-repo">Replay working directory ${workingDirectoryLoading
                    ? '<span class="pill"><span class="spinner" aria-hidden="true"></span>Inferring working directory…</span>'
                    : ""}</label>
                  <input id="review-repo" type="text" value="${workingDirectoryLoading ? "" : escapeHtml(draft.repo)}" placeholder="${workingDirectoryLoading ? "Inferring working directory…" : "/absolute/path/to/project"}" ${workingDirectoryLoading ? "disabled" : ""}>
                </div>
                <div class="field">
                  <label for="review-timeout">Timeout in seconds</label>
                  <input id="review-timeout" type="number" min="1" max="14400" step="1" value="${escapeHtml(draft.timeout_seconds)}">
                  <small>Maximum 4 hours.</small>
                </div>
              </div>
            </fieldset>
          </div>
        </section>`;
      }

      function renderBeginningConfiguration(draft, configurationLocked) {
        const gitBeginning = draft.beginning_kind === "git";
        return `<section class="panel" aria-labelledby="beginning-state-heading">
          <div class="panel__header"><div>
            <h2 id="beginning-state-heading">Beginning state</h2>
            <p>The isolated replay starts from this state.</p>
          </div></div>
          <div class="panel__body">
            <fieldset class="review-fields" ${state.busy || configurationLocked ? "disabled" : ""}>
              <div class="field-grid">
                <div class="field field--wide">
                  <label for="beginning-repo">Replay working directory</label>
                  <input id="beginning-repo" type="text" value="${escapeHtml(draft.repo)}" readonly>
                  <small>Configured in Replay details.</small>
                </div>
                <div class="field">
                  <label for="review-beginning-kind">State type</label>
                  <select id="review-beginning-kind">
                    <option value="git" ${gitBeginning ? "selected" : ""}>Git</option>
                    <option value="non_git" ${gitBeginning ? "" : "selected"}>Non-Git</option>
                  </select>
                </div>
                ${gitBeginning
                  ? `<div class="field"><label for="review-baseline-commit">Starting commit</label>
                      <input id="review-baseline-commit" type="text" value="${escapeHtml(draft.baseline_commit)}">
                      <small>Inferred starting state; editable.</small></div>`
                  : '<div class="field field--wide"><p>The beginning state is a blank, Non-Git directory. No commit is required.</p></div>'}
              </div>
            </fieldset>
          </div>
        </section>`;
      }

      function renderEndConfiguration(draft, configurationLocked) {
        const gitBeginning = draft.beginning_kind === "git";
        const gitEnding = draft.ending_kind === "git";
        return `<section class="panel" aria-labelledby="end-state-heading">
          <div class="panel__header"><div>
            <h2 id="end-state-heading">End state</h2>
            <p>The historical result is reconstructed from this state.</p>
          </div></div>
          <div class="panel__body">
            <fieldset class="review-fields" ${state.busy || configurationLocked ? "disabled" : ""}>
              <div class="field-grid">
                <div class="field field--wide">
                  <label for="ending-repo">Replay working directory</label>
                  <input id="ending-repo" type="text" value="${escapeHtml(draft.repo)}" readonly>
                  <small>Configured in Replay details.</small>
                </div>
                <div class="field">
                  <label for="review-ending-kind">State type</label>
                  <select id="review-ending-kind">
                    <option value="git" ${gitEnding ? "selected" : ""}>Git</option>
                    <option value="non_git" ${gitEnding ? "" : "selected"} ${gitBeginning ? "disabled" : ""}>Non-Git</option>
                  </select>
                  ${gitBeginning ? "<small>A Git beginning requires a Git end state.</small>" : ""}
                </div>
                ${gitEnding
                  ? `<div class="field"><label for="review-ending-commit">Ending commit</label>
                      <input id="review-ending-commit" type="text" value="${escapeHtml(draft.ending_commit)}">
                      <small>Inferred Claude completion state; editable.</small></div>`
                  : '<div class="field field--wide"><p>The run ends as a directory that is still outside Git.</p></div>'}
              </div>
            </fieldset>
          </div>
        </section>`;
      }

      function renderHistoricalOutput(draft, selection, files, kind) {
        const gitEnding = draft.ending_kind === "git";
        const clean = files.length === 0;
        return `${!clean
          ? `<div class="banner banner--warning" role="status">
              <span class="banner__mark" aria-hidden="true">!</span>
              <div class="banner__body">
                <strong>We found ${files.length} ${gitEnding ? "uncommitted" : "current"} ${files.length === 1 ? "file" : "files"} in this repository.</strong>
                <p>${gitEnding
                  ? "Select any files produced by the historical Claude run. Unchecked files will be ignored."
                  : "Classify every file as historical Claude output or excluded local content."}</p>
              </div>
            </div>`
          : ""}
          <section class="panel" aria-labelledby="files-heading">
            <div class="panel__header"><div>
              <h2 id="files-heading">Historical output</h2>
              <p>${gitEnding
                ? "Optionally include working-tree changes in addition to the ending commit."
                : "Identify the files created by the historical run."}</p>
            </div><span class="pill">${files.length} ${files.length === 1 ? "item" : "items"}</span></div>
            ${selectionNeedsRefresh()
              ? '<div class="panel__body"><p class="empty">Return to End state and continue to refresh these files.</p></div>'
              : gitEnding && kind === "git"
                ? renderGitFiles(files, selection)
                : !gitEnding && kind === "non_git"
                  ? renderNonGitFiles(files)
                  : '<div class="panel__body"><p class="empty">No end-state files were found.</p></div>'}
          </section>`;
      }

      function renderCapabilityConfiguration(capabilities) {
        const gaps = capabilityGaps(capabilities);
        return `${gaps.length
          ? `<div class="banner banner--warning" role="status">
              <span class="banner__mark" aria-hidden="true">!</span>
              <div class="banner__body">
                <strong>${gaps.length} capability ${gaps.length === 1 ? "gap" : "gaps"} may affect comparison fairness</strong>
                <p>You can continue, but review the guidance before approval.</p>
              </div>
            </div>`
          : ""}
          <section class="panel" aria-labelledby="capability-heading">
            <div class="panel__header"><div>
              <h2 id="capability-heading">Capability parity</h2>
              <p>Observed Claude capabilities and Codex equivalents for this replay.</p>
            </div></div>
            <div class="panel__body">
              <ul class="capability-list">${capabilityRows(capabilities)}</ul>
              ${asArray(capabilities.resolution_actions).length
                ? `<details><summary>Guidance</summary><ul class="plain-list">
                    ${asArray(capabilities.resolution_actions).map((item) => `<li>${escapeHtml(isObject(item) ? item.remediation_action || item.title : item)}</li>`).join("")}
                  </ul></details>`
                : ""}
            </div>
          </section>`;
      }

      function renderConfigurationConfirmation(draft, capabilities) {
        const configuration = reviewPayload();
        const selection = selectionPayload();
        const outputFiles = draft.ending_kind === "git"
          ? stringList(selection.claude_output_files)
          : stringList(selection.created_by_claude);
        const gaps = capabilityGaps(capabilities);
        return `${gaps.length
          ? `<div class="banner banner--warning" role="status">
              <span class="banner__mark" aria-hidden="true">!</span>
              <div class="banner__body">
                <strong>${gaps.length} capability ${gaps.length === 1 ? "gap" : "gaps"} will be recorded</strong>
                <p>The run can proceed, but the comparison may not have complete capability parity.</p>
              </div>
            </div>`
          : ""}
          <section class="panel" aria-labelledby="confirmation-heading">
            <div class="panel__header"><div>
              <h2 id="confirmation-heading">Review and confirm</h2>
              <p>Configuration is complete. Review it once more before starting the replay.</p>
            </div></div>
            <div class="panel__body">
              <dl class="configuration-review">
                <div class="configuration-review__row"><dt>Replay</dt><dd><strong>${escapeHtml(draft.model)}</strong><br><small>${escapeHtml(draft.repo)} · ${escapeHtml(draft.timeout_seconds)} second timeout</small></dd></div>
                <div class="configuration-review__row"><dt>Beginning state</dt><dd>${draft.beginning_kind === "git" ? `Git at <code>${escapeHtml(draft.baseline_commit)}</code>` : "Blank Non-Git directory"}</dd></div>
                <div class="configuration-review__row"><dt>End state</dt><dd>${draft.ending_kind === "git" ? `Git at <code>${escapeHtml(draft.ending_commit)}</code>` : "Non-Git directory"}</dd></div>
                <div class="configuration-review__row"><dt>Historical output</dt><dd>${outputFiles.length ? outputFiles.map((path) => `<code>${escapeHtml(path)}</code>`).join(", ") : "No additional files selected"}</dd></div>
                <div class="configuration-review__row"><dt>Capability parity</dt><dd>${gaps.length ? `${gaps.length} ${gaps.length === 1 ? "gap" : "gaps"}` : "All observed capabilities matched"}</dd></div>
              </dl>
              <details open>
                <summary>Entire configuration</summary>
                <pre>${escapeHtml(safeJson(configuration))}</pre>
              </details>
            </div>
          </section>`;
      }

      function renderConfigureStep() {
        const draft = normalizeReviewDraft(state.reviewDraft) || reviewDraftFromConfiguration();
        const { selection, capabilities, replay, files, kind } = inspectionParts();
        const diagnostics = inspectionDiagnostics();
        const blockers = preparationBlockers();
        const problems = configurationStepProblems(state.configurationStep);
        const configurationLocked = Boolean(state.run);
        const screens = [
          () => renderReplayConfiguration(draft, replay, configurationLocked),
          () => renderBeginningConfiguration(draft, configurationLocked),
          () => renderEndConfiguration(draft, configurationLocked),
          () => renderHistoricalOutput(draft, selection, files, kind),
          () => renderCapabilityConfiguration(capabilities),
          () => renderConfigurationConfirmation(draft, capabilities),
        ];
        const gaps = capabilityGaps(capabilities);
        const finalStep = state.configurationStep === CONFIGURATION_STEPS.length - 1;
        return `
          ${pageHeading(
            threadStepEyebrow("Configuration"),
            "Prepare the historical replay",
            "Complete each step, then review the exact configuration before starting."
          )}
          <div class="footer-actions footer-actions--configuration">
            <span class="footer-actions__note">${configurationLocked
              ? "This is the configuration used for the current bakeoff."
              : finalStep
                ? "Approval locks this configuration and starts one isolated replay."
                : `${state.configurationStep + 1} of ${CONFIGURATION_STEPS.length}`}</span>
            ${configurationLocked
              ? `<button type="button" class="button button--primary" data-action="go-step" data-step="${state.report ? "results" : "run"}">Return to ${state.report ? "results" : "run"}</button>`
              : `<button type="button" class="button button--quiet" data-action="configuration-back" ${state.busy ? "disabled" : ""}>Back</button>
                <button type="button" class="button button--primary" data-action="${finalStep ? "approve-configuration" : "configuration-next"}" ${state.busy ? "disabled" : ""}>
                  ${state.busy === "attribution"
                    ? '<span class="spinner" aria-hidden="true"></span>Checking repository…'
                    : state.busy === "prepare"
                      ? '<span class="spinner" aria-hidden="true"></span>Checking configuration…'
                      : state.busy === "start"
                        ? '<span class="spinner" aria-hidden="true"></span>Starting…'
                        : finalStep
                          ? gaps.length ? "Approve with gaps and start" : "Approve and start"
                          : "Next"}
                </button>`}
          </div>
          ${renderConfigurationProgress()}
          ${diagnostics.length && state.configurationStep === 0
            ? `<div class="banner banner--warning" role="status"><span class="banner__mark" aria-hidden="true">i</span><div class="banner__body"><strong>Some values could not be discovered</strong><ul>${diagnostics.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul></div></div>`
            : ""}
          ${blockers.length && finalStep
            ? `<div class="banner banner--warning" role="status"><span class="banner__mark" aria-hidden="true">!</span><div class="banner__body"><strong>The configuration still needs attention</strong><ul>${blockers.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul></div></div>`
            : ""}
          ${screens[state.configurationStep]()}
          ${problems.length
            ? `<div class="banner banner--warning" role="status" style="margin-top:14px"><span class="banner__mark" aria-hidden="true">i</span><div class="banner__body"><strong>Required to continue</strong><ul>${problems.map((problem) => `<li>${escapeHtml(problem)}</li>`).join("")}</ul></div></div>`
            : ""}
          `;
      }

      function normalizedPhases(run) {
        const provided = asArray(run?.phases);
        if (provided.length) {
          return provided.flatMap((item) => {
            if (!isObject(item)) return [];
            const id = text(item.id || item.phase);
            if (!id) return [];
            return [{
              id,
              label: text(item.label, DEFAULT_PHASES.find(([value]) => value === id)?.[1] || titleCase(id)),
              status: text(item.status, "waiting").toLowerCase(),
            }];
          });
        }
        const current = text(run?.phase);
        const index = DEFAULT_PHASES.findIndex(([id]) => id === current);
        const failed = ["failed", "cancelled", "canceled"].includes(text(run?.status).toLowerCase());
        return DEFAULT_PHASES.map(([id, label], itemIndex) => ({
          id,
          label,
          status:
            itemIndex < index ? "complete"
              : itemIndex === index ? (failed ? "failed" : "running")
                : "waiting",
        }));
      }

      function renderRunStep() {
        const run = isObject(state.run) ? state.run : {};
        const status = text(run.status, "running").toLowerCase();
        const failed = ["failed", "cancelled", "canceled"].includes(status);
        const completed = successfulRunStatus(status);
        const phases = normalizedPhases(run);
        const events = asArray(run.events).filter(isObject).slice(-12).reverse();
        const runLog = text(run.run_log);
        return `
          ${pageHeading(
            threadStepEyebrow("Run in progress"),
            completed ? "The comparison report is ready" : failed ? "The bakeoff stopped" : "Running the isolated replay",
            completed
              ? "Implementation, verification, and review completed."
              : failed
                ? "The run did not continue after this failure."
                : "You can leave and reopen this page; progress is stored in the local run directory."
          )}
          ${failed
            ? `<div class="banner banner--error" role="alert">
                <span class="banner__mark" aria-hidden="true">!</span>
                <div class="banner__body">
                  <strong>${escapeHtml(titleCase(status))}</strong>
                  <p>${escapeHtml(run.error || "The bakeoff could not continue.")}</p>
                </div>
              </div>`
            : ""}
          <div class="grid-2">
            <section class="panel" aria-labelledby="progress-heading">
              <div class="panel__header">
                <div>
                  <h2 id="progress-heading">Run phases</h2>
                  <p>Run <code>${escapeHtml(state.runId || run.id || run.run_id)}</code></p>
                </div>
                <span class="pill ${completed ? "pill--good" : failed ? "pill--bad" : ""}">
                  ${escapeHtml(titleCase(status))}
                </span>
              </div>
              <div class="panel__body">
                <ol class="phase-list">
                  ${phases.map((phase) => {
                    const statusClass = ["complete", "completed", "succeeded"].includes(phase.status)
                      ? "complete"
                      : ["failed", "cancelled", "canceled"].includes(phase.status)
                        ? "failed"
                        : phase.status === "running"
                          ? "running"
                          : "waiting";
                    return `
                      <li class="phase phase--${statusClass}">
                        <span class="phase__mark" aria-hidden="true">${statusClass === "complete" ? "✓" : statusClass === "failed" ? "!" : ""}</span>
                        <span class="phase__name">${escapeHtml(phase.label)}</span>
                        <span class="phase__state">${escapeHtml(titleCase(statusClass))}</span>
                      </li>
                    `;
                  }).join("")}
                </ol>
              </div>
            </section>
            <section class="panel" aria-labelledby="activity-heading">
              <div class="panel__header">
                <div>
                  <h2 id="activity-heading">Activity</h2>
                  <p>${run.started_at ? `Started ${escapeHtml(formatDate(run.started_at))}` : "Waiting for the first event"}</p>
                </div>
              </div>
              <div class="panel__body">
                ${events.length
                  ? `<ol class="activity">
                      ${events.map((event) => `
                        <li>
                          <time datetime="${escapeHtml(event.at || event.timestamp || "")}">${escapeHtml(formatTime(event.at || event.timestamp))}</time>
                          <span>${escapeHtml(event.summary || event.message || titleCase(event.phase || event.status))}</span>
                        </li>
                      `).join("")}
                    </ol>`
                  : `<p class="empty">No activity has been recorded yet.</p>`
                }
              </div>
            </section>
          </div>
          <section class="panel" aria-labelledby="run-log-heading" style="margin-top:14px">
            <div class="panel__header">
              <div>
                <h2 id="run-log-heading">Current run log</h2>
                <p>${run.log_path
                  ? `Streaming <code>${escapeHtml(run.log_path)}</code>`
                  : "Streaming recorded controller and worker output"}</p>
              </div>
              <span class="pill ${completed ? "pill--good" : failed ? "pill--bad" : ""}">
                ${terminalRunStatus(status) ? "Retained" : "Live"}
              </span>
            </div>
            <div class="panel__body">
              <pre id="run-log" class="run-log" tabindex="0" aria-live="polite">${escapeHtml(runLog || "Waiting for run output…")}</pre>
            </div>
          </section>
          <div class="footer-actions">
            <span class="footer-actions__note">
              ${completed ? "Loading the report…" : failed ? "Inspect the recorded error before starting a new bakeoff." : "Status refreshes automatically."}
            </span>
            ${failed
              ? `<button type="button" class="button" data-action="refresh-run" ${state.busy ? "disabled" : ""}>Refresh status</button>
                 <button type="button" class="button button--primary" data-action="reset-controller" ${state.busy ? "disabled" : ""}>Start another bakeoff</button>`
              : completed
                ? `<button type="button" class="button button--primary" data-action="load-report" ${state.busy ? "disabled" : ""}>
                    ${state.busy === "report" ? '<span class="spinner" aria-hidden="true"></span>Loading…' : "Open results"}
                  </button>`
                : `<button type="button" class="button" data-action="refresh-run" ${state.busy ? "disabled" : ""}>Refresh now</button>`
                  + `<button type="button" class="button button--danger" data-action="cancel-run" ${state.busy ? "disabled" : ""}>${state.busy === "cancel" ? '<span class="spinner" aria-hidden="true"></span>Cancelling…' : "Cancel run"}</button>`
            }
          </div>
        `;
      }

      function reportParts() {
        const report = isObject(state.report) ? state.report : {};
        const candidates = isObject(report.candidates) ? report.candidates : {};
        const claude = isObject(candidates.claude) ? candidates.claude : {};
        const codex = isObject(candidates.codex) ? candidates.codex : {};
        const baseline = isObject(report.baseline) ? report.baseline : {};
        const execution = isObject(report.codex_execution) ? report.codex_execution : {};
        const verification = isObject(report.verification) ? report.verification : {};
        const evaluation = isObject(report.evaluation) ? report.evaluation : {};
        const costs = isObject(report.estimated_cost) ? report.estimated_cost : {};
        const usage = isObject(report.normalized_usage) ? report.normalized_usage : {};
        return {
          report, baseline, candidates, claude, codex, execution, verification, evaluation, costs, usage,
        };
      }

      function outcomeSummary(evaluation) {
        const totals = isObject(evaluation.totals) ? evaluation.totals : {};
        const mapping = isObject(evaluation.candidate_mapping)
          ? evaluation.candidate_mapping
          : { A: "claude", B: "codex" };
        const a = Number(totals.A);
        const b = Number(totals.B);
        if (!Number.isFinite(a) || !Number.isFinite(b)) {
          return { headline: "Comparison complete", score: "No validated score", detail: "Review results are recorded below." };
        }
        const name = (label) =>
          mapping[label] === "codex" ? "Codex replay"
            : mapping[label] === "claude" ? "Historical Claude"
              : `Candidate ${label}`;
        if (a === b) {
          return { headline: "The comparison is a tie", score: `${a}–${b}`, detail: "Each category win awards one point." };
        }
        const winner = a > b ? "A" : "B";
        return {
          headline: `${name(winner)} leads`,
          score: `${Math.max(a, b)}–${Math.min(a, b)}`,
          detail: "Each category win awards one point; ties and N/A award zero.",
        };
      }

      function comparisonClass(value, otherValue) {
        if (value === null || value === undefined || otherValue === null || otherValue === undefined) {
          return "";
        }
        const own = Number(value);
        const other = Number(otherValue);
        if (
          !Number.isFinite(own) ||
          !Number.isFinite(other) ||
          own < 0 ||
          other < 0 ||
          own === other
        ) return "";
        return own < other ? " metric--better" : " metric--worse";
      }

      function usageMetricRows(usage) {
        const metrics = [
          [
            "Total input processed",
            "total_input_tokens",
            "All input tokens processed: ordinary input, cache reads, and cache writes.",
          ],
          [
            "Ordinary input tokens",
            "ordinary_input_tokens",
            "Input tokens processed without being read from or written to a provider cache.",
          ],
          [
            "Cache-read tokens",
            "cached_input_tokens",
            "Previously cached input tokens reused by the model.",
          ],
          [
            "Cache-write tokens",
            "cache_write_tokens",
            "Input tokens written to the provider cache for possible reuse.",
          ],
          [
            "Output tokens",
            "output_tokens",
            "Tokens generated by the model in its responses.",
          ],
        ];
        return metrics.map(([label, key, description]) => `
          <div class="metric">
            <dt class="token-label" tabindex="0">
              ${escapeHtml(label)}
              <span class="token-tooltip" role="tooltip">${escapeHtml(description)}</span>
            </dt>
            <dd>${escapeHtml(formatTokens(usage?.[key]))}</dd>
          </div>
        `).join("");
      }

      function providerCard(
        name,
        candidate,
        execution,
        cost,
        usage,
        isCodex,
        otherElapsed,
        otherCost,
      ) {
        const model = text(candidate.model || (isCodex ? execution.model : ""), "Unavailable");
        const elapsed = isCodex
          ? execution.elapsed_seconds
          : state.report?.historical_model_request_seconds;
        return `
          <article class="provider">
            <h2>${escapeHtml(name)}</h2>
            <dl class="metrics">
              <div class="metric"><dt>Model</dt><dd><code>${escapeHtml(model)}</code></dd></div>
              <div class="metric${comparisonClass(elapsed, otherElapsed)}"><dt>Execution time</dt><dd>${escapeHtml(formatDuration(elapsed))}</dd></div>
              <div class="metric${comparisonClass(cost?.usd, otherCost?.usd)}"><dt>Estimated cost</dt><dd>${escapeHtml(formatCost(cost?.usd))}</dd></div>
              ${usageMetricRows(usage)}
            </dl>
          </article>
        `;
      }

      function checksById(container) {
        if (!isObject(container)) return new Map();
        const values = asArray(container.checks?.length ? container.checks : container.results);
        return new Map(values.flatMap((item, index) => {
          if (!isObject(item)) return [];
          const id = text(item.id || item.name || item.command, `check-${index + 1}`);
          return [[id, item]];
        }));
      }

      function checkStatus(check, baselineFailed = false) {
        if (!isObject(check)) return "Unavailable";
        const raw = text(check.status, check.returncode === 0 ? "passed" : "failed");
        if (baselineFailed && ["failed", "timed_out"].includes(raw)) {
          return `${titleCase(raw)} · baseline also failed`;
        }
        return titleCase(raw);
      }

      function verificationTable(verification) {
        const baseline = isObject(verification.baseline) ? verification.baseline : {};
        const candidates = isObject(verification.candidates) ? verification.candidates : {};
        const claude = isObject(candidates.claude) ? candidates.claude : {};
        const codex = isObject(candidates.codex) ? candidates.codex : {};
        const maps = [checksById(baseline), checksById(claude), checksById(codex)];
        const ids = [...new Set(maps.flatMap((map) => [...map.keys()]))];
        if (!ids.length) return `<p class="empty">No shared verification checks were available.</p>`;
        return `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Shared check</th><th>Baseline</th><th>Historical Claude</th><th>Codex replay</th></tr></thead>
              <tbody>
                ${ids.map((id) => {
                  const base = maps[0].get(id);
                  const baselineFailed = ["failed", "timed_out"].includes(text(base?.status));
                  const command = text(base?.command || maps[1].get(id)?.command || maps[2].get(id)?.command || id);
                  return `
                    <tr>
                      <th><code>${escapeHtml(command)}</code></th>
                      <td>${escapeHtml(checkStatus(base))}</td>
                      <td>${escapeHtml(checkStatus(maps[1].get(id), baselineFailed))}</td>
                      <td>${escapeHtml(checkStatus(maps[2].get(id), baselineFailed))}</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function evaluationTable(evaluation) {
        const mapping = isObject(evaluation.candidate_mapping)
          ? evaluation.candidate_mapping
          : { A: "claude", B: "codex" };
        const agentName = (label) =>
          mapping[label] === "codex" ? "Codex"
            : mapping[label] === "claude" ? "Claude"
              : `Candidate ${label}`;
        const expandCandidateLabels = (value) =>
          text(value, "No explanation recorded.")
            .replace(/\bCandidate ([AB])\b/g, (_match, label) => agentName(label))
            .replace(/\b([AB])(?=(?:['’]s)?\b)/g, (_match, label) => agentName(label));
        const name = (outcome) =>
          mapping[outcome] === "codex" ? "Codex replay"
            : mapping[outcome] === "claude" ? "Historical Claude"
              : outcome === "tie" ? "Tie"
                : outcome === "not_applicable" ? "N/A"
                  : titleCase(outcome);
        const rows = [];
        for (const review of asArray(evaluation.reviews)) {
          if (!isObject(review)) continue;
          const categories = isObject(review.ballot?.categories) ? review.ballot.categories : {};
          if (!Object.keys(categories).length && review.status === "failed") {
            rows.push({
              evaluator: text(review.evaluator, "Unknown"),
              model: text(review.model, "Unknown"),
              category: "Review",
              outcome: "Failed",
              explanation: text(review.error, "The reviewer failed."),
            });
          }
          for (const [category, raw] of Object.entries(categories)) {
            const decision = isObject(raw) ? raw : {};
            rows.push({
              evaluator: text(review.evaluator, "Unknown"),
              model: text(review.model, "Unknown"),
              category: titleCase(category),
              outcome: name(text(decision.outcome, "not_applicable")),
              explanation: expandCandidateLabels(decision.explanation),
            });
          }
        }
        for (const availability of asArray(evaluation.evaluator_availability)) {
          if (!isObject(availability) || availability.available === true) continue;
          rows.push({
            evaluator: text(availability.id, "Unknown"),
            model: text(availability.model, "Unknown"),
            category: "Availability",
            outcome: "Skipped",
            explanation: text(availability.reason, "The evaluator was unavailable."),
          });
        }
        if (!rows.length) return `<p class="empty">No validated blind review ballot is available.</p>`;
        return `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Evaluator</th><th>Category</th><th>Outcome</th><th>Explanation</th></tr></thead>
              <tbody>
                ${rows.map((row) => `
                  <tr>
                    <td>${escapeHtml(row.evaluator)}<br><code>${escapeHtml(row.model)}</code></td>
                    <td>${escapeHtml(row.category)}</td>
                    <td><strong>${escapeHtml(row.outcome)}</strong></td>
                    <td>${escapeHtml(row.explanation)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderResultsStep() {
        const {
          report, baseline, claude, codex, execution, verification, evaluation, costs, usage,
        } = reportParts();
        const outcome = outcomeSummary(evaluation);
        const limitations = asArray(report.limitations).map((item) => text(item)).filter(Boolean);
        const claudeElapsed = report.historical_model_request_seconds;
        const codexElapsed = execution.elapsed_seconds;
        return `
          <section class="result-hero" aria-labelledby="page-title">
            <div>
              <p class="eyebrow">${escapeHtml(threadStepEyebrow("Comparison complete"))}</p>
              <h1 id="page-title" tabindex="-1">${escapeHtml(outcome.headline)}</h1>
              <p>${escapeHtml(outcome.detail)}</p>
            </div>
            <div class="score">${escapeHtml(outcome.score)}</div>
          </section>

          <div class="provider-grid">
            ${providerCard(
              "Historical Claude",
              claude,
              execution,
              costs.claude,
              usage.claude,
              false,
              codexElapsed,
              costs.codex,
            )}
            ${providerCard(
              "Codex replay",
              codex,
              execution,
              costs.codex,
              usage.codex,
              true,
              claudeElapsed,
              costs.claude,
            )}
          </div>

          <section class="panel" aria-labelledby="verification-heading">
            <div class="panel__header">
              <div>
                <h2 id="verification-heading">Objective verification</h2>
                <p>The same baseline-owned checks ran against the historical baseline, Claude result, and Codex replay.</p>
              </div>
              <span class="pill">${escapeHtml(titleCase(verification.status || "not verifiable"))}</span>
            </div>
            <div class="panel__body panel__body--flush">
              ${verificationTable(verification)}
            </div>
          </section>

          <section class="panel" aria-labelledby="evaluation-heading">
            <div class="panel__header">
              <div>
                <h2 id="evaluation-heading">Blind head-to-head review</h2>
                <p>Candidate identities were revealed only after each ballot was recorded.</p>
              </div>
            </div>
            <div class="panel__body panel__body--flush">
              ${evaluationTable(evaluation)}
            </div>
          </section>

          <section class="panel" aria-labelledby="evidence-heading">
            <div class="panel__header">
              <div>
                <h2 id="evidence-heading">Evidence and artifacts</h2>
                <p>Detailed prompts, patches, responses, and limitations remain available for inspection.</p>
              </div>
            </div>
            <div class="panel__body">
              <dl class="metrics">
                <div class="metric"><dt>Claude worktree</dt><dd><code>${escapeHtml(baseline.repository || "Unavailable")}</code></dd></div>
                <div class="metric"><dt>Codex worktree</dt><dd><code>${escapeHtml(execution.worktree || "Unavailable")}</code></dd></div>
              </dl>
              <details><summary>Reconstructed task prompt</summary><pre>${escapeHtml(report.original_request || "")}</pre></details>
              <details><summary>Claude patch</summary><pre>${escapeHtml(claude.diff || "No attributable Claude patch was recovered.")}</pre></details>
              <details><summary>Codex patch</summary><pre>${escapeHtml(codex.diff || "No Codex patch was recorded.")}</pre></details>
              <details><summary>Claude final response</summary><pre>${escapeHtml(report.historical_final_response || claude.final_response || "Unavailable.")}</pre></details>
              <details><summary>Codex final response</summary><pre>${escapeHtml(codex.final_response || execution.final_output || "Unavailable.")}</pre></details>
              <details>
                <summary>Confidence and limitations (${limitations.length})</summary>
                ${limitations.length
                  ? `<ul>${limitations.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`
                  : `<p class="empty">No limitations were recorded.</p>`}
              </details>
              <details><summary>Raw report JSON</summary><pre>${escapeHtml(safeJson(report))}</pre></details>
            </div>
          </section>

          <div class="footer-actions">
            <span class="footer-actions__note">
              ${state.reportPaths?.report_json
                ? `Saved to ${escapeHtml(state.reportPaths.report_json)}`
                : "The durable report remains in the local run directory."}
            </span>
            ${state.reportPaths?.report_json
              ? `<button type="button" class="button" data-action="copy-report-path">Copy report path</button>`
              : ""}
            ${state.reportPaths?.report_json
              ? `<button type="button" class="button" data-action="download-report" data-format="json">Download JSON</button>`
              : ""}
            ${state.reportPaths?.report_html
              ? `<button type="button" class="button" data-action="download-report" data-format="html">Download HTML report</button>`
              : ""}
            <button type="button" class="button button--primary" data-action="reset-controller" ${state.busy ? "disabled" : ""}>Start another bakeoff</button>
          </div>
        `;
      }

      function renderContent() {
        if (!state.hostReady && state.error) {
          return `
            ${pageHeading(
              "Connection",
              "The controller could not connect",
              "This page must be opened from the installed Codex Bakeoff plugin."
            )}
            ${renderGlobalMessages()}
            <button type="button" class="button button--primary" data-action="retry-init">Try again</button>
          `;
        }
        const body =
          state.step === "configure" ? renderConfigureStep()
            : state.step === "run" ? renderRunStep()
                : state.step === "results" ? renderResultsStep()
                  : renderThreadStep();
        return `${renderGlobalMessages()}${body}`;
      }

      function render({ focus = false } = {}) {
        const previousLog = document.getElementById("run-log");
        const logScrollTop = previousLog?.scrollTop || 0;
        const logPinned = !previousLog || (
          previousLog.scrollHeight - previousLog.clientHeight - previousLog.scrollTop < 32
        );
        const prompt = document.getElementById("review-request");
        const promptFocused = prompt && document.activeElement === prompt;
        const promptSelection = promptFocused
          ? [prompt.selectionStart, prompt.selectionEnd]
          : null;
        saveDraft();
        app.innerHTML = `
          ${state.pluginVersion
            ? `<div class="plugin-version">v${escapeHtml(state.pluginVersion)}</div>`
            : ""}
          <div class="layout">
            ${renderRail()}
            <main class="workspace" aria-labelledby="page-title">
              <div class="sr-only" aria-live="polite">
                ${escapeHtml(state.busy ? `${titleCase(state.busy)} in progress` : state.notice || "")}
              </div>
              ${renderContent()}
            </main>
          </div>
        `;
        const nextLog = document.getElementById("run-log");
        if (nextLog) {
          nextLog.scrollTop = logPinned ? nextLog.scrollHeight : logScrollTop;
        }
        if (promptSelection) {
          requestAnimationFrame(() => {
            const nextPrompt = document.getElementById("review-request");
            if (!nextPrompt) return;
            nextPrompt.focus();
            nextPrompt.setSelectionRange(...promptSelection);
          });
        } else if (focus) {
          requestAnimationFrame(() => document.getElementById("page-title")?.focus());
        }
      }

      async function loadThreads(query = "") {
        state.loading = true;
        state.error = "";
        render();
        try {
          const payload = await callTool("list_threads", {
            offset: 0,
            limit: 100,
            ...(query.trim() ? { query: query.trim() } : {}),
          });
          state.threads = asArray(payload.threads?.length ? payload.threads : payload.sessions);
          state.totalThreads = Number(payload.total) || state.threads.length;
          state.hostReady = true;
        } catch (error) {
          state.error = error instanceof Error ? error.message : String(error);
        } finally {
          state.loading = false;
          render();
        }
      }

      async function initialize() {
        let synthesis = null;
        draftPersistenceReady = false;
        restoredDraft = loadDraft();
        state.loading = true;
        state.hostReady = false;
        state.error = "";
        state.notice = "";
        render();
        try {
          const [statePayload, threadPayload] = await Promise.all([
            callTool("get_state", {}),
            callTool("list_threads", { offset: 0, limit: 100 }),
          ]);
          const serverState = isObject(statePayload.state) ? statePayload.state : statePayload;
          state.runRoot = text(serverState.run_root);
          state.controllerLogPath = text(serverState.controller_log_path);
          state.pluginVersion = text(serverState.plugin_version);
          state.models = normalizeModels(serverState.models);
          state.model = state.models.some((model) => model.id === restoredDraft?.model)
            ? restoredDraft.model
            : selectedModelDefault();
          state.threads = asArray(
            threadPayload.threads?.length ? threadPayload.threads : threadPayload.sessions
          );
          state.totalThreads = Number(threadPayload.total) || state.threads.length;
          state.hostReady = true;

          const recent = asArray(serverState.recent_runs);
          const active = recent.find((run) =>
            isObject(run) && !terminalRunStatus(run.status)
          );
          if (active) {
            clearDraft();
            restoredDraft = null;
            state.run = active;
            state.runId = text(active.run_id || active.id);
            state.step = "run";
            beginPolling();
          } else if (restoredDraft?.selectedThreadId) {
            const selected = state.threads.find(
              (thread) => threadId(thread) === restoredDraft.selectedThreadId
            );
            state.selectedThreadId = restoredDraft.selectedThreadId;
            state.selectedThreadNumber = restoredDraft.selectedThreadNumber;
            state.selectedThread = selected || null;
            try {
              const payload = await callTool("inspect_thread", {
                thread_id: restoredDraft.selectedThreadId,
              });
              state.inspection = payload;
              const models = normalizeModels(payload.models);
              if (models.length) state.models = models;
              state.model = state.models.some((model) => model.id === restoredDraft.model)
                ? restoredDraft.model
                : selectedModelDefault();
              initializeClassifications();
              const fallbackRequest = text(payload.replay?.request || payload.thread?.request);
              applyDraftToInspection(restoredDraft);
              state.reviewDraft = state.reviewDraft || reviewDraftFromConfiguration();
              state.promptGeneration = text(
                payload.replay?.request_generation?.method ||
                payload.thread?.request_generation?.method,
                "concatenated_fallback"
              );
              if (state.promptGeneration === "pending") {
                synthesis = {
                  threadId: restoredDraft.selectedThreadId,
                  fallbackRequest,
                };
              }
              state.step = restoredDraft.step === "thread" ? "thread" : "configure";
            } catch (error) {
              state.inspection = {
                replay: selected || { imported_thread_id: restoredDraft.selectedThreadId },
                diagnostics: [{
                  step: "inspection",
                  message: error instanceof Error ? error.message : String(error),
                }],
              };
              state.reviewDraft = normalizeReviewDraft(restoredDraft.reviewDraft) || reviewDraftFromConfiguration();
              state.reviewDraft.request = "";
              state.promptGeneration = "concatenated_fallback";
              state.step = "configure";
              state.error = "";
            }
          }
        } catch (error) {
          state.error = error instanceof Error ? error.message : String(error);
          state.hostReady = false;
        } finally {
          draftPersistenceReady = state.hostReady;
          state.loading = false;
          render({ focus: true });
        }
        if (synthesis) {
          void synthesizePrompt(synthesis.threadId, synthesis.fallbackRequest);
        }
        if (state.selectedThreadId && !text(state.reviewDraft?.repo)) {
          void inferWorkingDirectory(state.selectedThreadId);
        }
      }

      async function selectThread(id, number) {
        if (state.busy || state.run) return;
        const selected = state.threads.find((thread) => threadId(thread) === id);
        if (!selected) return;
        let fallbackRequest = "";
        let shouldSynthesize = false;
        state.busy = "inspection";
        state.error = "";
        state.notice = "";
        state.selectedThreadId = id;
        state.selectedThreadNumber = Number.isInteger(number) && number > 0 ? number : 0;
        state.selectedThread = selected;
        state.inspection = null;
        state.classifications = Object.create(null);
        state.reviewDraft = null;
        state.configurationStep = 0;
        state.configurationMaxStep = 0;
        state.reviewRevision += 1;
        state.promptGeneration = "";
        state.promptEditRevision = 0;
        state.promptSynthesisGeneration += 1;
        state.workingDirectoryEditRevision = 0;
        state.workingDirectoryGeneration += 1;
        state.workingDirectoryLoading = false;
        state.preparation = null;
        render();
        try {
          const payload = await callTool("inspect_thread", { thread_id: id });
          state.inspection = payload;
          const models = normalizeModels(payload.models);
          if (models.length) state.models = models;
          if (!state.models.some((model) => model.id === state.model)) {
            state.model = selectedModelDefault();
          }
          initializeClassifications();
          state.reviewDraft = reviewDraftFromConfiguration();
          fallbackRequest = text(payload.replay?.request || payload.thread?.request);
          state.promptGeneration = text(
            payload.replay?.request_generation?.method ||
            payload.thread?.request_generation?.method,
            "concatenated_fallback"
          );
          shouldSynthesize = state.promptGeneration === "pending";
          state.workingDirectoryLoading = true;
          state.step = "configure";
        } catch (error) {
          state.inspection = {
            replay: selected,
            diagnostics: [{
              step: "inspection",
              message: error instanceof Error ? error.message : String(error),
            }],
          };
          initializeClassifications();
          state.reviewDraft = reviewDraftFromConfiguration();
          state.promptGeneration = "concatenated_fallback";
          state.workingDirectoryLoading = true;
          state.step = "configure";
        } finally {
          state.busy = "";
          render({ focus: true });
        }
        if (shouldSynthesize) {
          void synthesizePrompt(id, fallbackRequest);
        }
        void inferWorkingDirectory(id);
      }

      function setConfigurationStep(index) {
        const next = Math.min(Math.max(index, 0), CONFIGURATION_STEPS.length - 1);
        state.configurationStep = next;
        state.configurationMaxStep = Math.max(state.configurationMaxStep, next);
        state.error = "";
        state.notice = "";
        saveDraft();
        render({ focus: true });
      }

      async function refreshAttributionAndContinue() {
        state.busy = "attribution";
        state.preparation = null;
        state.error = "";
        state.notice = "";
        const reviewRevision = state.reviewRevision;
        render();
        try {
          const preparation = await callTool("prepare_run", reviewPayload());
          if (
            reviewRevision !== state.reviewRevision ||
            state.step !== "configure" ||
            !state.reviewDraft
          ) return;
          applyPreparationInspection(preparation);
          state.preparation = null;
          state.configurationStep = 3;
          state.configurationMaxStep = Math.max(state.configurationMaxStep, 3);
          saveDraft();
        } catch (error) {
          if (reviewRevision === state.reviewRevision && state.step === "configure") {
            state.error = error instanceof Error ? error.message : String(error);
          }
        } finally {
          state.busy = "";
          render({ focus: true });
        }
      }

      async function nextConfigurationStep() {
        const problems = configurationStepProblems(state.configurationStep);
        if (problems.length) {
          state.error = "";
          state.notice = "";
          render({ focus: true });
          return;
        }
        if (state.configurationStep === 2 && selectionNeedsRefresh()) {
          await refreshAttributionAndContinue();
          return;
        }
        setConfigurationStep(state.configurationStep + 1);
      }

      function previousConfigurationStep() {
        if (state.configurationStep === 0) {
          state.step = "thread";
          state.error = "";
          state.notice = "";
          saveDraft();
          render({ focus: true });
          return;
        }
        setConfigurationStep(state.configurationStep - 1);
      }

      async function prepareRun() {
        if (selectionNeedsRefresh()) {
          state.configurationStep = 2;
          state.error = "";
          state.notice = "";
          render({ focus: true });
          return;
        }
        const problems = reviewProblems();
        if (problems.length) {
          state.error = "";
          state.notice = "";
          const invalidStep = [0, 1, 2, 3].find(
            (index) => configurationStepProblems(index).length
          );
          if (invalidStep !== undefined) state.configurationStep = invalidStep;
          render({ focus: true });
          return;
        }
        if (state.promptGeneration === "pending") {
          state.promptSynthesisGeneration += 1;
          state.promptGeneration = "concatenated_fallback";
          recordPromptGeneration({ method: "concatenated_fallback" });
        }
        state.busy = "prepare";
        state.preparation = null;
        state.error = "";
        state.notice = "";
        const reviewRevision = state.reviewRevision;
        const configuration = reviewPayload();
        let shouldStart = false;
        render();
        try {
          const preparation = await callTool("prepare_run", configuration);
          if (
            reviewRevision !== state.reviewRevision ||
            state.step !== "configure" ||
            !state.reviewDraft
          ) return;
          state.preparation = preparation;
          applyPreparationInspection(preparation);
          shouldStart = preparationReady();
        } catch (error) {
          if (reviewRevision === state.reviewRevision && state.step === "configure") {
            state.error = error instanceof Error ? error.message : String(error);
          }
        } finally {
          state.busy = "";
          if (shouldStart) await startRun();
          else render({ focus: true });
        }
      }

      async function startRun() {
        if (!preparationReady()) return;
        state.busy = "start";
        state.error = "";
        state.notice = "";
        startPending = true;
        clearDraft();
        render();
        try {
          const approvedRunConfiguration = approvedConfiguration();
          const payload = await callTool("start_run", {
            ...approvedRunConfiguration,
            approved: true,
            prepare_token: text(
              state.preparation?.prepare_token ||
              state.preparation?.approval?.prepare_token
            ),
          });
          const run = runRecord(payload);
          const id = currentRunId(payload);
          if (!run || !id) {
            throw new Error("The controller started no durable run.");
          }
          state.run = run;
          state.runId = id;
          state.step = "run";
          clearDraft();
          restoredDraft = null;
          startPending = false;
          state.busy = "";
          render({ focus: true });
          beginPolling();
        } catch (error) {
          startPending = false;
          state.error = error instanceof Error ? error.message : String(error);
          state.busy = "";
          render();
        }
      }

      async function refreshRun({ continuePolling = false } = {}) {
        if (!state.runId || state.busy === "run") return;
        state.busy = "run";
        try {
          const payload = await callTool("get_run", { run_id: state.runId });
          const run = runRecord(payload);
          if (run) state.run = run;
          state.error = "";
        } catch (error) {
          state.error = error instanceof Error ? error.message : String(error);
        } finally {
          state.busy = "";
          render();
        }
        if (successfulRunStatus(state.run?.status)) {
          await loadReport({ navigate: state.step === "run" });
          return;
        }
        if (continuePolling && !terminalRunStatus(state.run?.status)) {
          schedulePoll();
        }
      }

      async function cancelRun() {
        if (!state.runId || terminalRunStatus(state.run?.status) || state.busy) return;
        state.pollGeneration += 1;
        state.busy = "cancel";
        state.error = "";
        render();
        try {
          const payload = await callTool("cancel_run", { run_id: state.runId });
          const run = runRecord(payload);
          if (run) state.run = run;
        } catch (error) {
          state.error = error instanceof Error ? error.message : String(error);
        } finally {
          state.busy = "";
          render({ focus: true });
        }
      }

      function schedulePoll() {
        const generation = state.pollGeneration;
        window.setTimeout(() => {
          if (generation !== state.pollGeneration) return;
          refreshRun({ continuePolling: true });
        }, 1800);
      }

      function beginPolling() {
        state.pollGeneration += 1;
        schedulePoll();
      }

      async function loadReport({ navigate = true } = {}) {
        if (!state.runId || state.busy === "report") return;
        state.busy = "report";
        state.error = "";
        render();
        try {
          const payload = await callTool("get_report", { run_id: state.runId });
          const report = isObject(payload.report) ? payload.report : payload;
          if (!isObject(report)) throw new Error("The report response was empty.");
          state.report = report;
          state.reportPaths = {
            report_json: text(payload.report_json),
            report_html: text(payload.report_html),
          };
          if (navigate && state.step === "run") state.step = "results";
          state.pollGeneration += 1;
        } catch (error) {
          state.error = error instanceof Error ? error.message : String(error);
        } finally {
          state.busy = "";
          render({ focus: navigate && state.step === "results" });
        }
      }

      async function copyReportPath() {
        const value = text(state.reportPaths?.report_json);
        if (!value) return;
        try {
          await navigator.clipboard.writeText(value);
          state.notice = "Report path copied.";
        } catch {
          state.error = "Clipboard access is unavailable. Select the report path shown on the page.";
        }
        render();
      }

      async function downloadReport(format) {
        if (!state.runId || !["json", "html"].includes(format)) return;
        const sessionToken = controllerSessionToken();
        if (!sessionToken) {
          state.error =
            "This browser session has expired. Invoke the plugin again to reopen the controller.";
          render();
          return;
        }
        try {
          const response = await fetch("/api/download", {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json",
              "X-Codex-Bakeoff-Session": sessionToken,
            },
            body: JSON.stringify({ run_id: state.runId, format }),
          });
          if (!response.ok) {
            let detail = "";
            try {
              const payload = await response.json();
              detail = text(payload.error || payload.content?.[0]?.text);
            } catch {
              // Fall back to the status-based message below.
            }
            throw new Error(detail || `The report download failed (${response.status}).`);
          }
          const url = URL.createObjectURL(await response.blob());
          const link = document.createElement("a");
          link.href = url;
          link.download = `codex-bakeoff-${state.runId}-report.${format}`;
          document.body.append(link);
          try {
            link.click();
          } finally {
            link.remove();
            URL.revokeObjectURL(url);
          }
          state.error = "";
          state.notice = `${format.toUpperCase()} report download started.`;
        } catch (error) {
          state.error = error instanceof Error ? error.message : String(error);
        }
        render();
      }

      app.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (!target || target.disabled) return;
        const action = target.dataset.action;
        if (action === "retry-init") initialize();
        if (action === "refresh-threads") loadThreads(state.query);
        if (action === "select-thread") {
          selectThread(target.dataset.threadId || "", Number(target.dataset.threadNumber));
        }
        if (action === "configuration-next") nextConfigurationStep();
        if (action === "configuration-back") previousConfigurationStep();
        if (action === "configuration-step") {
          const index = Number(target.dataset.configurationStep);
          if (Number.isInteger(index) && index <= state.configurationMaxStep) {
            setConfigurationStep(index);
          }
        }
        if (action === "approve-configuration") prepareRun();
        if (action === "refresh-run") refreshRun();
        if (action === "cancel-run") cancelRun();
        if (action === "load-report") loadReport();
        if (action === "copy-report-path") copyReportPath();
        if (action === "download-report") downloadReport(target.dataset.format || "");
        if (action === "reset-controller") resetController();
        if (action === "go-step") {
          const step = target.dataset.step;
          if (!step || !canNavigateTo(step)) return;
          state.error = "";
          state.notice = "";
          state.step = step;
          render({ focus: true });
        }
      });

      app.addEventListener("input", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement)) return;
        if (target.id === "thread-search") {
          state.query = target.value;
          render();
          requestAnimationFrame(() => {
            const input = document.getElementById("thread-search");
            if (input) {
              input.focus();
              input.setSelectionRange(state.query.length, state.query.length);
            }
          });
        }
        const reviewFields = {
          "review-message-uuid": "message_uuid",
          "review-model": "model",
          "review-request": "request",
          "review-repo": "repo",
          "review-baseline-commit": "baseline_commit",
          "review-ending-commit": "ending_commit",
          "review-timeout": "timeout_seconds",
        };
        const reviewKey = reviewFields[target.id];
        if (reviewKey && state.reviewDraft) {
          state.reviewDraft[reviewKey] = target.value;
          if (reviewKey === "request") state.promptEditRevision += 1;
          if (reviewKey === "repo") state.workingDirectoryEditRevision += 1;
          if (reviewKey === "model") state.model = target.value;
          invalidateReviewPreparation();
          saveDraft();
        }
      });

      app.addEventListener("change", (event) => {
        const target = event.target;
        if (!(
          target instanceof HTMLInputElement ||
          target instanceof HTMLSelectElement ||
          target instanceof HTMLTextAreaElement
        )) return;
        state.error = "";
        state.notice = "";
        if (target.id === "review-model" && state.reviewDraft) {
          state.reviewDraft.model = target.value;
          state.model = target.value;
          invalidateReviewPreparation();
          render();
          return;
        }
        if (target.id === "review-beginning-kind" && state.reviewDraft) {
          state.reviewDraft.beginning_kind = target.value;
          if (target.value === "git") state.reviewDraft.ending_kind = "git";
          invalidateReviewPreparation();
          render();
          return;
        }
        if (target.id === "review-ending-kind" && state.reviewDraft) {
          state.reviewDraft.ending_kind = target.value;
          invalidateReviewPreparation();
          render();
          return;
        }
        if (target.dataset.fileKind === "git") {
          state.classifications[target.dataset.path] = target.checked ? "claude" : "exclude";
          invalidateConfigurationReview();
          render();
          return;
        }
        if (target.dataset.fileKind === "non_git") {
          state.classifications[target.dataset.path] = target.value;
          invalidateConfigurationReview();
          render();
        }
      });

      window.addEventListener("pagehide", saveDraft);

      initialize();
    })();
  </script>
</body>
</html>
